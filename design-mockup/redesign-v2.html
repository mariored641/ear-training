    background:
      linear-gradient(180deg, rgba(13, 42, 122, 0.85), rgba(10, 31, 92, 0.92));
    border-right: 1.5px solid var(--glass-border);
    backdrop-filter: blur(16px);
    box-shadow: 4px 0 40px rgba(0, 0, 0, 0.5),
                inset -1px 0 0 rgba(180, 210, 255, 0.08);
    transform: translateX(-105%);
    transition: transform 0.32s cubic-bezier(0.2, 0.7, 0.2, 1);
    display: flex; flex-direction: column;
    direction: rtl;
  }
  .levels-drawer.open { transform: translateX(0); }

  .levels-drawer-header {
    padding: 18px 20px 14px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(180, 210, 255, 0.12);
  }
  .levels-drawer-title {
    margin: 0;
    font-size: 17px; font-weight: 700;
    color: var(--text);
    display: flex; align-items: center; gap: 10px;
  }
  .levels-drawer-title .ex-tag {
    font-size: 11px; letter-spacing: 1.5px;
    color: var(--accent);
    padding: 3px 8px; border-radius: 6px;
    background: rgba(110, 168, 255, 0.15);
    border: 1px solid rgba(110, 168, 255, 0.3);
  }
  .levels-drawer-close {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-dim);
    width: 32px; height: 32px;
    border-radius: 50%;
    font-size: 16px; cursor: pointer;
    font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease;
  }
  .levels-drawer-close:hover {
    background: rgba(255,255,255,0.14);
    color: var(--text);
  }

  .levels-drawer-list {
    list-style: none;
    margin: 0; padding: 12px;
    overflow-y: auto;
    flex: 1;
    display: flex; flex-direction: column; gap: 6px;
  }
  .levels-drawer-list::-webkit-scrollbar { width: 6px; }
  .levels-drawer-list::-webkit-scrollbar-thumb {
    background: rgba(180, 210, 255, 0.2);
    border-radius: 3px;
  }

  .level-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.03);
    border: 1.5px solid transparent;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .level-item:hover {
    background: rgba(110, 168, 255, 0.1);
    border-color: rgba(180, 210, 255, 0.2);
  }
  .level-item.active {
    background: rgba(110, 168, 255, 0.18);
    border-color: var(--accent);
    box-shadow: 0 0 18px rgba(110, 168, 255, 0.35),
                inset 0 0 14px rgba(110, 168, 255, 0.08);
  }
  .level-item.locked { opacity: 0.45; cursor: not-allowed; }
  .level-item.locked:hover {
    background: rgba(255,255,255,0.03);
    border-color: transparent;
  }
  .level-item-num {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    border: 1.5px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .level-item.active .level-item-num {
    background: var(--accent);
    border-color: var(--accent-2);
    color: #051030;
    box-shadow: 0 0 12px rgba(110, 168, 255, 0.7);
  }
  .level-item.completed .level-item-num {
    background: rgba(120, 220, 180, 0.25);
    border-color: rgba(120, 220, 180, 0.6);
    color: #e0fff0;
  }
  .level-item-label {
    flex: 1;
    font-size: 13px; font-weight: 500;
    color: var(--text);
  }
  .level-item.active .level-item-label { color: var(--accent-2); font-weight: 600; }
  .level-item-icon { font-size: 13px; color: var(--text-dim); }
  .level-item.completed .level-item-icon { color: rgba(120, 220, 180, 0.9); }

  /* ---- Settings strip (mirrors melodic-settings-strip pattern) ----
     Justification: identical visual to the melodic fragment's settings
     strip — same separator + same strip-title, so it inherits the
     melodic naming and behaves identically across sections. */
  .guitar-settings-strip {
    width: 100%;
    max-width: 900px;
    border-top: 1px dashed rgba(180, 210, 255, 0.18);
    padding-top: 16px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .guitar-settings-strip .strip-title {
    font-size: 10px; letter-spacing: 1.5px;
    color: var(--text-dim); text-transform: uppercase;
  }

  /* ---- G1 — Note progress dots (NoteIndicator equivalent) ----
     Justification: the React `NoteIndicator` shows ●●○○○ — current
     note in the played melody, plus filled dots for notes already
     placed. Canon has no chip series for "find note 2 of 5", and we
     want it distinct from `.ans-chip`. */
  .guitar-note-indicator {
    display: flex; gap: 10px; align-items: center;
    padding: 8px 14px;
    background: rgba(255,255,255,0.04);
    border: 1.5px solid var(--glass-border);
    border-radius: 999px;
    backdrop-filter: blur(8px);
  }
  .guitar-note-indicator .ni-label {
    font-size: 11px; color: var(--text-dim);
    letter-spacing: 0.8px; margin-inline-end: 4px;
  }
  .guitar-note-dot {
    width: 18px; height: 18px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(180,210,255,0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; color: var(--text-dim);
    transition: all 0.2s ease;
  }
  .guitar-note-dot.done {
    background: rgba(120, 220, 180, 0.3);
    border-color: rgba(120, 220, 180, 0.7);
    color: #e0fff0;
  }
  .guitar-note-dot.current {
    background: var(--accent);
    border-color: var(--accent-2);
    color: #051030;
    box-shadow: 0 0 14px rgba(110, 168, 255, 0.7);
    animation: noteDotPulse 1.4s ease-in-out infinite alternate;
  }
  @keyframes noteDotPulse {
    from { box-shadow: 0 0 8px rgba(110, 168, 255, 0.45); }
    to   { box-shadow: 0 0 20px rgba(110, 168, 255, 0.95); }
  }

  /* ---- G1 — Fretboard cells need to be clickable + show hover state +
            a "target" highlight where the correct answer lives.
     Justification: canon `.fb-cell` is a passive grid cell; G1 needs
     interactivity. We extend it via modifier classes rather than
     redefine the layout. */
  .fb-cell.guitar-fret-cell {
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.15s ease;
  }
  .fb-cell.guitar-fret-cell:hover {
    background: rgba(110, 168, 255, 0.12);
  }
  /* a string the level disables (e.g. level 1 = only A string) */
  .fb-cell.guitar-fret-disabled {
    cursor: not-allowed;
    opacity: 0.35;
  }
  .fb-cell.guitar-fret-disabled:hover { background: transparent; }
  /* a fret outside the level range (e.g. pos5 = frets 5-8 only) */
  .fb-cell.guitar-fret-out-of-range {
    background: rgba(0,0,0,0.25);
    opacity: 0.5;
  }
  .fb-cell.guitar-fret-out-of-range:hover { background: rgba(0,0,0,0.25); }

  /* the correct answer cell — pulsing target ring (visible after wrong
     guess, or as a "hint" reveal). Distinct from canon .fb-dot.root
     (which is a static colored dot) because this is a transient
     teaching hint. */
  .guitar-fret-target {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 28px; height: 28px; border-radius: 50%;
    border: 2.5px dashed var(--accent-2);
    box-shadow: 0 0 18px rgba(110, 168, 255, 0.7),
                inset 0 0 10px rgba(110, 168, 255, 0.25);
    animation: targetPulse 1.2s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes targetPulse {
    from { transform: translate(-50%, -50%) scale(0.85); opacity: 0.7; }
    to   { transform: translate(-50%, -50%) scale(1.05); opacity: 1;   }
  }

  /* a fb-dot the student already placed correctly (filled with sequence
     number) — adopts the `.fb-dot` look but uses the green "correct"
     tint to match `.guitar-note-dot.done`. */
  .fb-dot.guitar-fret-placed {
    background: rgba(120, 220, 180, 0.85);
    box-shadow: 0 0 14px rgba(120, 220, 180, 0.7);
    color: #051030;
  }

  /* ---- G1 — Fretboard range overlay banner ----
     Justification: the level limits range (e.g. "pos5 = frets 5-8");
     we need to communicate that visually above the fretboard. Canon
     has no banner element. */
  .guitar-range-banner {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 14px;
    background: rgba(110, 168, 255, 0.08);
    border: 1px solid rgba(110, 168, 255, 0.25);
    border-radius: 999px;
    font-size: 12px; color: var(--accent-2);
    letter-spacing: 0.3px;
  }
  .guitar-range-banner .v {
    color: var(--text); font-weight: 700; margin-inline-start: 4px;
  }
  .guitar-range-banner .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 6px var(--accent);
  }

  /* ---- G1 — String filter chips ----
     A row of 6 mini chips showing which strings are "live" for this
     level. Distinct from `.ans-chip` because they aren't answers, and
     distinct from `.pill-toggle` because they include a visual
     enabled/disabled state with a strikethrough feel for off strings.
     Justification: no canon class for a string-by-string subset
     visualization. */
  .guitar-string-filter {
    display: flex; gap: 6px; align-items: center;
  }
  .guitar-string-filter .gsf-label {
    font-size: 11px; color: var(--text-dim);
    letter-spacing: 0.8px; margin-inline-end: 4px;
  }
  .guitar-string-chip {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(110, 168, 255, 0.18);
    border: 1.5px solid var(--accent);
    color: var(--text);
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-family: inherit;
    transition: all 0.2s ease;
  }
  .guitar-string-chip:hover { transform: translateY(-2px); }
  .guitar-string-chip.off {
    background: rgba(255,255,255,0.03);
    border-color: rgba(255,255,255,0.15);
    color: var(--text-dim);
    text-decoration: line-through;
    opacity: 0.55;
  }

  /* ---- G1 — Fretboard wrapper that anchors the legend ----
     Just a container — only used so the legend & range banner sit
     visually attached to the fretboard. */
  .guitar-fretboard-wrap {
    width: 100%;
    max-width: min(960px, 95vw);
    display: flex; flex-direction: column; gap: 10px;
    align-items: center;
  }

  /* ---- G1 — Fretboard legend (root / arp / your taps / target) ----
     Justification: the React UI uses NoteIndicator + colored dots on
     the fretboard; the user needs a small legend to read them.
     Canon has no legend class. */
  .guitar-fb-legend {
    display: flex; gap: 14px; flex-wrap: wrap;
    justify-content: center;
    font-size: 11px; color: var(--text-dim);
  }
  .guitar-fb-legend .legend-item {
    display: inline-flex; align-items: center; gap: 6px;
  }
  .guitar-fb-legend .swatch {
    width: 12px; height: 12px; border-radius: 50%;
  }
  .guitar-fb-legend .swatch.scale  { background: rgba(180,210,255,0.35); }
  .guitar-fb-legend .swatch.placed { background: rgba(120,220,180,0.85); box-shadow: 0 0 6px rgba(120,220,180,0.7); }
  .guitar-fb-legend .swatch.target {
    background: transparent;
    border: 2px dashed var(--accent-2);
    box-shadow: 0 0 6px rgba(110,168,255,0.7);
  }

  /* ---- standalone preview helpers (only used when opened alone) ---- */
  .preview-section {
    position: relative;
    min-height: 100vh;
  }
  .preview-section + .preview-section {
    border-top: 1px dashed rgba(180, 210, 255, 0.12);
  }
  .preview-marker {
    position: absolute; top: 50px; left: 50%;
    transform: translateX(-50%);
    z-index: 75;
    background: rgba(0, 0, 0, 0.5);
    color: var(--accent-2);
    border: 1px solid rgba(180, 210, 255, 0.25);
    padding: 6px 16px; border-radius: 999px;
    font-size: 11px; letter-spacing: 1.2px;
    backdrop-filter: blur(10px);
  }


/* ============ reactive ============ */

  /* ---- reactive-pulse-ring ----
     Replaces the canon .play-pad for R1/R2. Three concentric expanding
     rings telegraph the audible pulse (chord onset / progression beat)
     so the user has both auditory and visual cues for "react now".
     Justification: the standard .play-pad is a single click target with
     no implicit rhythm; reactive needs a visible heartbeat. */
  .reactive-pulse-ring {
    position: relative;
    width: clamp(180px, 28vmin, 280px);
    height: clamp(180px, 28vmin, 280px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .reactive-pulse-ring::before,
  .reactive-pulse-ring::after,
  .reactive-pulse-ring .ring-extra {
    content: '';
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 2px solid var(--reactive-cool);
    opacity: 0;
    animation: reactivePulse 1.8s ease-out infinite;
    pointer-events: none;
  }
  .reactive-pulse-ring::after  { animation-delay: 0.6s; }
  .reactive-pulse-ring .ring-extra { animation-delay: 1.2s; }
  @keyframes reactivePulse {
    0%   { transform: scale(0.45); opacity: 0.0; }
    18%  { opacity: 0.85; }
    100% { transform: scale(1.12); opacity: 0; }
  }
  .reactive-pulse-core {
    position: relative; z-index: 2;
    width: 55%; aspect-ratio: 1 / 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,0.28), rgba(255,255,255,0.04) 70%),
      linear-gradient(135deg, rgba(126, 234, 255, 0.55), rgba(255, 209, 102, 0.35));
    border: 2px solid rgba(180, 230, 255, 0.7);
    box-shadow:
      0 0 50px var(--reactive-cool-glow),
      inset 0 0 28px rgba(255,255,255,0.12);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(34px, 5.5vmin, 56px);
    color: #fff;
    text-shadow: 0 0 14px rgba(0,0,0,0.4);
    transition: transform 0.15s ease;
  }
  .reactive-pulse-ring:hover .reactive-pulse-core {
    transform: scale(1.05);
  }
  /* "Hot" mode — flashes briefly when the chord onset hits, then cools */
  .reactive-pulse-ring.hot .reactive-pulse-core {
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,0.4), rgba(255,255,255,0.04) 70%),
      linear-gradient(135deg, var(--reactive-hot), var(--reactive-hotter));
    box-shadow:
      0 0 70px var(--reactive-hot-glow),
      inset 0 0 30px rgba(255,255,255,0.18);
  }

  /* ---- reactive-hud — three big readouts above the ring ----
     Streak / Reaction-time / Accuracy.
     Justification: in fast-reaction mode the existing .ex-progress
     line ("שאלה 1/10") is insufficient — the user needs to keep
     attention on the ring, so the three numbers must be readable
     in peripheral vision at large sizes. */
  .reactive-hud {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
    width: 100%;
    max-width: 640px;
  }
  .reactive-hud-tile {
    background: var(--glass-bg);
    border: 1.5px solid var(--glass-border);
    backdrop-filter: blur(10px);
    border-radius: 18px;
    padding: 12px 14px;
    text-align: center;
    box-shadow: 0 6px 22px rgba(0,0,0,0.2);
    position: relative;
    overflow: hidden;
  }
  .reactive-hud-tile .hud-label {
    font-size: 10px; letter-spacing: 1.3px;
    color: var(--text-dim); text-transform: uppercase;
    margin-bottom: 4px; display: block;
  }
  .reactive-hud-tile .hud-value {
    font-size: clamp(22px, 3.4vmin, 30px);
    font-weight: 800;
    color: var(--text);
    line-height: 1.15;
    font-variant-numeric: tabular-nums;
  }
  .reactive-hud-tile .hud-unit {
    font-size: 12px; color: var(--text-dim);
    font-weight: 500; margin-inline-start: 4px;
  }
  /* Streak tile — flame ramp, brightens with the number */
  .reactive-hud-tile.reactive-streak .hud-value {
    color: var(--reactive-hot);
    text-shadow: 0 0 14px var(--reactive-hot-glow);
  }
  .reactive-hud-tile.reactive-streak::before {
    content: '🔥';
    position: absolute; top: 6px; right: 8px;
    font-size: 16px; opacity: 0.7;
    filter: drop-shadow(0 0 8px var(--reactive-hot-glow));
  }
  /* Reaction-time tile — cool color, monospace look */
  .reactive-hud-tile.reactive-reaction-display .hud-value {
    color: var(--reactive-cool);
    text-shadow: 0 0 12px var(--reactive-cool-glow);
  }
  .reactive-hud-tile.reactive-reaction-display::before {
    content: '⚡';
    position: absolute; top: 6px; right: 8px;
    font-size: 16px; opacity: 0.85;
    filter: drop-shadow(0 0 8px var(--reactive-cool-glow));
  }
  /* Accuracy tile — neutral accent */
  .reactive-hud-tile.reactive-accuracy::before {
    content: '🎯';
    position: absolute; top: 6px; right: 8px;
    font-size: 16px; opacity: 0.75;
  }

  /* ---- reactive-tempo-meter — horizontal beat strip under the ring ----
     Visualizes the 4-beat cycle at the current tempo. The "filled"
     cell is the beat about to fire (chord onset). Helps the user
     anticipate the next stimulus, much like a metronome strip.
     Justification: there's no canon beat-strip; we cannot reuse
     .chord-grid because that's for 1-bar chord cells with text. */
  .reactive-tempo-meter {
    display: flex; gap: 6px;
    align-items: center; justify-content: center;
    margin-top: -8px;
  }
  .reactive-tempo-meter .beat-cell {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1.5px solid var(--glass-border);
    transition: all 0.15s ease;
  }
  .reactive-tempo-meter .beat-cell.on {
    background: var(--reactive-cool);
    border-color: #fff;
    box-shadow: 0 0 14px var(--reactive-cool-glow);
    transform: scale(1.25);
  }
  .reactive-tempo-meter .beat-cell.downbeat.on {
    background: var(--reactive-hot);
    box-shadow: 0 0 18px var(--reactive-hot-glow);
  }
  .reactive-tempo-meter .bpm-readout {
    margin-inline-start: 14px;
    font-size: 13px; color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .reactive-tempo-meter .bpm-readout strong {
    color: var(--reactive-cool); font-size: 16px; font-weight: 800;
    margin-inline-end: 4px;
  }

  /* ---- reactive-fast-chips — extra-large answer chips for speed taps ----
     Justification: the canon .ans-chip is a pill ~36px tall. In a
     reaction-time setting the user's eyes are on the ring; they need
     a thumb-sized target with strong color cues. Extends .ans-chip
     with a modifier so canon styles still cascade. */
  .ex-answers.reactive-fast-chips {
    gap: 14px;
    max-width: 720px;
  }
  .ans-chip.reactive-fast-chip {
    min-width: 100px;
    min-height: 64px;
    padding: 14px 24px;
    border-radius: 18px;
    font-size: clamp(16px, 2.3vmin, 22px);
    font-weight: 700;
    letter-spacing: 0.5px;
    box-shadow:
      0 4px 16px rgba(0,0,0,0.25),
      inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .ans-chip.reactive-fast-chip:hover {
    border-color: var(--reactive-cool);
    box-shadow:
      0 8px 24px rgba(126, 234, 255, 0.3),
      inset 0 1px 0 rgba(255,255,255,0.18);
  }
  .ans-chip.reactive-fast-chip.correct {
    background: rgba(120, 230, 160, 0.22);
    border-color: rgba(140, 240, 180, 0.85);
    box-shadow: 0 0 24px rgba(120, 230, 160, 0.5);
    color: #e9ffec;
  }
  .ans-chip.reactive-fast-chip.wrong {
    background: rgba(255, 110, 130, 0.22);
    border-color: rgba(255, 140, 160, 0.85);
    box-shadow: 0 0 24px rgba(255, 110, 130, 0.45);
    color: #ffe9ec;
  }

  /* ---- reactive-progression-strip — R2 only ----
     Shows the looping chord progression with a moving "now" highlight.
     Each cell is a Roman-numeral degree placeholder; the active one
     glows hot. Used together with the pulse-ring above it.
     Justification: there's no canon class for a moving cursor over
     a labeled bar-strip; .chord-grid is a 4-col grid with chord text,
     too dense visually for the reactive context. */
  .reactive-progression-strip {
    display: flex; gap: 8px;
    align-items: stretch; justify-content: center;
    width: 100%; max-width: 640px;
    padding: 10px 12px;
    background: var(--glass-bg);
    border: 1.5px solid var(--glass-border);
    border-radius: 16px;
    backdrop-filter: blur(8px);
  }
  .reactive-progression-strip .prog-cell {
    flex: 1;
    min-height: 56px;
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border: 1.5px solid var(--glass-border);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2px;
    font-weight: 700;
    transition: all 0.2s ease;
    position: relative;
  }
  .reactive-progression-strip .prog-cell .deg {
    font-size: clamp(15px, 2.1vmin, 19px);
    color: var(--text);
  }
  .reactive-progression-strip .prog-cell .chord-name {
    font-size: 10px; color: var(--text-dim);
    font-weight: 500;
  }
  .reactive-progression-strip .prog-cell.active {
    background: linear-gradient(135deg,
                  rgba(126, 234, 255, 0.35),
                  rgba(255, 209, 102, 0.25));
    border-color: var(--reactive-cool);
    box-shadow:
      0 0 22px var(--reactive-cool-glow),
      inset 0 0 18px rgba(255,255,255,0.08);
    transform: translateY(-2px);
  }
  .reactive-progression-strip .prog-cell.active .deg {
    color: #fff; text-shadow: 0 0 12px var(--reactive-cool-glow);
  }
  .reactive-progression-strip .prog-cell.past {
    opacity: 0.45;
  }

  /* ---- reactive-scoring-toggle — Accuracy vs Streak vs Marathon ----
     Justification: the canon .pill-toggle gives a flat row; for the
     scoring mode we want the chosen option to read as a primary
     setting (larger, with an icon), so we extend the toggles-row. */
  .toggles-row.reactive-scoring-toggle .pill-toggle {
    padding: 8px 16px;
    font-size: 12px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .toggles-row.reactive-scoring-toggle .pill-toggle.active {
    background: linear-gradient(135deg,
                  rgba(126, 234, 255, 0.28),
                  rgba(110, 168, 255, 0.18));
    border-color: var(--reactive-cool);
    color: #fff;
    box-shadow: 0 0 16px var(--reactive-cool-glow);
  }
  .toggles-row.reactive-scoring-toggle .pill-toggle .mode-icon {
    font-size: 14px; line-height: 1;
  }


/* ============ dictation ============ */


  /* ============================================================
     RHYTHMIC DICTATION
     ============================================================
     The Rhythmic Dictation exercise is a complex tool that needs a
     visual representation of a rhythm grid (4 bars × 4 beats × 4
     subdivisions). No canon class exists for a 2-D rhythm grid, so
     we introduce `dictation-rhythm-grid` and friends. The duration
     palette uses canon `.ans-chip` with a `dictation-duration-chip`
     modifier so we keep the canonical pill look while enlarging the
     glyph.
     ============================================================ */

  /* ---- Phase banner ----
     Mirrors the .rt-phase indicator in RhythmDictation.jsx.
     Justification: communicates IDLE / PLAYING / WAITING / RECORDING /
     RESULT state — a critical part of this exercise's UX.            */
  .dictation-phase-banner {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 14px; font-weight: 600;
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid var(--glass-border);
    color: var(--text);
    transition: all 0.25s ease;
  }
  .dictation-phase-banner.phase-recording {
    background: rgba(255, 80, 80, 0.18);
    border-color: rgba(255, 120, 120, 0.55);
    color: #ffd6d6;
    box-shadow: 0 0 24px rgba(255, 80, 80, 0.35);
  }
  .dictation-phase-banner.phase-playing {
    background: rgba(110, 168, 255, 0.2);
    border-color: var(--accent);
    color: var(--accent-2);
    box-shadow: 0 0 18px rgba(110, 168, 255, 0.4);
  }
  .dictation-phase-banner.phase-waiting {
    background: rgba(255, 200, 100, 0.15);
    border-color: rgba(255, 220, 130, 0.5);
    color: #ffe9b8;
  }
  .dictation-phase-banner .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 8px currentColor;
    animation: dictationPulse 1.1s ease-in-out infinite alternate;
  }
  @keyframes dictationPulse {
    from { opacity: 0.4; }
    to   { opacity: 1; }
  }

  /* ---- Beat counter row ----
     Mirrors .rt-beat-row + .rt-beat-dot from RhythmDictation. A row
     of small "1 2 3 4 | 1 2 3 4 | ..." dots with the active beat
     highlighted. Sits ABOVE the rhythm input grid (the dots show the
     metronome position; the grid shows where the student's hits go). */
  .dictation-beat-counter {
    display: flex; align-items: center; gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .dictation-beat-counter .bar-sep {
    color: var(--text-dim);
    font-size: 22px; opacity: 0.5;
  }
  .dictation-beat-counter .bar-group {
    display: flex; gap: 6px;
  }
  .dictation-beat-dot {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    border: 1.5px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
    color: var(--text-dim);
    transition: all 0.18s ease;
  }
  .dictation-beat-dot.accent {
    border-color: rgba(180, 210, 255, 0.35);
  }
  .dictation-beat-dot.active-play {
    background: rgba(110, 168, 255, 0.4);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 16px rgba(110, 168, 255, 0.7);
    transform: scale(1.12);
  }
  .dictation-beat-dot.active-rec {
    background: rgba(255, 80, 80, 0.4);
    border-color: rgba(255, 120, 120, 0.8);
    color: #fff;
    box-shadow: 0 0 16px rgba(255, 80, 80, 0.7);
    transform: scale(1.12);
  }

  /* ---- Rhythm input grid ----
     ⭐ THE CENTERPIECE. A 2-D matrix where each ROW is a beat (across
     all bars), and each COLUMN is a 16th-note subdivision within that
     beat. Cells are clickable — clicking marks a "hit" at that
     subdivision. Cells on the downbeat (subdivision 0) are styled
     stronger. The accent column is the "&" eighth-note position.
     Justification: no canon component represents subdivided-beat input.
     `.chord-grid` from canon is for chord bars (4-column block grid);
     it isn't subdivision-aware. We invent a new class.            */
  .dictation-rhythm-grid {
    display: grid;
    gap: 6px;
    background: rgba(255, 255, 255, 0.03);
    border: 1.5px solid var(--glass-border);
    border-radius: 16px;
    padding: 16px;
    backdrop-filter: blur(10px);
    box-shadow: inset 0 0 30px rgba(110, 168, 255, 0.04);
    width: min(720px, 96vw);
  }
  .dictation-rhythm-grid-row {
    display: grid;
    grid-template-columns: 60px repeat(16, 1fr);
    gap: 4px;
    align-items: center;
  }
  .dictation-rhythm-grid-row.is-bar-divider {
    border-top: 1px dashed rgba(180, 210, 255, 0.18);
    padding-top: 8px;
    margin-top: 4px;
  }
  .dictation-rhythm-row-label {
    font-size: 11px; font-weight: 600;
    color: var(--text-dim);
    text-align: center;
    letter-spacing: 0.5px;
  }
  .dictation-rhythm-row-label .bar-num {
    color: var(--accent-2);
    font-weight: 700;
  }
  .dictation-rhythm-cell {
    aspect-ratio: 1 / 1;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(180, 210, 255, 0.1);
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    color: var(--text-dim);
    position: relative;
  }
  .dictation-rhythm-cell:hover {
    background: rgba(110, 168, 255, 0.15);
    border-color: rgba(180, 210, 255, 0.4);
  }
  /* Downbeat (subdivision 0) — slightly stronger */
  .dictation-rhythm-cell.is-downbeat {
    background: rgba(255, 255, 255, 0.07);
    border-color: rgba(180, 210, 255, 0.25);
  }
  /* The "&" eighth — visual separator */
  .dictation-rhythm-cell.is-eighth {
    background: rgba(255, 255, 255, 0.05);
  }
  /* Active hit — student has placed a note here */
  .dictation-rhythm-cell.is-hit {
    background: rgba(110, 168, 255, 0.55);
    border-color: var(--accent-2);
    color: #fff;
    box-shadow: 0 0 12px rgba(110, 168, 255, 0.65),
                inset 0 0 8px rgba(255, 255, 255, 0.2);
    font-weight: 700;
  }
  /* Expected onset position — shown during result phase */
  .dictation-rhythm-cell.is-expected {
    border-color: rgba(120, 220, 180, 0.65);
    box-shadow: 0 0 8px rgba(120, 220, 180, 0.4);
  }
  .dictation-rhythm-cell.is-expected.is-hit {
    background: rgba(120, 220, 180, 0.55);
    border-color: rgba(140, 240, 200, 0.95);
    box-shadow: 0 0 14px rgba(120, 220, 180, 0.7);
  }
  /* Missed expected — shows what was expected but not played */
  .dictation-rhythm-cell.is-missed {
    background: rgba(255, 100, 100, 0.18);
    border-color: rgba(255, 130, 130, 0.6);
  }
  /* Active column = where the metronome is currently sweeping */
  .dictation-rhythm-cell.is-now {
    border-color: var(--accent);
    box-shadow: 0 0 14px rgba(110, 168, 255, 0.85);
    animation: dictationCellPulse 0.4s ease-in-out;
  }
  @keyframes dictationCellPulse {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.18); }
    100% { transform: scale(1); }
  }

  /* ---- Duration palette ----
     Sits below the grid; chooses the duration glyph that gets
     "stamped" onto the next cell click. Reuses .ans-chip for the
     canon pill look, adds .dictation-duration-chip for the larger
     music-glyph typography.                                        */
  .ex-answers.dictation-duration-row {
    gap: 12px;
    max-width: 720px;
  }
  .ans-chip.dictation-duration-chip {
    padding: 10px 16px;
    min-width: 64px;
    display: inline-flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .ans-chip.dictation-duration-chip .glyph {
    font-size: 24px; line-height: 1;
    color: var(--accent-2);
    filter: drop-shadow(0 0 8px rgba(110, 168, 255, 0.55));
  }
  .ans-chip.dictation-duration-chip .glyph-label {
    font-size: 9px; letter-spacing: 0.8px; text-transform: uppercase;
    color: var(--text-dim);
  }
  .ans-chip.dictation-duration-chip.active .glyph { color: #fff; }
  .ans-chip.dictation-duration-chip.active .glyph-label { color: var(--accent-2); }

  /* ---- Submit / result bar ----
     Mirrors .rt-eval-bar from RhythmDictation. Justification: this
     exercise has explicit pass/fail per round with extra detail
     (matched / total / extra-hits). Canon .ans-chip alone doesn't
     express that.                                                  */
  .dictation-submit-row {
    display: flex; gap: 12px; align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }
  .dictation-submit-btn {
    background: linear-gradient(135deg, rgba(110, 168, 255, 0.55), rgba(42, 90, 255, 0.4));
    border: 1.5px solid var(--accent);
    color: #fff;
    padding: 12px 32px;
    border-radius: 999px;
    font-size: 15px; font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 0 30px rgba(110, 168, 255, 0.45);
    transition: all 0.2s ease;
  }
  .dictation-submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 30px rgba(180, 210, 255, 0.6);
  }
  .dictation-clear-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1.5px solid var(--glass-border);
    color: var(--text-dim);
    padding: 10px 20px; border-radius: 999px;
    font-size: 13px; font-family: inherit;
    cursor: pointer;
  }
  .dictation-clear-btn:hover {
    background: rgba(255, 100, 100, 0.18);
    border-color: rgba(255, 130, 130, 0.5);
    color: #ffd6d6;
  }

  /* ---- VU meter row ----
     Mirrors the .rt-vu-row + VUMeter component. The Rhythmic
     Dictation tool detects live mic onsets, so a VU meter is part
     of its identity. Built from 16 segments; lit segments green →
     yellow → red.                                                  */
  .dictation-vu-row {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px;
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid var(--glass-border);
    border-radius: 999px;
  }
  .dictation-vu-label { font-size: 14px; }
  .dictation-vu-meter {
    display: flex; gap: 3px;
    height: 18px;
  }
  .dictation-vu-seg {
    width: 6px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 1.5px;
    transition: background 0.05s linear;
  }
  .dictation-vu-seg.lit.green  { background: #4caf50; box-shadow: 0 0 5px #4caf50; }
  .dictation-vu-seg.lit.yellow { background: #ffc107; box-shadow: 0 0 5px #ffc107; }
  .dictation-vu-seg.lit.red    { background: #f44336; box-shadow: 0 0 5px #f44336; }
  .dictation-vu-rec {
    font-size: 11px; font-weight: 700;
    letter-spacing: 1.2px;
    color: #ff7878;
    text-shadow: 0 0 8px rgba(255, 120, 120, 0.7);
    animation: dictationPulse 1s ease-in-out infinite alternate;
  }

  /* ============================================================
     MELODIC DICTATION
     ============================================================
     The Melodic Dictation exercise asks the student to write the
     notes they heard onto a staff (or by clicking degree chips).
     We need:
       1. A staff with N empty SLOTS (one per beat).
       2. A bank of degree chips (Do/Re/Mi/…) that get placed into
          the active slot.
       3. A tonic key selector and a mode toggle (mic / button).
     Canon `.staff-mock` gives us the bare staff lines; canon
     `.ans-chip` gives us the chip look. We need the SLOT class
     specifically — that's the unique melodic-dictation widget.
     ============================================================ */

  /* ---- Staff with empty slots ----
     The wrapper around .staff-mock containing positioned slot
     buttons. Slots are clickable to receive the active degree.   */
  .dictation-melodic-staff-wrap {
    position: relative;
    width: min(640px, 96vw);
  }
  .dictation-melodic-staff-wrap .staff-mock {
    height: 150px;
    padding: 28px 40px;
  }
  /* Wraps the row of clickable slots overlaid on the staff. */
  .dictation-melodic-slots {
    position: absolute;
    top: 50%; left: 6%; right: 6%;
    transform: translateY(-50%);
    display: flex;
    justify-content: space-around;
    align-items: center;
    pointer-events: none; /* slots themselves re-enable */
  }
  /* A single empty slot — an ellipse outlined dashed waiting for a
     note. When filled, shows the degree name; on `current` shows a
     blinking ring. Replaces .staff-note for input mode.            */
  .dictation-melodic-slot {
    pointer-events: auto;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    border: 2px dashed rgba(180, 210, 255, 0.35);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
  }
  .dictation-melodic-slot:hover {
    background: rgba(110, 168, 255, 0.12);
    border-color: rgba(180, 210, 255, 0.7);
    color: var(--text);
    transform: scale(1.08);
  }
  .dictation-melodic-slot.is-filled {
    background: var(--accent);
    border: 2px solid var(--accent-2);
    color: #051030;
    box-shadow: 0 0 16px rgba(110, 168, 255, 0.65);
  }
  .dictation-melodic-slot.is-current {
    border-style: solid;
    border-color: var(--accent-2);
    box-shadow: 0 0 18px rgba(180, 210, 255, 0.7),
                inset 0 0 10px rgba(180, 210, 255, 0.2);
    animation: dictationSlotPulse 1.2s ease-in-out infinite alternate;
  }
  @keyframes dictationSlotPulse {
    from { box-shadow: 0 0 18px rgba(180, 210, 255, 0.45),
                       inset 0 0 8px rgba(180, 210, 255, 0.1); }
    to   { box-shadow: 0 0 28px rgba(180, 210, 255, 0.9),
                       inset 0 0 14px rgba(180, 210, 255, 0.3); }
  }
  .dictation-melodic-slot.is-correct {
    background: rgba(120, 220, 180, 0.65);
    border-color: rgba(140, 240, 200, 0.95);
    color: #053024;
    box-shadow: 0 0 14px rgba(120, 220, 180, 0.7);
  }
  .dictation-melodic-slot.is-wrong {
    background: rgba(255, 100, 100, 0.4);
    border-color: rgba(255, 130, 130, 0.85);
    color: #fff;
    box-shadow: 0 0 14px rgba(255, 100, 100, 0.55);
  }

  /* Beat-number label above each slot (1 2 3 4) */
  .dictation-melodic-slot-number {
    position: absolute;
    top: -22px; left: 50%;
    transform: translateX(-50%);
    font-size: 10px; color: var(--text-dim);
    letter-spacing: 0.8px;
  }

  /* ---- Degree chip bank ----
     A row of Do/Re/Mi/Fa/Sol/La/Ti chips. Reuses .ans-chip with
     `.dictation-degree-chip` for the larger-typography variant.
     The numeric-degree alternative (1 2 3 …) shares the same chip. */
  .ex-answers.dictation-degree-bank {
    gap: 8px;
    max-width: 720px;
  }
  .ans-chip.dictation-degree-chip {
    min-width: 56px;
    padding: 10px 16px;
    font-size: 15px;
    display: inline-flex; flex-direction: column; align-items: center; gap: 1px;
  }
  .ans-chip.dictation-degree-chip .deg-glyph {
    font-size: 16px; font-weight: 700;
    color: var(--text);
  }
  .ans-chip.dictation-degree-chip .deg-sub {
    font-size: 9px; letter-spacing: 0.5px;
    color: var(--text-dim);
  }
  .ans-chip.dictation-degree-chip.active {
    box-shadow: 0 0 22px rgba(110, 168, 255, 0.6);
  }

  /* ---- Mode toggle (mic / button entry) ----
     Mirrors the mic-vs-button input mode in Exercise3.jsx. Reuses
     canon `.pill-toggle`. No new class needed for the toggle itself.
     But we DO have a dedicated `dictation-mic-card` for the live
     pitch read-out + hold-bar (mirrors .ex3-pitch-row).            */
  .dictation-mic-card {
    width: min(420px, 92vw);
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid var(--glass-border);
    border-radius: 14px;
    padding: 12px 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .dictation-mic-card.pitch-correct {
    border-color: rgba(120, 220, 180, 0.55);
    background: rgba(120, 220, 180, 0.08);
  }
  .dictation-mic-card.pitch-active {
    border-color: rgba(180, 210, 255, 0.5);
    background: rgba(110, 168, 255, 0.08);
  }
  .dictation-mic-card-row {
    display: flex; align-items: baseline; gap: 12px;
    justify-content: center;
  }
  .dictation-pitch-note {
    font-size: 32px; font-weight: 800;
    color: var(--accent-2);
    line-height: 1;
  }
  .dictation-pitch-detail {
    font-size: 13px; color: var(--text-dim);
  }
  .dictation-pitch-cents {
    color: var(--accent); margin-inline-start: 6px;
  }
  .dictation-hold-bar-wrap {
    width: 100%; height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px; overflow: hidden;
  }
  .dictation-hold-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 8px rgba(110, 168, 255, 0.7);
    transition: width 0.06s linear;
  }

  /* ---- Tonic key selector ----
     Compact pill ribbon (C, C#, D, … ) — different visual from
     `.toggles-row` because it's chromatic and benefits from a
     single neat row.                                              */
  .dictation-tonic-ribbon {
    display: flex; gap: 4px; flex-wrap: wrap; justify-content: center;
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid var(--glass-border);
  }
  .dictation-tonic-key {
    min-width: 34px; height: 30px;
    border-radius: 999px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-dim);
    font-size: 12px; font-weight: 600;
    cursor: pointer;
    padding: 0 8px;
    font-family: inherit;
    transition: all 0.15s ease;
  }
  .dictation-tonic-key:hover {
    background: rgba(110, 168, 255, 0.12);
    color: var(--text);
  }
  .dictation-tonic-key.active {
    background: var(--accent);
    color: #051030;
    font-weight: 800;
    box-shadow: 0 0 12px rgba(110, 168, 255, 0.6);
  }

  /* ---- Sequence dots (legacy ex3 visual) ----
     Mirrors .ex3-beat-row in Exercise3.jsx — small per-note status
     dots showing right/wrong feedback during the result phase.
     Shown ABOVE the staff for compact at-a-glance feedback.       */
  .dictation-sequence-dots {
    display: flex; gap: 8px; align-items: center;
    justify-content: center;
  }
  .dictation-sequence-dot {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    border: 1.5px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    color: var(--text-dim);
  }
  .dictation-sequence-dot.correct {
    background: rgba(120, 220, 180, 0.45);
    border-color: rgba(140, 240, 200, 0.85);
    color: #e0fff0;
  }
  .dictation-sequence-dot.wrong {
    background: rgba(255, 100, 100, 0.32);
    border-color: rgba(255, 130, 130, 0.75);
    color: #ffe6e6;
  }
  .dictation-sequence-dot.cur-play {
    background: rgba(110, 168, 255, 0.4);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 12px rgba(110, 168, 255, 0.7);
  }
  .dictation-sequence-dot.cur-listen {
    background: rgba(255, 220, 130, 0.32);
    border-color: rgba(255, 220, 130, 0.7);
    color: #fff;
  }


/* ============ rhythm ============ */

  /* ---- Disc — number + tempo marking labels inside ----
     Justification: canon .metro-disc renders the disc itself; we
     stack BPM number + tempo marking inside it via a wrapper. */
  .metro-disc .rhythm-bpm-number {
    font-size: clamp(44px, 8vmin, 60px);
    font-weight: 800;
    line-height: 1;
    text-shadow: 0 0 18px rgba(110,168,255,0.6);
  }
  .metro-disc .rhythm-bpm-unit {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-top: 4px;
  }
  .metro-disc .rhythm-tempo-mark {
    font-size: 12px;
    color: var(--accent-2);
    font-style: italic;
    margin-top: 4px;
    font-weight: 500;
    opacity: 0.85;
  }
  /* Pulse ring lit on each downbeat */
  .metro-disc .rhythm-beat-ring {
    position: absolute; inset: -6px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    opacity: 0;
    animation: rhythmBeatPulse 1s ease-out infinite;
  }
  @keyframes rhythmBeatPulse {
    0%   { transform: scale(1);   opacity: 0.7; }
    100% { transform: scale(1.15); opacity: 0; }
  }

  /* ---- Tab strip (top of tool — Rhythm Explorer / Polyrhythm / Advanced) ----
     Justification: no canon class for an inline tab strip inside a tool
     screen. .pos-tabs from canon is close but block-style; this one is
     centered, glassy, pill-grouped. */
  .rhythm-tab-strip {
    display: inline-flex;
    align-self: center;
    gap: 4px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--glass-border);
    padding: 4px; border-radius: 999px;
    backdrop-filter: blur(8px);
  }
  .rhythm-tab {
    background: transparent;
    color: var(--text-dim);
    border: none;
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s ease;
  }
  .rhythm-tab:hover { color: var(--text); }
  .rhythm-tab.active {
    background: rgba(110, 168, 255, 0.28);
    color: var(--text);
    font-weight: 600;
    box-shadow: 0 0 14px rgba(110, 168, 255, 0.3);
  }

  /* ---- Sticky transport bar (canon transport + BPM slider + tap + sound) ----
     Justification: the React app has a horizontal "StickyControls"
     row containing the transport, BPM slider, and a sound-set toggle.
     We compose it from canon .transport + a new .rhythm-bpm-strip wrapper
     for the slider/number-input combo. */
  .rhythm-sticky-bar {
    display: flex; gap: 16px;
    align-items: center; justify-content: center;
    padding: 14px 18px;
    background: rgba(255,255,255,0.05);
    border: 1.5px solid var(--glass-border);
    border-radius: 22px;
    backdrop-filter: blur(12px);
    box-shadow: 0 6px 24px rgba(0,0,0,0.25);
    flex-wrap: wrap;
  }
  .rhythm-bpm-strip {
    display: flex; align-items: center; gap: 10px;
    min-width: 280px;
  }
  .rhythm-bpm-strip .bpm-label {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    text-transform: uppercase;
    font-weight: 600;
  }
  .rhythm-bpm-step {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1.5px solid var(--glass-border);
    color: var(--text);
    font-size: 16px; font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s ease;
  }
  .rhythm-bpm-step:hover {
    background: rgba(110, 168, 255, 0.2);
    border-color: var(--accent);
  }
  .rhythm-bpm-readout {
    min-width: 64px;
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    color: var(--accent-2);
    text-shadow: 0 0 14px rgba(110, 168, 255, 0.4);
  }
  .rhythm-bpm-slider {
    flex: 1; min-width: 140px;
    -webkit-appearance: none; appearance: none;
    height: 6px; border-radius: 3px;
    background: linear-gradient(
      to right,
      var(--accent) 0%,
      var(--accent) var(--fill, 30%),
      rgba(255,255,255,0.1) var(--fill, 30%),
      rgba(255,255,255,0.1) 100%);
    outline: none;
    cursor: pointer;
  }
  .rhythm-bpm-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--accent-2);
    border: 2px solid var(--bg-deep);
    box-shadow: 0 0 12px var(--accent);
    cursor: pointer;
  }
  .rhythm-bpm-slider::-moz-range-thumb {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--accent-2);
    border: 2px solid var(--bg-deep);
    box-shadow: 0 0 12px var(--accent);
    cursor: pointer;
  }

  .rhythm-sound-switch {
    display: flex; gap: 4px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    padding: 4px;
  }
  .rhythm-sound-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s ease;
  }
  .rhythm-sound-btn:hover { color: var(--text); }
  .rhythm-sound-btn.active {
    background: rgba(110, 168, 255, 0.28);
    color: var(--text);
    box-shadow: 0 0 12px rgba(110, 168, 255, 0.4);
  }

  /* tap pill (square-ish, distinct from circular transport) */
  .rhythm-tap-pill {
    background: rgba(255,255,255,0.06);
    border: 1.5px solid var(--glass-border);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 14px;
    font-size: 13px; font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all 0.2s ease;
  }
  .rhythm-tap-pill:hover {
    background: rgba(110, 168, 255, 0.18);
    border-color: var(--accent);
  }
  .rhythm-tap-pill .tap-emoji { font-size: 18px; }

  /* ---- Beat grid (Rhythm Explorer tab) ----
     Justification: canon has no "step-sequencer" cell grid.
     The React app uses 4 cell states (accent / normal / soft / mute).
     Each beat is one row of N subdivision cells. */
  .rhythm-beat-grid {
    display: flex; flex-direction: column; gap: 8px;
  }
  .rhythm-beat-row {
    display: flex; align-items: center; gap: 12px;
  }
  .rhythm-beat-label {
    width: 70px;
    font-size: 12px; font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    text-align: center;
    flex-shrink: 0;
  }
  .rhythm-beat-cells {
    flex: 1;
    display: flex; gap: 6px;
  }
  .rhythm-cell {
    flex: 1;
    height: 56px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s ease;
    border: 1.5px solid transparent;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
    color: rgba(255,255,255,0.55);
  }
  .rhythm-cell:hover {
    transform: scale(1.05);
    border-color: rgba(180, 210, 255, 0.4);
  }
  .rhythm-cell.state-accent {
    background: linear-gradient(135deg, var(--bg-light), #1a3da8);
    border-color: var(--accent);
    box-shadow: 0 0 16px rgba(110, 168, 255, 0.6),
                inset 0 0 12px rgba(255,255,255,0.1);
    color: #fff;
  }
  .rhythm-cell.state-normal {
    background: rgba(110, 168, 255, 0.28);
    border-color: rgba(180, 210, 255, 0.4);
    color: var(--text);
  }
  .rhythm-cell.state-soft {
    background: rgba(110, 168, 255, 0.1);
    border-color: rgba(180, 210, 255, 0.2);
    color: var(--text-dim);
  }
  .rhythm-cell.state-mute {
    background: rgba(255,255,255,0.03);
    border: 1.5px dashed rgba(180, 210, 255, 0.18);
    color: rgba(255,255,255,0.25);
  }
  .rhythm-cell.playing {
    border-color: #fff;
    box-shadow: 0 0 26px rgba(255, 255, 255, 0.7),
                inset 0 0 20px rgba(255, 255, 255, 0.2);
    transform: scale(1.06);
  }

  /* legend below grid */
  .rhythm-cell-legend {
    display: flex; gap: 14px;
    align-items: center;
    justify-content: center;
    margin-top: 10px;
    font-size: 11px;
    color: var(--text-dim);
    flex-wrap: wrap;
  }
  .rhythm-cell-legend .swatch {
    display: inline-flex; align-items: center; gap: 6px;
  }
  .rhythm-cell-legend .swatch .dot {
    width: 14px; height: 14px; border-radius: 4px;
    border: 1px solid var(--glass-border);
  }

  /* ---- Beats slider + subdivision picker row ---- */
  .rhythm-meter-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 720px) {
    .rhythm-meter-row { grid-template-columns: 1fr; }
  }
  .rhythm-stat {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .rhythm-stat .v {
    color: var(--accent-2);
    font-weight: 700;
    font-size: 16px;
    margin-inline-start: 8px;
    text-transform: none;
    letter-spacing: 0;
  }
  .rhythm-mini-slider {
    width: 100%;
    -webkit-appearance: none; appearance: none;
    height: 5px; border-radius: 3px;
    background: linear-gradient(
      to right,
      var(--accent) 0%, var(--accent) var(--fill, 25%),
      rgba(255,255,255,0.1) var(--fill, 25%), rgba(255,255,255,0.1) 100%);
    margin-top: 10px;
    outline: none; cursor: pointer;
  }
  .rhythm-mini-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent-2);
    border: 2px solid var(--bg-deep);
    box-shadow: 0 0 8px var(--accent);
  }
  .rhythm-mini-slider::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent-2);
    border: 2px solid var(--bg-deep);
    box-shadow: 0 0 8px var(--accent);
  }

  /* subdivision tiles */
  .rhythm-subdivisions {
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .rhythm-sub-tile {
    flex: 1; min-width: 60px;
    padding: 12px 6px;
    background: rgba(255,255,255,0.04);
    border: 1.5px solid var(--glass-border);
    border-radius: 12px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s ease;
    font-family: inherit;
    color: var(--text);
  }
  .rhythm-sub-tile:hover {
    background: rgba(110, 168, 255, 0.15);
    border-color: rgba(180, 210, 255, 0.4);
  }
  .rhythm-sub-tile.active {
    background: rgba(110, 168, 255, 0.28);
    border-color: var(--accent);
    box-shadow: 0 0 16px rgba(110, 168, 255, 0.35);
  }
  .rhythm-sub-tile .sub-icon {
    font-size: 22px;
    line-height: 1;
    margin-bottom: 4px;
    color: var(--accent-2);
  }
  .rhythm-sub-tile .sub-num {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
  }
  .rhythm-sub-tile.active .sub-num { color: var(--text); }

  /* ---- Time-sig grid ---- */
  .rhythm-timesig-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }
  @media (max-width: 720px) {
    .rhythm-timesig-grid { grid-template-columns: repeat(4, 1fr); }
  }
  .rhythm-timesig-btn {
    background: rgba(255,255,255,0.04);
    border: 1.5px solid var(--glass-border);
    color: var(--text);
    padding: 14px 4px;
    border-radius: 12px;
    font-size: 18px; font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s ease;
    text-align: center;
  }
  .rhythm-timesig-btn:hover {
    background: rgba(110, 168, 255, 0.15);
    border-color: rgba(180, 210, 255, 0.4);
  }
  .rhythm-timesig-btn.active {
    background: rgba(110, 168, 255, 0.28);
    border-color: var(--accent);
    box-shadow: 0 0 18px rgba(110, 168, 255, 0.4);
  }
  .rhythm-timesig-btn .ts-kind {
    display: block;
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-top: 2px;
    font-weight: 500;
    text-transform: uppercase;
  }
  .rhythm-timesig-btn.active .ts-kind { color: var(--accent-2); }

  /* ---- Polyrhythm two-row visualizer ----
     Justification: this is the "Polyrhythm" tab — two parallel bars
     of evenly-spaced cells (top=N, bottom=M) over one shared cycle.
     No canon class for this — we build a flex-cell row. */
  .rhythm-poly-bar {
    display: flex; flex-direction: column; gap: 12px;
  }
  .rhythm-poly-row {
    display: flex; align-items: center; gap: 10px;
  }
  .rhythm-poly-row-label {
    width: 100px;
    display: flex; flex-direction: column; gap: 2px;
    text-align: center;
    flex-shrink: 0;
  }
  .rhythm-poly-row-label .name {
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 600;
  }
  .rhythm-poly-row-label .count {
    font-size: 22px;
    font-weight: 800;
    color: var(--accent-2);
    text-shadow: 0 0 12px rgba(110, 168, 255, 0.5);
  }
  .rhythm-poly-cells {
    flex: 1;
    display: flex; gap: 4px;
    padding: 4px;
    background: rgba(255,255,255,0.03);
    border: 1.5px solid var(--glass-border);
    border-radius: 12px;
    min-height: 64px;
  }
  .rhythm-poly-cell {
    flex: 1;
    border-radius: 8px;
    cursor: pointer;
    background: rgba(110, 168, 255, 0.16);
    border: 1.5px solid rgba(180, 210, 255, 0.25);
    transition: all 0.15s ease;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim);
    font-size: 11px; font-weight: 600;
  }
  .rhythm-poly-cell:hover { transform: scale(1.05); }
  .rhythm-poly-cell.accent {
    background: linear-gradient(135deg, var(--bg-light), #1a3da8);
    border-color: var(--accent);
    box-shadow: 0 0 12px rgba(110, 168, 255, 0.5);
    color: #fff;
  }
  .rhythm-poly-cell.playing {
    border-color: #fff;
    box-shadow: 0 0 22px rgba(255,255,255,0.7);
  }

  .rhythm-poly-ratio {
    font-size: 32px; font-weight: 800;
    text-align: center;
    color: var(--accent-2);
    margin: 8px 0;
    letter-spacing: 4px;
    text-shadow: 0 0 18px rgba(110, 168, 255, 0.45);
  }

  /* polyrhythm preset chips */
  .rhythm-poly-presets {
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  }

  /* ---- Advanced Subdivisions tab — beat list ----
     Justification: each beat has a length (note value) and a division
     (1..8). Render each beat as a card with length-icon + division
     cells; columns of inner cells expand horizontally. */
  .rhythm-adv-list {
    display: flex; flex-direction: column; gap: 10px;
  }
  .rhythm-adv-beat {
    display: flex; align-items: center; gap: 12px;
    padding: 12px;
    background: rgba(255,255,255,0.04);
    border: 1.5px solid var(--glass-border);
    border-radius: 14px;
  }
  .rhythm-adv-handle {
    width: 42px;
    text-align: center;
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }
  .rhythm-adv-handle .num {
    display: block;
    font-size: 14px;
    color: var(--accent-2);
    font-weight: 700;
  }
  .rhythm-adv-length {
    width: 100px;
    text-align: center;
    flex-shrink: 0;
  }
  .rhythm-adv-length .note-icon {
    font-size: 30px;
    color: var(--accent-2);
    line-height: 1;
    filter: drop-shadow(0 0 8px rgba(110, 168, 255, 0.5));
  }
  .rhythm-adv-length .length-pill {
    display: inline-block;
    margin-top: 4px;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    color: var(--text-dim);
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--glass-border);
  }
  .rhythm-adv-div-cells {
    flex: 1;
    display: flex; gap: 4px;
    min-height: 46px;
  }
  .rhythm-adv-div-cells .rhythm-cell { height: 46px; }
  .rhythm-adv-div-meta {
    width: 88px;
    text-align: center;
    flex-shrink: 0;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
  }
  .rhythm-adv-div-meta .v {
    color: var(--accent-2);
    font-weight: 700;
    font-size: 13px;
    display: block;
  }
  .rhythm-adv-actions {
    display: flex; gap: 6px;
    flex-shrink: 0;
  }
  .rhythm-adv-icon-btn {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--glass-border);
    color: var(--text-dim);
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    transition: all 0.2s ease;
  }
  .rhythm-adv-icon-btn:hover {
    background: rgba(110, 168, 255, 0.18);
    color: var(--text);
    border-color: var(--accent);
  }
  .rhythm-adv-add {
    align-self: center;
    background: rgba(110, 168, 255, 0.14);
    border: 1.5px dashed var(--accent);
    color: var(--accent-2);
    padding: 10px 22px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s ease;
  }
  .rhythm-adv-add:hover {
    background: rgba(110, 168, 255, 0.25);
    color: #fff;
  }

  /* ---- Presets row (Load / Save) ---- */
  .rhythm-presets-row {
    display: flex; gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .rhythm-presets-btn {
    background: rgba(255,255,255,0.06);
    border: 1.5px solid var(--glass-border);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 12px;
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    display: inline-flex; align-items: center; gap: 8px;
    transition: all 0.2s ease;
  }
  .rhythm-presets-btn:hover {
    background: rgba(110, 168, 255, 0.18);
    border-color: var(--accent);
  }
  .rhythm-presets-btn.save {
    background: rgba(110, 168, 255, 0.18);
    border-color: var(--accent);
  }
  .rhythm-presets-btn.save:hover {
    background: rgba(110, 168, 255, 0.32);
    box-shadow: 0 0 18px rgba(110, 168, 255, 0.4);
  }

  /* ---- Tab content panel wrapper ---- */
  .rhythm-tab-panel {
    display: flex; flex-direction: column; gap: 16px;
  }

  /* ---- standalone preview helpers ---- */
  .preview-section {
    position: relative;
    min-height: 100vh;
  }
  .preview-section + .preview-section {
    border-top: 1px dashed rgba(180, 210, 255, 0.12);
  }
  .preview-marker {
    position: absolute; top: 50px; left: 50%;
    transform: translateX(-50%);
    z-index: 75;
    background: rgba(0, 0, 0, 0.5);
    color: var(--accent-2);
    border: 1px solid rgba(180, 210, 255, 0.25);
    padding: 6px 16px; border-radius: 999px;
    font-size: 11px; letter-spacing: 1.2px;
    backdrop-filter: blur(10px);
  }


/* ============ positions ============ */

  /* ---- Page header bar ---- */
  .positions-pageheader {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    text-align: center;
  }
  .positions-pageheader .title-row {
    display: flex; align-items: center; gap: 12px;
    flex-wrap: wrap; justify-content: center;
  }
  .positions-pageheader h1 {
    margin: 0; font-size: clamp(24px, 3.6vmin, 32px); font-weight: 700;
  }
  .positions-pageheader .scale-title-pill {
    background: rgba(110, 168, 255, 0.15);
    border: 1.5px solid rgba(110, 168, 255, 0.35);
    color: var(--accent-2);
    padding: 4px 14px; border-radius: 999px;
    font-size: 14px; font-weight: 600;
    letter-spacing: 0.5px;
  }
  .positions-pageheader p { margin: 0; color: var(--text-dim); font-size: 13px; }

  /* ---- Quick Ref / Help button ---- */
  .positions-quickref-btn {
    background: rgba(255,255,255,0.06);
    border: 1.5px solid var(--glass-border);
    color: var(--text);
    width: 36px; height: 36px; border-radius: 50%;
    font-size: 16px; cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all 0.2s ease;
  }
  .positions-quickref-btn:hover {
    background: rgba(110,168,255,0.18);
    border-color: var(--accent);
  }

  /* ---- Control rows (Root select / Type toggle / Position toggles) ---- */
  .positions-control-block {
    display: flex; flex-direction: column; gap: 12px;
  }
  .positions-control-line {
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    justify-content: center;
  }
  .positions-control-line .ctrl-label {
    font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--text-dim); font-weight: 600;
  }

  /* Root native-style select rendered as a pill */
  .positions-select {
    background: rgba(255,255,255,0.06);
    border: 1.5px solid var(--glass-border);
    color: var(--text);
    padding: 7px 30px 7px 14px;
    border-radius: 999px;
    font-size: 13px; font-family: inherit; font-weight: 600;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--accent) 50%),
      linear-gradient(135deg, var(--accent) 50%, transparent 50%);
    background-position:
      calc(100% - 14px) 50%,
      calc(100% - 9px) 50%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    transition: all 0.2s ease;
  }
  .positions-select:hover {
    background-color: rgba(110, 168, 255, 0.15);
    border-color: var(--accent);
  }
  .positions-select option {
    background: var(--bg-mid); color: var(--text);
  }

  /* Major/Minor segmented toggle */
  .positions-seg {
    display: inline-flex;
    background: rgba(255,255,255,0.04);
    border: 1.5px solid var(--glass-border);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .positions-seg-btn {
    background: transparent;
    color: var(--text-dim);
    border: none;
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 12px; font-family: inherit; font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .positions-seg-btn:hover { color: var(--text); }
  .positions-seg-btn.active {
    background: rgba(110, 168, 255, 0.3);
    color: #fff;
    box-shadow: 0 0 14px rgba(110, 168, 255, 0.4);
  }

  /* CAGED Position buttons (toggles, multi-select) */
  .positions-caged-row {
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  }
  .positions-caged-btn {
    background: rgba(255,255,255,0.04);
    border: 1.5px solid var(--glass-border);
    color: var(--text);
    width: 44px; height: 44px;
    border-radius: 12px;
    font-size: 16px; font-weight: 800; font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .positions-caged-btn:hover {
    background: rgba(110, 168, 255, 0.15);
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .positions-caged-btn.active {
    background: rgba(110, 168, 255, 0.32);
    border-color: var(--accent-2);
    color: #fff;
    box-shadow: 0 0 18px rgba(110, 168, 255, 0.55),
                inset 0 0 12px rgba(255, 255, 255, 0.1);
  }

  /* Show-all checkbox + display-mode bar */
  .positions-checkbox {
    display: inline-flex; align-items: center; gap: 8px;
    cursor: pointer;
    font-size: 13px; color: var(--text-dim);
    user-select: none;
  }
  .positions-checkbox input {
    appearance: none;
    width: 18px; height: 18px;
    border-radius: 5px;
    border: 1.5px solid var(--glass-border);
    background: rgba(255,255,255,0.06);
    cursor: pointer;
    position: relative;
    transition: all 0.2s ease;
  }
  .positions-checkbox input:checked {
    background: var(--accent);
    border-color: var(--accent-2);
    box-shadow: 0 0 10px rgba(110, 168, 255, 0.5);
  }
  .positions-checkbox input:checked::after {
    content: '✓';
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #051030; font-weight: 800;
  }

  .positions-display-bar {
    display: inline-flex;
    background: rgba(255,255,255,0.04);
    border: 1.5px solid var(--glass-border);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
    flex-wrap: wrap;
  }
  .positions-display-btn {
    background: transparent;
    color: var(--text-dim);
    border: none;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px; font-family: inherit; font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .positions-display-btn:hover { color: var(--text); }
  .positions-display-btn.active {
    background: rgba(110, 168, 255, 0.3);
    color: #fff;
  }
  .positions-display-btn.pentatonic.active {
    background: rgba(255, 180, 100, 0.3);
    box-shadow: 0 0 12px rgba(255, 180, 100, 0.35);
  }

  /* ---- Arpeggio buttons (Roman-numeral chord pickers) ---- */
  .positions-arp-bar {
    display: flex; flex-direction: column; gap: 10px;
    align-items: center;
  }
  .positions-arp-row {
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  }
  .positions-arp-btn {
    background: rgba(255,255,255,0.04);
    border: 2px solid var(--accent);
    color: var(--accent);
    min-width: 46px; height: 38px;
    padding: 0 12px;
    border-radius: 10px;
    font-size: 14px; font-weight: 700; font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .positions-arp-btn[data-color="pink"]   { border-color: #E91E8C; color: #E91E8C; }
  .positions-arp-btn[data-color="orange"] { border-color: #FF5722; color: #FF5722; }
  .positions-arp-btn[data-color="amber"]  { border-color: #FFC107; color: #FFC107; }
  .positions-arp-btn[data-color="cyan"]   { border-color: #00BCD4; color: #00BCD4; }
  .positions-arp-btn[data-color="purple"] { border-color: #673AB7; color: #c8a8ff; }
  .positions-arp-btn[data-color="violet"] { border-color: #E040FB; color: #E040FB; }
  .positions-arp-btn[data-color="lime"]   { border-color: #76FF03; color: #76FF03; }

  .positions-arp-btn:hover {
    background: rgba(255,255,255,0.08);
    transform: translateY(-1px);
  }
  .positions-arp-btn.active {
    color: #1a1a2e;
    box-shadow: 0 0 14px currentColor;
  }
  .positions-arp-btn[data-color="pink"].active   { background: #E91E8C; color: #fff; }
  .positions-arp-btn[data-color="orange"].active { background: #FF5722; color: #fff; }
  .positions-arp-btn[data-color="amber"].active  { background: #FFC107; color: #1a1a2e; }
  .positions-arp-btn[data-color="cyan"].active   { background: #00BCD4; color: #1a1a2e; }
  .positions-arp-btn[data-color="purple"].active { background: #673AB7; color: #fff; }
  .positions-arp-btn[data-color="violet"].active { background: #E040FB; color: #1a1a2e; }
  .positions-arp-btn[data-color="lime"].active   { background: #76FF03; color: #1a1a2e; }

  .positions-arp-extras {
    display: flex; gap: 10px; align-items: center;
    color: var(--text-dim); font-size: 11px;
  }
  .positions-arp-hint {
    background: rgba(255, 200, 130, 0.08);
    border: 1px dashed rgba(255, 200, 130, 0.3);
    padding: 4px 10px; border-radius: 6px;
    color: rgba(255, 220, 170, 0.9);
    font-size: 11px;
  }

  /* ---- All Scales tab — root + scale/chord selectors, action row ---- */
  .positions-allscales-controls {
    display: flex; flex-direction: column; gap: 14px;
  }
  .positions-allscales-row {
    display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap;
    justify-content: center;
  }
  .positions-allscales-group {
    display: flex; flex-direction: column; gap: 6px;
    align-items: flex-start;
  }
  .positions-allscales-group .ctrl-label {
    font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase;
    color: var(--text-dim); font-weight: 600;
  }
  .positions-allscales-group .positions-select {
    min-width: 200px;
  }
  .positions-allscales-actions {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    justify-content: center;
    color: var(--text-dim); font-size: 11px;
  }
  .positions-action-btn {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--glass-border);
    color: var(--text-dim);
    padding: 6px 14px; border-radius: 8px;
    font-size: 12px; font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .positions-action-btn:hover {
    background: rgba(255,255,255,0.1);
    color: var(--text);
  }

  /* Overlay rows (All Scales tab — chord overlays) */
  .positions-overlay-section {
    border-top: 1px dashed rgba(180, 210, 255, 0.18);
    padding-top: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .positions-overlay-header {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px;
  }
  .positions-overlay-add {
    background: rgba(110, 168, 255, 0.15);
    border: 1.5px solid var(--accent);
    color: var(--accent-2);
    padding: 5px 12px; border-radius: 8px;
    font-size: 12px; font-weight: 600; font-family: inherit;
    cursor: pointer;
  }
  .positions-overlay-row {
    display: flex; gap: 8px; align-items: center;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    padding: 6px 10px;
  }
  .positions-overlay-swatch {
    width: 14px; height: 14px; border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 8px currentColor;
  }
  .positions-overlay-remove {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--glass-border);
    color: var(--text-dim);
    width: 24px; height: 24px; border-radius: 50%;
    font-size: 11px; cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; justify-content: center;
  }

  /* ---- Partial Chords builder ---- */
  .positions-pct-builder {
    display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap;
    justify-content: center;
  }
  .positions-pct-group {
    display: flex; flex-direction: column; gap: 6px;
    align-items: flex-start;
  }
  .positions-pct-group .ctrl-label {
    font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase;
    color: var(--text-dim); font-weight: 600;
  }
  .positions-pct-fret-val {
    color: var(--accent-2); font-weight: 700;
  }
  .positions-pct-slider {
    appearance: none;
    width: 180px; height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 999px;
    outline: none;
  }
  .positions-pct-slider::-webkit-slider-thumb {
    appearance: none;
    width: 18px; height: 18px;
    background: var(--accent);
    border: 2px solid var(--accent-2);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(110, 168, 255, 0.55);
  }
  .positions-pct-slider::-moz-range-thumb {
    width: 18px; height: 18px;
    background: var(--accent);
    border: 2px solid var(--accent-2);
    border-radius: 50%;
    cursor: pointer;
  }

  .positions-pct-add {
    background: rgba(110, 168, 255, 0.25);
    border: 1.5px solid var(--accent);
    color: #fff;
    padding: 8px 18px; border-radius: 999px;
    font-size: 13px; font-weight: 700; font-family: inherit;
    cursor: pointer;
    box-shadow: 0 0 14px rgba(110, 168, 255, 0.35);
  }
  .positions-pct-add:hover { transform: translateY(-1px); }

  /* Progression pills row */
  .positions-progression-pills {
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
    padding-top: 6px;
  }
  .positions-prog-pill {
    background: rgba(255,255,255,0.06);
    border: 1.5px solid var(--glass-border);
    color: var(--text);
    padding: 6px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 600; font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .positions-prog-pill:hover {
    background: rgba(110, 168, 255, 0.15);
    border-color: var(--accent);
  }
  .positions-prog-pill.active {
    background: rgba(110, 168, 255, 0.32);
    border-color: var(--accent-2);
    box-shadow: 0 0 14px rgba(110, 168, 255, 0.4);
  }

  /* Partial chord shape cards */
  .positions-pct-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
  }
  .positions-pct-card {
    background: rgba(255,255,255,0.04);
    border: 1.5px solid var(--glass-border);
    border-radius: 14px;
    padding: 12px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .positions-pct-card.active {
    border-color: var(--accent);
    background: rgba(110, 168, 255, 0.08);
    box-shadow: 0 0 18px rgba(110, 168, 255, 0.3);
  }
  .positions-pct-card-header {
    display: flex; justify-content: space-between; align-items: center;
  }
  .positions-pct-card-title {
    font-size: 16px; font-weight: 700; color: var(--text);
  }
  .positions-pct-card-fret {
    font-size: 11px; color: var(--text-dim);
    background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 999px;
  }
  .positions-pct-card-nav {
    display: flex; gap: 6px; justify-content: space-between;
    font-size: 11px; color: var(--text-dim);
  }
  .positions-pct-nav-group {
    display: inline-flex; align-items: center; gap: 4px;
  }
  .positions-pct-nav-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--glass-border);
    color: var(--text-dim);
    width: 24px; height: 24px; border-radius: 6px;
    font-size: 12px; cursor: pointer; font-family: inherit;
    line-height: 1;
  }
  .positions-pct-nav-btn:hover { color: var(--text); background: rgba(110,168,255,0.15); }

  /* Mini fretboard inside partial chord card */
  .positions-mini-fb {
    background: linear-gradient(180deg, #20242c, #14171c);
    border-radius: 10px;
    padding: 8px 6px;
    display: grid;
    gap: 3px;
    grid-template-columns: 14px repeat(5, 1fr);
  }
  .positions-mini-fb .mini-cell {
    height: 22px; position: relative;
    border-right: 1px solid rgba(255,255,255,0.06);
  }
  .positions-mini-fb .mini-cell.nut { border-right: 2px solid rgba(255,255,255,0.5); }
  .positions-mini-fb .mini-cell.fret-num {
    border: none; color: var(--text-dim); font-size: 9px;
    height: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .positions-mini-fb .mini-string {
    color: var(--text-dim); font-size: 9px;
    display: flex; align-items: center; justify-content: center;
  }
  .positions-mini-fb .mini-dot {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 16px; height: 16px; border-radius: 50%;
    background: rgba(180, 210, 255, 0.5);
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; font-weight: 700; color: #fff;
  }
  .positions-mini-fb .mini-dot.root {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  /* ---- Active position marker on full fretboard ---- */
  .positions-active-marker {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1.2px; text-transform: uppercase;
    margin-bottom: 6px;
  }
  .positions-active-marker .v {
    color: var(--accent-2);
    font-weight: 700;
    margin-inline-start: 6px;
    letter-spacing: 0;
    text-transform: none;
  }

  /* ---- Standalone preview helpers ---- */
  .preview-section {
    position: relative;
    min-height: 100vh;
    padding-bottom: 30px;
  }
  .preview-section + .preview-section {
    border-top: 1px dashed rgba(180, 210, 255, 0.12);
  }
  .preview-marker {
    position: absolute; top: 50px; left: 50%;
    transform: translateX(-50%);
    z-index: 75;
    background: rgba(0, 0, 0, 0.5);
    color: var(--accent-2);
    border: 1px solid rgba(180, 210, 255, 0.25);
    padding: 6px 16px; border-radius: 999px;
    font-size: 11px; letter-spacing: 1.2px;
    backdrop-filter: blur(10px);
  }


/* ============ backing-tracks ============ */


  /* ============================================================
     1.  TOP CONTROL BAR — key / style / tempo / preset library
     ============================================================ */
  /* All controls reuse `.select-pill`; only the "key" pill needs a
     larger affordance because it carries Root + Maj/Min. */
  .backing-top-bar {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
    padding: 14px 18px;
    background: rgba(255,255,255,0.04);
    border: 1.5px solid var(--glass-border);
    border-radius: 16px;
    backdrop-filter: blur(10px);
  }
  .backing-top-bar-group {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }

  /* The "Key" pill is slightly larger, with two visible parts (root | quality) */
  .backing-key-pill {
    background: rgba(110, 168, 255, 0.15);
    border: 1.5px solid rgba(110, 168, 255, 0.5);
    color: var(--text);
    padding: 8px 16px; border-radius: 999px;
    font-size: 14px; font-family: inherit; font-weight: 600;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    transition: all 0.2s ease;
  }
  .backing-key-pill:hover {
    background: rgba(110, 168, 255, 0.25);
    box-shadow: 0 0 14px rgba(110, 168, 255, 0.35);
  }
  .backing-key-pill .key-icon { font-size: 16px; }
  .backing-key-pill .key-root { color: var(--accent-2); font-weight: 800; }
  .backing-key-pill .key-sep  { color: var(--text-dim); opacity: 0.5; }
  .backing-key-pill .key-qual { color: var(--accent); font-weight: 600; }
  .backing-key-pill .caret    { color: var(--text-dim); margin-inline-start: 4px; font-size: 10px; }

  /* Tempo stepper inline */
  .backing-tempo {
    display: inline-flex; align-items: center;
    background: rgba(255,255,255,0.06);
    border: 1.5px solid var(--glass-border);
    border-radius: 999px;
    overflow: hidden;
  }
  .backing-tempo-btn {
    background: transparent; border: none;
    color: var(--text); font-family: inherit; font-size: 18px; font-weight: 600;
    width: 32px; height: 32px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .backing-tempo-btn:hover { background: rgba(110, 168, 255, 0.2); }
  .backing-tempo-value {
    padding: 0 14px;
    font-size: 13px; font-weight: 600;
    color: var(--text);
    border-left: 1px solid var(--glass-border);
    border-right: 1px solid var(--glass-border);
    line-height: 32px; min-width: 90px; text-align: center;
  }
  .backing-tempo-value .bpm-tag {
    color: var(--text-dim); font-size: 10px; margin-inline-start: 4px;
    letter-spacing: 0.6px; font-weight: 500;
  }

  /* Preset Library trigger — emphasis as the primary entry point */
  .backing-preset-trigger {
    background: linear-gradient(135deg, rgba(110, 168, 255, 0.25), rgba(42, 90, 255, 0.15));
    border: 1.5px solid rgba(180, 210, 255, 0.5);
    color: var(--text);
    padding: 8px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 600; font-family: inherit;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    box-shadow: 0 0 14px rgba(110, 168, 255, 0.25);
    transition: all 0.2s ease;
  }
  .backing-preset-trigger:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 22px rgba(110, 168, 255, 0.5);
  }
  .backing-preset-trigger .count-badge {
    background: rgba(255,255,255,0.15);
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 11px;
    color: var(--accent-2);
    font-weight: 700;
  }

  /* ============================================================
     2.  KEY DROPDOWN — anchored under the key pill (mocked open)
     ============================================================ */
  .backing-key-dropdown {
    position: absolute;
    top: calc(100% + 6px); right: 0;
    width: 280px;
    background: linear-gradient(180deg, rgba(13, 42, 122, 0.95), rgba(10, 31, 92, 0.97));
    border: 1.5px solid var(--glass-border);
    border-radius: 16px;
