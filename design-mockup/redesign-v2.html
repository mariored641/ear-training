    padding: 14px;
    backdrop-filter: blur(16px);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    z-index: 50;
    display: none;
  }
  .backing-key-dropdown.open { display: block; }
  .backing-key-dropdown-title {
    font-size: 10px; letter-spacing: 1.5px;
    color: var(--text-dim); text-transform: uppercase;
    margin-bottom: 8px;
  }
  .backing-key-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    margin-bottom: 12px;
  }
  .backing-key-cell {
    background: rgba(255,255,255,0.05);
    border: 1.5px solid transparent;
    color: var(--text);
    padding: 8px 0;
    border-radius: 10px;
    font-size: 13px; font-weight: 600;
    text-align: center;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
  }
  .backing-key-cell:hover {
    background: rgba(110, 168, 255, 0.15);
    border-color: rgba(180, 210, 255, 0.3);
  }
  .backing-key-cell.active {
    background: rgba(110, 168, 255, 0.35);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 12px rgba(110, 168, 255, 0.55);
  }
  .backing-key-qual-row {
    display: flex; gap: 6px;
    background: rgba(0,0,0,0.25);
    border-radius: 10px;
    padding: 4px;
  }
  .backing-key-qual-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 8px 0; border-radius: 8px;
    font-size: 13px; font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .backing-key-qual-btn.active {
    background: var(--bg-light);
    color: #fff;
    box-shadow: 0 2px 8px rgba(110, 168, 255, 0.4);
  }

  .backing-pos-wrapper { position: relative; }

  /* ============================================================
     3.  PRESET LIBRARY PANEL — slides from RIGHT (RTL view)
     ============================================================ */
  .backing-preset-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(5, 13, 42, 0.55);
    backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .backing-preset-overlay.open { opacity: 1; pointer-events: auto; }

  .backing-preset-panel {
    position: fixed; top: 0; bottom: 0; right: 0;
    width: min(420px, 92vw);
    z-index: 210;
    background: linear-gradient(180deg, rgba(13, 42, 122, 0.92), rgba(10, 31, 92, 0.96));
    border-left: 1.5px solid var(--glass-border);
    backdrop-filter: blur(16px);
    box-shadow: -4px 0 40px rgba(0, 0, 0, 0.5);
    transform: translateX(105%);
    transition: transform 0.32s cubic-bezier(0.2, 0.7, 0.2, 1);
    display: flex; flex-direction: column;
    direction: rtl;
  }
  .backing-preset-panel.open { transform: translateX(0); }

  .backing-preset-header {
    padding: 18px 20px 14px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(180, 210, 255, 0.12);
  }
  .backing-preset-title {
    margin: 0;
    font-size: 17px; font-weight: 700;
    color: var(--text);
    display: flex; align-items: center; gap: 10px;
  }
  .backing-preset-title .count-tag {
    font-size: 11px; letter-spacing: 1px;
    color: var(--accent);
    padding: 3px 8px; border-radius: 6px;
    background: rgba(110, 168, 255, 0.15);
    border: 1px solid rgba(110, 168, 255, 0.3);
  }
  .backing-preset-close {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-dim);
    width: 32px; height: 32px;
    border-radius: 50%;
    font-size: 16px; cursor: pointer;
    font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease;
  }
  .backing-preset-close:hover { background: rgba(255,255,255,0.14); color: var(--text); }

  .backing-preset-search-row {
    padding: 12px 16px;
    display: flex; gap: 8px; align-items: center;
    border-bottom: 1px solid rgba(180, 210, 255, 0.08);
  }
  .backing-preset-search {
    flex: 1;
    background: rgba(0,0,0,0.25);
    border: 1.5px solid var(--glass-border);
    color: var(--text);
    padding: 9px 14px; border-radius: 12px;
    font-size: 13px; font-family: inherit;
    direction: rtl;
  }
  .backing-preset-search::placeholder { color: var(--text-dim); }
  .backing-preset-search:focus {
    outline: none;
    border-color: var(--accent);
    background: rgba(0,0,0,0.4);
  }
  .backing-preset-fav-btn {
    background: rgba(255,255,255,0.04);
    border: 1.5px solid var(--glass-border);
    color: var(--text-dim);
    padding: 8px 14px;
    border-radius: 12px;
    font-size: 13px; font-family: inherit;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .backing-preset-fav-btn.active {
    background: rgba(255, 200, 80, 0.18);
    border-color: rgba(255, 200, 80, 0.5);
    color: #ffd575;
  }

  .backing-preset-info-strip {
    padding: 10px 18px;
    font-size: 11px;
    color: var(--text-dim);
    border-bottom: 1px solid rgba(180, 210, 255, 0.06);
    display: flex; gap: 10px; align-items: center;
  }
  .backing-preset-info-strip .count {
    color: var(--accent-2); font-weight: 600;
  }
  .backing-preset-info-strip .auto-switch {
    color: rgba(255, 200, 130, 0.95);
    font-size: 10px;
    background: rgba(255, 180, 100, 0.1);
    border: 1px solid rgba(255, 180, 100, 0.25);
    padding: 2px 8px;
    border-radius: 6px;
    margin-inline-start: auto;
  }

  .backing-preset-list {
    flex: 1; overflow-y: auto;
    padding: 8px 10px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .backing-preset-list::-webkit-scrollbar { width: 6px; }
  .backing-preset-list::-webkit-scrollbar-thumb {
    background: rgba(180, 210, 255, 0.2);
    border-radius: 3px;
  }

  .backing-preset-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    background: rgba(255, 255, 255, 0.03);
    border: 1.5px solid transparent;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .backing-preset-item:hover {
    background: rgba(110, 168, 255, 0.1);
    border-color: rgba(180, 210, 255, 0.2);
  }
  .backing-preset-item.featured {
    background: rgba(110, 168, 255, 0.12);
    border-color: rgba(110, 168, 255, 0.35);
  }
  .backing-preset-fav-star {
    background: transparent; border: none;
    color: var(--text-dim);
    font-size: 18px; cursor: pointer;
    padding: 0; line-height: 1;
    flex-shrink: 0;
    transition: color 0.15s ease;
  }
  .backing-preset-fav-star.starred { color: #ffd575; }
  .backing-preset-fav-star:hover { color: #ffd575; }
  .backing-preset-item-info {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; gap: 2px;
  }
  .backing-preset-item-title {
    font-size: 14px; font-weight: 600;
    color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .backing-preset-item-meta {
    font-size: 11px; color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .backing-preset-item-meta .key {
    color: var(--accent-2); font-weight: 600;
    margin-inline-start: 4px; margin-inline-end: 4px;
  }
  .backing-preset-item-meta .style {
    color: rgba(180, 210, 255, 0.85);
  }
  .backing-preset-item-meta .ts-warn {
    color: rgba(255, 200, 130, 0.95);
    font-size: 10px;
    background: rgba(255, 180, 100, 0.1);
    padding: 1px 6px;
    border-radius: 4px;
    margin-inline-start: 6px;
  }
  .backing-preset-item-tempo {
    color: var(--accent);
    font-size: 12px; font-weight: 700;
    flex-shrink: 0;
    background: rgba(110, 168, 255, 0.12);
    padding: 4px 8px;
    border-radius: 8px;
  }

  /* ============================================================
     4.  CHORD PROGRESSION EDITOR — extends canon .chord-grid
     ============================================================ */
  .backing-chord-editor-header {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 10px;
    margin-bottom: 14px;
  }
  .backing-chord-editor-header h3 {
    margin: 0; font-size: 14px;
    color: var(--text-dim); letter-spacing: 0.5px;
    text-transform: uppercase; font-weight: 600;
  }
  .backing-chord-editor-header .song-title {
    color: var(--accent-2);
    font-weight: 700;
    text-transform: none;
    letter-spacing: 0;
    margin-inline-start: 6px;
  }
  .backing-bars-controls {
    display: flex; gap: 8px; align-items: center;
  }
  .backing-bars-stepper {
    display: inline-flex; align-items: center;
    background: rgba(255,255,255,0.06);
    border: 1.5px solid var(--glass-border);
    border-radius: 10px;
    overflow: hidden;
    font-size: 12px;
  }
  .backing-bars-stepper button {
    background: transparent; border: none;
    color: var(--text); font-family: inherit;
    width: 28px; height: 28px;
    font-size: 14px; cursor: pointer;
  }
  .backing-bars-stepper button:hover { background: rgba(110, 168, 255, 0.2); }
  .backing-bars-stepper .label {
    padding: 0 10px; font-weight: 600;
    border-left: 1px solid var(--glass-border);
    border-right: 1px solid var(--glass-border);
    line-height: 28px;
  }
  .backing-bars-stepper .max-hint {
    color: var(--text-dim); font-size: 10px; margin-inline-start: 4px;
  }
  .backing-layout-pills {
    display: inline-flex; gap: 2px;
    background: rgba(0,0,0,0.25);
    border-radius: 10px;
    padding: 3px;
  }
  .backing-layout-pill {
    background: transparent; border: none;
    color: var(--text-dim);
    padding: 5px 11px;
    border-radius: 8px;
    font-size: 12px; font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
  }
  .backing-layout-pill.active {
    background: rgba(110, 168, 255, 0.25);
    color: #fff;
    box-shadow: inset 0 0 0 1px rgba(180, 210, 255, 0.3);
  }

  /* Half-bar split: two chords inside one bar */
  .chord-bar.split {
    padding: 12px 6px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .chord-bar .split-row {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .chord-bar .split-half {
    background: rgba(110, 168, 255, 0.1);
    border: 1px solid rgba(110, 168, 255, 0.2);
    border-radius: 8px;
    padding: 8px 4px;
    font-size: 17px; font-weight: 700;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .chord-bar .split-half:hover {
    background: rgba(110, 168, 255, 0.2);
    border-color: var(--accent);
  }
  .chord-bar .split-half.active {
    background: rgba(110, 168, 255, 0.35);
    border-color: var(--accent);
    box-shadow: 0 0 12px rgba(110, 168, 255, 0.6);
  }

  /* Bar number badge in top-right of each chord-bar */
  .chord-bar .bar-num {
    position: absolute; top: 4px; inset-inline-start: 6px;
    font-size: 9px; font-weight: 700; color: var(--text-dim);
    letter-spacing: 0.5px;
  }

  /* Add-bar tile — uses .chord-bar shell with a different visual */
  .chord-bar.add-bar {
    background: transparent;
    border: 1.5px dashed rgba(180, 210, 255, 0.3);
    color: var(--text-dim);
    font-size: 24px; font-weight: 300;
    display: flex; align-items: center; justify-content: center;
  }
  .chord-bar.add-bar:hover {
    border-color: var(--accent);
    color: var(--accent-2);
    background: rgba(110, 168, 255, 0.08);
  }

  /* Time-signature mini-badge above the grid */
  .backing-time-sig-row {
    display: flex; gap: 14px; flex-wrap: wrap;
    margin-bottom: 10px;
    font-size: 11px; color: var(--text-dim);
    letter-spacing: 0.5px;
  }
  .backing-time-sig-row .badge {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--glass-border);
    padding: 3px 10px;
    border-radius: 999px;
    color: var(--text);
  }
  .backing-time-sig-row .badge .v {
    color: var(--accent); font-weight: 700;
    margin-inline-start: 4px;
  }

  /* ============================================================
     5.  TRANSPORT — extends canon .transport
     ============================================================ */
  .backing-transport-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .backing-transport-status {
    display: flex; gap: 14px; align-items: center;
    font-size: 12px; color: var(--text-dim);
  }
  .backing-transport-status .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    animation: pulseDot 1s ease-in-out infinite;
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 0.4; transform: scale(0.85); }
    50%      { opacity: 1; transform: scale(1.2); }
  }
  .backing-transport-status .now-playing {
    color: var(--accent-2); font-weight: 700;
  }
  .backing-loop-badge {
    color: var(--accent);
    font-size: 11px; font-weight: 700;
    background: rgba(110, 168, 255, 0.15);
    border: 1px solid rgba(110, 168, 255, 0.35);
    padding: 2px 8px;
    border-radius: 999px;
  }

  /* ============================================================
     6.  LIVE FRETBOARD PANEL — extends canon .fretboard
     ============================================================ */
  .backing-fretboard-header {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 10px;
    margin-bottom: 14px;
  }
  .backing-fretboard-header h3 {
    margin: 0; font-size: 14px;
    color: var(--text-dim); letter-spacing: 0.5px;
    text-transform: uppercase; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .backing-fretboard-header h3 .now-chord {
    color: var(--accent);
    font-weight: 800; text-transform: none;
    font-size: 16px; letter-spacing: 0;
    padding: 3px 10px;
    background: rgba(110, 168, 255, 0.15);
    border: 1px solid rgba(110, 168, 255, 0.4);
    border-radius: 8px;
    box-shadow: 0 0 12px rgba(110, 168, 255, 0.3);
  }
  .backing-fretboard-controls {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }

  /* Legend strip under fretboard */
  .backing-fretboard-legend {
    display: flex; gap: 18px; justify-content: center;
    margin-top: 12px;
    font-size: 11px; color: var(--text-dim);
  }
  .backing-legend-item {
    display: inline-flex; align-items: center; gap: 6px;
  }
  .backing-legend-dot {
    width: 12px; height: 12px; border-radius: 50%;
    display: inline-block;
  }
  .backing-legend-dot.scale {
    background: rgba(180, 210, 255, 0.35);
  }
  .backing-legend-dot.arp {
    background: rgba(120, 220, 255, 0.85);
    box-shadow: 0 0 8px rgba(120, 220, 255, 0.7);
  }
  .backing-legend-dot.root {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  /* Polyscale mini-strip (one cell per bar) */
  .backing-polyscale-strip {
    margin-top: 14px;
    padding: 12px;
    background: rgba(255, 180, 100, 0.06);
    border: 1px dashed rgba(255, 200, 130, 0.3);
    border-radius: 12px;
  }
  .backing-polyscale-strip .strip-title {
    font-size: 10px; letter-spacing: 1.2px;
    color: rgba(255, 200, 130, 0.95); text-transform: uppercase;
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .backing-polyscale-cells {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
  }
  .backing-polyscale-cell {
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    padding: 8px 4px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .backing-polyscale-cell:hover {
    background: rgba(255, 180, 100, 0.12);
    border-color: rgba(255, 200, 130, 0.5);
  }
  .backing-polyscale-cell.current {
    background: rgba(255, 200, 130, 0.18);
    border-color: rgba(255, 200, 130, 0.6);
    box-shadow: 0 0 10px rgba(255, 200, 130, 0.4);
  }
  .backing-polyscale-cell .cell-bar {
    font-size: 9px; color: var(--text-dim);
    letter-spacing: 0.5px;
  }
  .backing-polyscale-cell .cell-chord {
    font-size: 13px; font-weight: 700; color: var(--text);
    margin-top: 2px;
  }
  .backing-polyscale-cell .cell-scale {
    font-size: 10px; color: rgba(255, 200, 130, 0.85);
    margin-top: 3px;
  }

  /* ============================================================
     7.  SF2 LOADER STATUS (mocked, hidden by default)
     ============================================================ */
  .backing-status-bar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px;
    background: rgba(110, 168, 255, 0.12);
    border: 1px solid rgba(110, 168, 255, 0.3);
    border-radius: 12px;
    font-size: 12px; color: var(--accent-2);
  }
  .backing-status-bar .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(180, 210, 255, 0.25);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }


/* ============ feedback ============ */

  /* ---- Layout helpers shared across the 3 screens ---- */
  .feedback-screen {
    display: flex; flex-direction: column;
    gap: 18px;
  }

  /* ---- PREP SCREEN ---------------------------------------------------- */
  /* ---- URL validation chip — replaces ad-hoc inline state on .url-input ----
     Justification: the canon .url-input has no built-in state slot. We pair
     it with a sibling pill that flips between "✓ קישור תקין" / "✗ קישור לא תקין".
     The pill itself reuses .select-pill (canon) — only the *-ok / *-err
     modifiers are feedback-* additions. */
  .url-input-row {
    display: flex; gap: 10px; align-items: center;
    width: 100%; flex-wrap: wrap;
  }
  .url-input-row .url-input { flex: 1; min-width: 240px; }
  .feedback-validate-pill { white-space: nowrap; }
  .feedback-validate-pill.feedback-validate-pill--ok {
    background: rgba(120, 220, 180, 0.15);
    border-color: rgba(120, 220, 180, 0.55);
    color: #d4ffe8;
  }
  .feedback-validate-pill.feedback-validate-pill--err {
    background: rgba(255, 120, 120, 0.12);
    border-color: rgba(255, 120, 120, 0.45);
    color: #ffd9d9;
  }

  /* ---- Permission cards (camera + mic) ----
     Justification: each permission needs an icon, status badge, and CTA in
     a compact row. .tool-card alone is too generic; we add an inner
     row layout. Reuses .select-pill for the action button. */
  .feedback-perm-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  }
  @media (max-width: 720px) { .feedback-perm-grid { grid-template-columns: 1fr; } }
  .feedback-perm-card {
    display: flex; align-items: center; gap: 14px;
    background: var(--glass-bg);
    border: 1.5px solid var(--glass-border);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 14px 16px;
  }
  .feedback-perm-icon {
    font-size: 30px; line-height: 1;
    width: 52px; height: 52px;
    border-radius: 50%;
    background: rgba(110, 168, 255, 0.12);
    border: 1.5px solid rgba(180, 210, 255, 0.3);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .feedback-perm-body { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .feedback-perm-title { font-size: 14px; font-weight: 600; color: var(--text); }
  .feedback-perm-status {
    font-size: 12px; color: var(--text-dim);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .feedback-perm-status::before {
    content: ''; width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-dim);
  }
  .feedback-perm-status.feedback-perm-status--ok {
    color: rgba(180, 240, 200, 0.95);
  }
  .feedback-perm-status.feedback-perm-status--ok::before {
    background: #4ade80;
    box-shadow: 0 0 10px rgba(74, 222, 128, 0.7);
  }
  .feedback-perm-status.feedback-perm-status--denied {
    color: rgba(255, 180, 180, 0.95);
  }
  .feedback-perm-status.feedback-perm-status--denied::before {
    background: #f87171;
    box-shadow: 0 0 10px rgba(248, 113, 113, 0.7);
  }
  .feedback-perm-status.feedback-perm-status--idle::before {
    background: rgba(180, 210, 255, 0.45);
  }

  /* ---- Diagram source picker (mirrors fb-tab from the React) ----
     Justification: canon has no two-state mini-tab. Borrowing the same
     micro-tab pattern the React uses. */
  .feedback-mini-tabs {
    display: inline-flex;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--glass-border);
    padding: 3px; border-radius: 999px;
    margin-bottom: 8px;
  }
  .feedback-mini-tabs button {
    background: transparent; color: var(--text-dim);
    border: none; padding: 5px 14px; border-radius: 999px;
    font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .feedback-mini-tabs button.active {
    background: rgba(110, 168, 255, 0.25);
    color: var(--text);
  }
  .feedback-file-drop {
    background: rgba(255,255,255,0.04);
    border: 1.5px dashed rgba(180, 210, 255, 0.3);
    color: var(--text-dim);
    padding: 14px 18px; border-radius: 12px;
    font-size: 13px; cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .feedback-file-drop:hover {
    background: rgba(110, 168, 255, 0.06);
    border-color: rgba(180, 210, 255, 0.5);
  }
  .feedback-file-drop.feedback-file-drop--done {
    background: rgba(120, 220, 180, 0.08);
    border-color: rgba(120, 220, 180, 0.5);
    color: #d4ffe8;
  }

  /* ---- Audio routing notice (warning-style banner) ----
     Justification: a soft warning visually distinct from `tool-card`. */
  .feedback-notice {
    background: rgba(255, 200, 120, 0.08);
    border: 1.5px solid rgba(255, 200, 120, 0.3);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 13px; line-height: 1.5;
    color: rgba(255, 230, 200, 0.95);
    display: flex; gap: 10px; align-items: flex-start;
  }
  .feedback-notice .icon { font-size: 18px; line-height: 1.3; }

  /* ---- Big "Start" CTA wrapper ---- */
  .feedback-cta-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    margin-top: 8px;
  }
  .feedback-cta-wrap .cta-label {
    font-size: 13px; color: var(--text-dim);
    letter-spacing: 0.5px;
  }

  /* ---- RECORDING SCREEN ----------------------------------------------- */
  /* The recording screen overlays the full viewport (the React component
     does too: `.fb-recording-screen`). In the mockup we render it inside
     a tall stage so it lives next to the other previews. */
  .feedback-rec-stage {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    background: #000;
    min-height: 480px;
    aspect-ratio: 16 / 10;
    border: 1.5px solid var(--glass-border);
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
  }
  /* In the master assembler this could become fixed-inset 0 — for the
     mockup we keep it bounded so the preview is scrollable. */
  .feedback-rec-stage .yt-frame {
    width: 100%; height: 100%;
    border-radius: 0;
    border: none;
    aspect-ratio: auto;
  }
  .feedback-rec-stage .yt-frame::after {
    background:
      linear-gradient(135deg, rgba(110, 168, 255, 0.08), transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(255,255,255,0.06), transparent 60%);
    color: rgba(255, 255, 255, 0.35);
    font-size: 80px;
  }

  /* Pretend-thumbnail bars to suggest the YouTube video underneath */
  .feedback-yt-mock {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg,
        rgba(35, 12, 50, 0.95) 0%,
        rgba(20, 8, 35, 0.85) 40%,
        rgba(8, 12, 30, 0.9) 100%
      );
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .feedback-yt-mock::before {
    content: '';
    position: absolute; inset: 20% 30%;
    background:
      radial-gradient(circle, rgba(110, 168, 255, 0.25), transparent 70%);
    filter: blur(40px);
  }
  .feedback-yt-mock .yt-mock-title {
    position: relative; z-index: 2;
    text-align: center;
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    letter-spacing: 0.5px;
  }
  .feedback-yt-mock .yt-mock-title .play-glyph {
    font-size: 80px; opacity: 0.5;
    display: block; line-height: 1; margin-bottom: 8px;
  }

  /* Fullscreen button (canon: similar to .select-pill but icon-only) */
  .feedback-fs-btn {
    position: absolute; top: 12px; left: 12px;
    z-index: 10;
    width: 38px; height: 38px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.55);
    border: 1.5px solid rgba(255, 255, 255, 0.2);
    color: var(--text);
    font-size: 18px; cursor: pointer;
    backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
  }
  .feedback-fs-btn:hover { background: rgba(0, 0, 0, 0.75); }

  /* ---- PiP camera overlay (draggable) ----
     Justification: canon has no "draggable overlay box". This is the
     visual stand-in for `<CameraPiP>` from the React. */
  .feedback-pip {
    position: absolute;
    top: 18px; right: 18px;
    z-index: 6;
    width: 160px; height: 200px;
    border-radius: 14px;
    overflow: hidden;
    background: linear-gradient(135deg, rgba(60, 30, 80, 0.9), rgba(20, 10, 30, 0.95));
    border: 2px solid rgba(255, 255, 255, 0.35);
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.6);
    cursor: grab;
    display: flex; align-items: center; justify-content: center;
  }
  .feedback-pip::before {
    /* "camera silhouette" — head + shoulders blob */
    content: '';
    position: absolute;
    width: 100%; height: 100%;
    background:
      radial-gradient(ellipse 30% 30% at 50% 40%, rgba(220, 180, 200, 0.55), transparent 65%),
      radial-gradient(ellipse 70% 40% at 50% 95%, rgba(180, 140, 200, 0.5), transparent 70%);
  }
  .feedback-pip-grab-hint {
    position: absolute; top: 6px; left: 50%;
    transform: translateX(-50%);
    font-size: 16px; color: rgba(255,255,255,0.6);
    pointer-events: none;
    z-index: 2;
  }
  .feedback-pip-switch {
    position: absolute; bottom: 6px; right: 6px;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: rgba(0,0,0,0.65);
    border: 1px solid rgba(255,255,255,0.3);
    color: var(--text);
    font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 3;
  }

  /* ---- VU meter (vertical bars) ----
     Justification: the React uses a single horizontal canvas bar but the
     spec asks for vertical bars. We render 14 bars rising with a green→
     yellow→red gradient (matches the React canvas gradient). */
  .feedback-vu {
    position: absolute;
    bottom: 18px; right: 18px;
    z-index: 6;
    display: flex; gap: 3px; align-items: flex-end;
    height: 90px; padding: 10px 12px;
    background: rgba(0, 0, 0, 0.55);
    border: 1.5px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    backdrop-filter: blur(8px);
  }
  .feedback-vu .vu-bar {
    width: 5px;
    background: linear-gradient(to top, #4caf50 0%, #ffc107 65%, #f44336 100%);
    border-radius: 2px;
    box-shadow: 0 0 6px rgba(110, 168, 255, 0.3);
  }
  .feedback-vu .vu-help {
    position: absolute; top: -8px; right: -8px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: rgba(110, 168, 255, 0.85);
    border: 1px solid rgba(255,255,255,0.5);
    color: #fff; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }

  /* ---- Recording timer ----
     Justification: floating timer pill; canon has no equivalent. */
  .feedback-timer {
    position: absolute;
    top: 18px; left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    background: rgba(200, 0, 0, 0.85);
    color: #fff;
    padding: 6px 18px;
    border-radius: 999px;
    font-size: 16px; font-weight: 700;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 0 20px rgba(255, 80, 80, 0.5);
    display: flex; align-items: center; gap: 8px;
  }
  .feedback-timer .timer-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #fff;
    animation: feedbackBlink 1s ease-in-out infinite;
  }
  @keyframes feedbackBlink { 50% { opacity: 0.3; } }

  /* ---- Big REC button — pulses red when active ----
     Justification: extends canon .rec-btn. The base .rec-btn is the
     idle style; .feedback-rec-btn--active is the "recording" pulse. */
  .feedback-rec-area {
    position: absolute;
    bottom: 26px; left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .feedback-rec-area .rec-hint {
    font-size: 11px; color: rgba(255,255,255,0.7);
    background: rgba(0,0,0,0.55);
    padding: 4px 12px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .rec-btn.feedback-rec-btn--active {
    animation: feedbackRecPulse 1.2s ease-in-out infinite;
  }
  @keyframes feedbackRecPulse {
    0%, 100% {
      box-shadow: 0 0 25px rgba(255, 80, 80, 0.5),
                  0 0 0 0 rgba(255, 80, 80, 0.5);
      transform: scale(1);
    }
    50% {
      box-shadow: 0 0 45px rgba(255, 80, 80, 0.9),
                  0 0 0 14px rgba(255, 80, 80, 0);
      transform: scale(1.06);
    }
  }
  /* Stop variant — square inside the circle */
  .rec-btn.feedback-rec-btn--active::after {
    content: '';
    position: absolute;
    width: 24px; height: 24px;
    background: #fff;
    border-radius: 4px;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }
  .rec-btn { position: relative; }

  /* ---- Back button on rec screen (visible only when not recording) ---- */
  .feedback-rec-back {
    position: absolute;
    bottom: 26px; right: 22px;
    z-index: 6;
    background: rgba(0, 0, 0, 0.55);
    color: var(--text);
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 8px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    font-family: inherit; backdrop-filter: blur(10px);
  }
  .feedback-rec-back:hover { background: rgba(0, 0, 0, 0.75); }

  /* ---- PREVIEW SCREEN ------------------------------------------------- */
  /* Reuse .yt-frame for the recorded video, then a control row. */
  .feedback-preview-video {
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 14px;
    border: 1.5px solid var(--glass-border);
    position: relative;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .feedback-preview-video::before {
    /* fake recorded-content gradient */
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(135deg,
        rgba(80, 40, 120, 0.6) 0%,
        rgba(20, 30, 60, 0.7) 50%,
        rgba(10, 20, 40, 0.85) 100%);
  }
  .feedback-preview-video .play-glyph {
    position: relative; z-index: 2;
    width: 78px; height: 78px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    border: 2px solid rgba(255, 255, 255, 0.6);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; color: #fff;
    backdrop-filter: blur(6px);
  }
  .feedback-preview-video .playback-bar {
    position: absolute; left: 0; right: 0; bottom: 0;
    z-index: 3;
    height: 36px;
    padding: 6px 14px;
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    font-size: 11px; color: rgba(255,255,255,0.85);
  }
  .feedback-preview-video .pb-btn {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.35);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 11px;
  }
  .feedback-preview-video .pb-track {
    flex: 1; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.2);
    position: relative;
  }
  .feedback-preview-video .pb-track::after {
    content: '';
    position: absolute; inset: 0 60% 0 0;
    background: var(--accent);
    border-radius: 2px;
    box-shadow: 0 0 8px var(--accent);
  }
  .feedback-preview-video .pb-time {
    font-variant-numeric: tabular-nums;
    color: rgba(255,255,255,0.9);
  }

  /* ---- Preview action buttons ----
     Justification: these need to look weightier than .select-pill and group
     visually as "main actions". Reuses the canon glass surface. */
  .feedback-preview-actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 16px;
  }
  @media (max-width: 720px) { .feedback-preview-actions { grid-template-columns: 1fr; } }
  .feedback-action-btn {
    background: var(--glass-bg);
    border: 1.5px solid var(--glass-border);
    backdrop-filter: blur(10px);
    color: var(--text);
    padding: 14px 18px;
    border-radius: 14px;
    font-size: 14px; font-weight: 600;
    font-family: inherit; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: all 0.2s ease;
  }
  .feedback-action-btn:hover {
    background: rgba(110, 168, 255, 0.18);
    border-color: var(--accent);
    box-shadow: 0 6px 22px rgba(110, 168, 255, 0.3);
    transform: translateY(-2px);
  }
  .feedback-action-btn .ico { font-size: 22px; }
  .feedback-action-btn.feedback-action-btn--primary {
    background: linear-gradient(135deg, rgba(110, 168, 255, 0.45), rgba(42, 90, 255, 0.3));
    border-color: var(--accent-2);
    box-shadow: 0 0 24px rgba(110, 168, 255, 0.4);
  }
  .feedback-action-btn.feedback-action-btn--done {
    background: rgba(120, 220, 180, 0.18);
    border-color: rgba(120, 220, 180, 0.55);
    color: #d4ffe8;
  }

</style>
</head>

<div class="aurora">
  <div class="blob blob-1"></div>

  // ===== Generic drawer renderer =====
  function renderLevelsDrawer(exId, exTitle, levels) {
    const items = levels.map(l => {
      const classes = ['level-item'];
      if (l.current) classes.push('active');
      if (l.done && !l.current) classes.push('completed');
      if (l.locked) classes.push('locked');
      const icon = l.locked   ? '🔒'
                 : l.current  ? '●'
                 : l.done     ? '✓'
                 :              '';
      return `
        <li class="${classes.join(' ')}" onclick="${l.locked ? '' : `selectLevel('${exId}', ${l.n})`}">
          <span class="level-item-num">${l.n}</span>
          <span class="level-item-label">${l.label}</span>
          <span class="level-item-icon">${icon}</span>
        </li>`;
    }).join('');
    return `
      <div class="levels-overlay" id="levels-overlay-${exId}" onclick="toggleDrawer('${exId}')"></div>
      <aside class="levels-drawer" id="levels-drawer-${exId}" role="dialog" aria-label="בחר שלב">
        <div class="levels-drawer-header">
          <h3 class="levels-drawer-title">
            <span class="ex-tag">${exId.toUpperCase()}</span>
            <span>בחר שלב</span>
          </h3>
          <button class="levels-drawer-close" onclick="toggleDrawer('${exId}')" aria-label="סגור">✕</button>
        </div>
        <ul class="levels-drawer-list">${items}</ul>
      </aside>`;
  }

  function renderLevelsTrigger(exId, currentLabel) {
    return `
      <button class="levels-trigger" onclick="toggleDrawer('${exId}')" title="בחר שלב">
        <span class="hamburger">☰</span>
        <span>שלבים</span>
        <span class="current-level">· ${currentLabel}</span>
      </button>`;
  }

  // ===== Melodic Hub (radial) =====
  function renderMelodicHub() {
    const sats = [
      { icon: '🎯', label: 'זיהוי דרגה',  sub: 'M1', goto: 'ex-m1', slot: 1 },
      { icon: '↕️', label: 'כיוון תנועה', sub: 'M2', goto: 'ex-m2', slot: 2 },
      { icon: '🎶', label: 'זיהוי סולם',  sub: 'M3', goto: 'ex-m3', slot: 3 }
    ];
    const n = sats.length;
    const satHtml = sats.map((s, i) => {
      const angle = (i * 360 / n).toFixed(2);
      return `
        <div class="satellite s-${s.slot}" style="--angle:${angle}deg" data-angle="${angle}">
          <div class="label">${s.label}</div>
          <div class="orb" onclick="navigate('${s.goto}')">${s.icon}</div>
          <div class="sub-label">${s.sub}</div>
        </div>`;
    }).join('');
    return `
      <div class="stage">
        <div class="constellation" id="cur-const">
          <svg class="lines" id="cur-lines"></svg>
          <div class="center-hub">
            <div class="center-info">
              <div class="emoji">🎵</div>
              <h2>מלודיה</h2>
              <p>3 Exercises</p>
            </div>
          </div>
          ${satHtml}
        </div>
      </div>`;
  }

  // ===== Helper: degree-clock dial for M1 =====
  function renderDegreeClock(activeDegrees, currentlyHighlighted, tonic, scaleName) {
    // 12 semitones around the dial. Display only the active diatonic +
    // chromatic chips at their semitone position. 0 = top, going clockwise.
    const labelMap = {
      0: 'I', 1: '♭II', 2: 'II', 3: '♭III', 4: 'III', 5: 'IV',
      6: '♭V', 7: 'V', 8: '♭VI', 9: 'VI', 10: '♭VII', 11: 'VII'
    };
    // diatonic = {0,2,4,5,7,9,11}; everything else is chromatic
    const diatonic = new Set([0, 2, 4, 5, 7, 9, 11]);
    const marks = activeDegrees.map(d => {
      const angle = (d * 360 / 12).toFixed(2);
      const isActive = d === currentlyHighlighted;
      const isChrom = !diatonic.has(d);
      const cls = ['melodic-degree-mark'];
      if (isActive) cls.push('active');
      if (isChrom)  cls.push('chromatic');
      return `<div class="${cls.join(' ')}" style="--angle:${angle}deg">${labelMap[d]}</div>`;
    }).join('');
    return `
      <div class="melodic-degree-clock">
        <div class="melodic-degree-clock-center">
          <span class="tonic-label">Tonic</span>
          <span class="tonic-name">${tonic}</span>
          <span class="scale-name">${scaleName}</span>
        </div>
        ${marks}
      </div>`;
  }

  // ===== Exercise M1 — זיהוי דרגה =====
  function renderM1() {
    const level = M1_LEVELS.find(l => l.current) || M1_LEVELS[0];
    // Level 4 config: notes [0, 11, 2, 7] = I, VII, II, V — major in C
    const activeDegrees = [0, 11, 2, 7];
    const highlighted = 7; // pretend the played note is V
    const degreeLabels = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];
    const ansChips = degreeLabels.map(d =>
      `<button class="ans-chip${d === 'V' ? ' active' : ''}">${d}</button>`
    ).join('');

    return `
      ${renderLevelsTrigger('m1', `שלב ${level.n}`)}
      <div class="exercise-stage">
        <div class="ex-header">
          <div class="ex-code">M1</div>
          <h1 class="ex-title">זיהוי דרגה</h1>
          <div class="ex-progress">שאלה 4 / 10  ·  מהפעם הראשונה: 3  ·  ${level.label}</div>
        </div>

        <p class="ex-prompt">אקורד טוניקה ← תו — איזו דרגה ניגנה?</p>

        <button class="play-pad" title="נגן שוב">▶</button>

        ${renderDegreeClock(activeDegrees, highlighted, 'C', "Major")}

        <div class="ex-answers">${ansChips}</div>

        <!-- DegreeNameToggle: I,IV,V ↔ C,F,G -->
        <div class="toggles-row">
          <button class="pill-toggle active">I II III</button>
          <button class="pill-toggle">C D E</button>
        </div>

        <!-- Full settings strip (mirrors the React ctrlRow) -->
        <div class="melodic-settings-strip">
          <div class="strip-title">הגדרות תרגיל</div>
          <div class="control-row">
            <span class="select-pill" style="cursor:default"><strong>שאלות:</strong> <span class="v">10</span></span>
            <span class="select-pill" style="cursor:default"><strong>רפרנס:</strong> <span class="v">אקורד</span></span>
            <span class="select-pill" style="cursor:default"><strong>כלי:</strong> <span class="v">פסנתר</span></span>
          </div>
          <div class="control-row" style="opacity:0.85">
            <button class="pill-toggle active">קדנצה</button>
            <button class="pill-toggle">אקורד</button>
            <button class="pill-toggle">תו</button>
            <button class="pill-toggle">ללא</button>
            <span style="opacity:0.4; padding:0 4px">·</span>
            <button class="pill-toggle active">פסנתר</button>
            <button class="pill-toggle">גיטרה</button>
          </div>
        </div>

  function drawConstellationLines() {
    const container = document.getElementById('cur-const');
    const svg = document.getElementById('cur-lines');
    if (!container || !svg) return;
    const w = container.clientWidth, h = container.clientHeight;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.innerHTML = '';
    const cRect = container.getBoundingClientRect();
    const cx = w / 2, cy = h / 2;
    container.querySelectorAll('.satellite .orb').forEach(orb => {
      const r = orb.getBoundingClientRect();
      const x = r.left + r.width / 2 - cRect.left;
      const y = r.top + r.height / 2 - cRect.top;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', cx); line.setAttribute('y1', cy);
      line.setAttribute('x2', x);  line.setAttribute('y2', y);
      svg.appendChild(line);
    });
  }

  function drawConstellationLines() {
    const container = document.getElementById('cur-const');
    const svg = document.getElementById('cur-lines');
    if (!container || !svg) return;
    const w = container.clientWidth, h = container.clientHeight;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.innerHTML = '';
    const cRect = container.getBoundingClientRect();
    const cx = w / 2, cy = h / 2;
    container.querySelectorAll('.satellite .orb').forEach(orb => {
      const r = orb.getBoundingClientRect();
      const x = r.left + r.width / 2 - cRect.left;
      const y = r.top + r.height / 2 - cRect.top;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', cx); line.setAttribute('y1', cy);
      line.setAttribute('x2', x);  line.setAttribute('y2', y);
      svg.appendChild(line);
    });
  }

  // ===== Helper: Roman-numeral degree wheel for F0 =====
  function renderDegreeWheel(activeDegree, tonic, mode, includeChromatic) {
    const romanMajor = ['I','ii','iii','IV','V','vi','vii°'];
    // chord names in C major for the hint text
    const chordMajor = ['C','Dm','Em','F','G','Am','B°'];
    // 7 diatonic spokes, evenly distributed around the circle
    const diatonic = romanMajor.map((r, i) => ({
      idx: i, roman: r, chord: chordMajor[i], chromatic: false
    }));
    let all = diatonic;
    if (includeChromatic) {
      // place chromatic spokes between diatonic ones at half-angle offsets
      const chrom = [
        { idx: 1.5, roman: 'V/V', chord: 'D7',  chromatic: true },
        { idx: 4.5, roman: '♭VII', chord: 'B♭', chromatic: true },
        { idx: 6.5, roman: '♭VI', chord: 'A♭', chromatic: true }
      ];
      all = [...diatonic, ...chrom];
    }
    const total = 7; // angle math always uses the 7-slot diatonic frame
    const marks = all.map(d => {
      const angle = ((d.idx) * 360 / total).toFixed(2);
      const isActive = d.roman === activeDegree;
      const cls = ['functional-degree-spoke'];
      if (isActive)     cls.push('active');
      if (d.chromatic)  cls.push('chromatic');
      return `
        <div class="${cls.join(' ')}" style="--angle:${angle}deg">
          <span>${d.roman}</span>
          <span class="chord-hint">${d.chord}</span>
        </div>`;
    }).join('');
    return `
      <div class="functional-degree-wheel">
        <div class="functional-degree-wheel-center">
          <span class="tonic-label">Tonic</span>
          <span class="tonic-name">${tonic}</span>
          <span class="mode-name">${mode}</span>
        </div>
        ${marks}
      </div>`;
  }

  function drawConstellationLines() {
    const container = document.getElementById('cur-const');
    const svg = document.getElementById('cur-lines');
    if (!container || !svg) return;
    const w = container.clientWidth, h = container.clientHeight;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.innerHTML = '';
    const cRect = container.getBoundingClientRect();
    const cx = w / 2, cy = h / 2;
    container.querySelectorAll('.satellite .orb').forEach(orb => {
      const r = orb.getBoundingClientRect();
      const x = r.left + r.width / 2 - cRect.left;
      const y = r.top + r.height / 2 - cRect.top;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', cx); line.setAttribute('y1', cy);
      line.setAttribute('x2', x);  line.setAttribute('y2', y);
      svg.appendChild(line);
    });
  }

  // ===== 4-voice stack visualizer =====
  // highlightedVoice: 'soprano' | 'bass' (which row glows + gets arrow)
  // fromIdx / toIdx: which two columns to mark as FROM (orange) and TO (green)
  //                 and between which to draw the motion arrow.
  // motionLabel: short Hebrew label printed on the arrow (e.g. "↓ צעד").
  function renderVoiceStack(prog, highlightedVoice, fromIdx, toIdx, motionLabel) {
    const voiceMeta = [
      { key: 'soprano', he: 'סופרן',  en: 'Soprano (S)' },
      { key: 'alto',    he: 'אלט',    en: 'Alto (A)'    },
      { key: 'tenor',   he: 'טנור',   en: 'Tenor (T)'   },
      { key: 'bass',    he: 'באס',    en: 'Bass (B)'    }
    ];
    const n = prog.voicings.length;
    // Each cell sits inside a grid with columns: [tag, c0, c1, …, c(n-1)]
    // Tag column = 70px. Remaining = 1fr each. Arrow span between columns
    // (fromIdx+2) and (toIdx+2) in 1-based grid terms.

    const rows = voiceMeta.map(vm => {
      const isHi = vm.key === highlightedVoice;
      const cls = ['voice-leading-voice-row'];
      cls.push(isHi ? 'highlighted' : 'dim');
      const cells = prog.voicings.map((v, idx) => {
        const noteCls = ['voice-leading-voice-note'];
        if (isHi && idx === fromIdx) noteCls.push('from-note');
        if (isHi && idx === toIdx)   noteCls.push('to-note');
        return `<div class="voice-leading-voice-cell">
                  <div class="${noteCls.join(' ')}">${v[vm.key]}</div>
                </div>`;
      }).join('');

      // Arrow overlay on highlighted row only.
      // We place it as a positioned element spanning roughly the gap
      // between FROM cell center and TO cell center. Approximation: each
      // column is (100% - 70px) / n; we put the arrow positioned with
      // CSS calc() between those two centers.
      let arrow = '';
      if (isHi) {
        // Position arrow between fromIdx and toIdx using CSS calc().
        // left edge of column k center: 70px + (k + 0.5) * cellW
        // We'll set left = center of FROM cell, width = (toIdx-fromIdx)*cellW.
        const leftPct  = `calc(70px + (100% - 70px) * ${(fromIdx + 0.5) / n})`;
        const widthPct = `calc((100% - 70px) * ${Math.abs(toIdx - fromIdx) / n})`;
        // direction marker for the arrow head — bass V1 in our sample
        // moves DOWN (from A2 to G2 is descending) — but visually on the
        // row the cells are side-by-side, so the arrow just travels
        // horizontally L→R. The motion-tag label tells the listener
        // whether it was up/down/step/skip.
        arrow = `
          <div class="voice-leading-motion-arrow"
               style="left: ${leftPct}; width: ${widthPct};">
            <span class="motion-tag">${motionLabel}</span>
            <svg viewBox="0 0 100 20" preserveAspectRatio="none">
              <path class="arrow-stem" d="M 4 10 L 92 10" />
              <polygon class="arrow-head" points="92,4 98,10 92,16" />
            </svg>
          </div>`;
      }

      return `
        <div class="${cls.join(' ')}" style="--chord-count: ${n}">
          <div class="voice-leading-voice-tag">
            <span class="he">${vm.he}</span>
            <span>${vm.en}</span>
          </div>
          ${cells}
          ${arrow}
        </div>`;
    }).join('');

    // Chord-symbol strip under the stack
    const chordCells = prog.voicings.map((v, idx) => {
      const cls = ['voice-leading-prog-chord'];
      if (idx === toIdx)   cls.push('current');
      if (idx === fromIdx) cls.push('from-chord');
      return `
        <div class="${cls.join(' ')}">
          <span class="sym">${v.chord}</span>
          <span class="deg">${v.deg}</span>
        </div>`;
    }).join('');

    return `
      <div class="voice-leading-voice-stack">
        <div class="voice-leading-stack-header">
          <span>פרוגרסיה — <span class="key-tag">${prog.name}</span></span>
          <span class="key-tag">${prog.key}</span>
        </div>
        ${rows}
        <div class="voice-leading-prog-row" style="--chord-count: ${n}">
          <div class="prog-tag">אקורדים</div>
          ${chordCells}
        </div>
      </div>`;
  }

  function drawConstellationLines() {
    const container = document.getElementById('cur-const');
    const svg = document.getElementById('cur-lines');
    if (!container || !svg) return;
    const w = container.clientWidth, h = container.clientHeight;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.innerHTML = '';
    const cRect = container.getBoundingClientRect();
    const cx = w / 2, cy = h / 2;
    container.querySelectorAll('.satellite .orb').forEach(orb => {
      const r = orb.getBoundingClientRect();
      const x = r.left + r.width / 2 - cRect.left;
      const y = r.top + r.height / 2 - cRect.top;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', cx); line.setAttribute('y1', cy);
      line.setAttribute('x2', x);  line.setAttribute('y2', y);
      svg.appendChild(line);
    });
  }

  // ===== Helper: render staff with notes + syllable labels =====

  function renderSolfegeStaff(notes, opts = {}) {

  function drawConstellationLines() {
    const container = document.getElementById('cur-const');
    const svg = document.getElementById('cur-lines');
    if (!container || !svg) return;
    const w = container.clientWidth, h = container.clientHeight;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.innerHTML = '';
    const cRect = container.getBoundingClientRect();
    const cx = w / 2, cy = h / 2;
    container.querySelectorAll('.satellite .orb').forEach(orb => {
      const r = orb.getBoundingClientRect();
      const x = r.left + r.width / 2 - cRect.left;
      const y = r.top + r.height / 2 - cRect.top;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', cx); line.setAttribute('y1', cy);
      line.setAttribute('x2', x);  line.setAttribute('y2', y);
      svg.appendChild(line);
    });
  }

    overlay.classList.toggle('open', open);

<script>
// ============ guitar ============

  // ===== Level data (mirrors LEVELS + LEVEL_DEFAULTS from ExerciseG1.jsx) =====
  // The 7 levels build from "single note on A string, frets 0-5" all the way
  // up to "6-note melody in 5th position (frets 5-8) on all strings".
  const G1_LEVELS = [
    { n: 1, label: 'שלב 1 — תו בודד, מיתר A, פרטים 0-5',           strings: ['A'],                              frets: [0, 5], notes: 1, done: true  },
    { n: 2, label: 'שלב 2 — תו בודד, כל המיתרים, פרטים 0-5',       strings: ['E','A','D','G','B','e'],          frets: [0, 5], notes: 1, done: true  },
    { n: 3, label: 'שלב 3 — 2 תווים, תנועה מדרגית',                strings: ['E','A','D','G','B','e'],          frets: [0, 5], notes: 2, done: false, current: true },
    { n: 4, label: 'שלב 4 — 3 תווים, מעורב',                       strings: ['E','A','D','G','B','e'],          frets: [0, 5], notes: 3, done: false },
    { n: 5, label: 'שלב 5 — פוזיציה 1 (פרטים 0-3), 4 תווים',       strings: ['E','A','D','G','B','e'],          frets: [0, 3], notes: 4, done: false },
    { n: 6, label: 'שלב 6 — פוזיציה 2 (פרטים 2-5), 5 תווים',       strings: ['E','A','D','G','B','e'],          frets: [2, 5], notes: 5, done: false, locked: true },
    { n: 7, label: 'שלב 7 — פוזיציה 5 (פרטים 5-8), 6 תווים',       strings: ['E','A','D','G','B','e'],          frets: [5, 8], notes: 6, done: false, locked: true }
  ];

  // ===== Generic drawer renderer (identical to melodic fragment) =====
  function renderLevelsDrawer(exId, exTitle, levels) {
    const items = levels.map(l => {
      const classes = ['level-item'];
      if (l.current) classes.push('active');
      if (l.done && !l.current) classes.push('completed');
      if (l.locked) classes.push('locked');
      const icon = l.locked   ? '🔒'
                 : l.current  ? '●'
                 : l.done     ? '✓'
                 :              '';
      return `
        <li class="${classes.join(' ')}" onclick="${l.locked ? '' : `selectLevel('${exId}', ${l.n})`}">
          <span class="level-item-num">${l.n}</span>
          <span class="level-item-label">${l.label}</span>
          <span class="level-item-icon">${icon}</span>
        </li>`;
    }).join('');
    return `
      <div class="levels-overlay" id="levels-overlay-${exId}" onclick="toggleDrawer('${exId}')"></div>
      <aside class="levels-drawer" id="levels-drawer-${exId}" role="dialog" aria-label="בחר שלב">

          </h3>
          <button class="levels-drawer-close" onclick="toggleDrawer('${exId}')" aria-label="סגור">✕</button>
        </div>

  }

  function renderLevelsTrigger(exId, currentLabel) {
    return `
      <button class="levels-trigger" onclick="toggleDrawer('${exId}')" title="בחר שלב">
        <span class="hamburger">☰</span>
        <span>שלבים</span>
        <span class="current-level">· ${currentLabel}</span>
      </button>`;
  }

  // ===== Guitar Hub (radial — 1 satellite at 12 o'clock) =====
  function renderGuitarHub() {
    // Only ONE satellite → place it at 12 o'clock (angle 0deg).
    const sats = [
      { icon: '🗺️', label: 'מיפוי צוואר', sub: 'G1', goto: 'ex-g1', slot: 1, angle: 0 }
    ];
    const satHtml = sats.map(s => `

        <div class="label">${s.label}</div>
        <div class="orb" onclick="navigate('${s.goto}')">${s.icon}</div>
        <div class="sub-label">${s.sub}</div>

    return `
      <div class="stage">
        <div class="constellation" id="cur-const">
          <svg class="lines" id="cur-lines"></svg>

            <div class="center-info">

              <h2>גיטרה</h2>
              <p>1 Exercise · 7 Levels</p>
            </div>
          </div>
          ${satHtml}
        </div>
      </div>`;
  }

  // ===== Helper: standard guitar tuning + chromatic =====
  // Strings from low to high (visual top = high e in canon `.fb-grid`).
  // We render top→bottom: e, B, G, D, A, E (matches canon `positions` tool).
  const STRINGS_DISPLAY = ['e','B','G','D','A','E'];        // top → bottom in the grid
  const OPEN_PITCH      = { 'e': 64, 'B': 59, 'G': 55, 'D': 50, 'A': 45, 'E': 40 };
  const CHROM = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  function noteAt(stringName, fret) {
    const midi = OPEN_PITCH[stringName] + fret;
    return CHROM[midi % 12];
  }

  // ===== Exercise G1 — מיפוי צוואר =====
  function renderG1() {
    const level = G1_LEVELS.find(l => l.current) || G1_LEVELS[0];
    const FRETS = 13; // 0 (open / nut) + 12 frets visible
    const activeStrings = new Set(level.strings);
    const [fromFret, toFret] = level.frets;

    // Mock state — for level 3 (current) we have 2 notes, the first one has
    // already been placed; the second is the "target" that the user must
    // click. We choose A string fret 3 (= C) for placed[0], and D string
    // fret 2 (= E) as the target.
    const placedNotes = [
      { string: 'A', fret: 3, seq: 1 }
    ];
    const targetCell = { string: 'D', fret: 2 };

    // Build fret-number header row
    const fretNums = ['<div></div>'];
    for (let f = 0; f < FRETS; f++) {
      fretNums.push(`<div class="fb-cell fret-num">${f}</div>`);
    }

    // Build one row per string
    const stringRows = STRINGS_DISPLAY.map(sn => {
      const stringActive = activeStrings.has(sn);
      const cells = [];
      for (let f = 0; f < FRETS; f++) {
        const inRange       = (f >= fromFret && f <= toFret);
        const isPlaced      = placedNotes.find(p => p.string === sn && p.fret === f);
        const isTarget      = (targetCell.string === sn && targetCell.fret === f);
        const noteName      = noteAt(sn, f);
        const classList     = ['fb-cell'];
        if (f === 0) classList.push('nut');
        if (stringActive && inRange) {
          classList.push('guitar-fret-cell');
        } else if (!stringActive) {
          classList.push('guitar-fret-disabled');
        } else if (!inRange) {
          classList.push('guitar-fret-out-of-range');
        }

        let inner = '';
        if (isPlaced) {
          inner = `<div class="fb-dot guitar-fret-placed">${isPlaced.seq}</div>`;
        } else if (isTarget) {
          inner = `<div class="guitar-fret-target"></div>`;
        } else if (stringActive && inRange && f > 0) {
          // a faint "available cell" hint dot to make the active region visible
          inner = `<div class="fb-dot" style="width:6px;height:6px;background:rgba(180,210,255,0.18);"></div>`;
        }
        cells.push(`<div class="${classList.join(' ')}">${inner}</div>`);
      }
      return `<div class="fb-string">${sn}</div>${cells.join('')}`;
    }).join('');

    // Note progress indicator (NoteIndicator equivalent)
    const noteDots = [];
    for (let i = 0; i < level.notes; i++) {
      const cls = i < placedNotes.length ? 'done'
                : i === placedNotes.length ? 'current'
                : '';
      noteDots.push(`<div class="guitar-note-dot ${cls}">${i + 1}</div>`);
    }

    // String filter chips — show all 6, off-styled if not in level
    const stringChips = STRINGS_DISPLAY.map(sn => {
      const on = activeStrings.has(sn);
      return `<button class="guitar-string-chip${on ? '' : ' off'}">${sn}</button>`;
    }).join('');

    return `
      ${renderLevelsTrigger('g1', `שלב ${level.n}`)}
      <div class="exercise-stage">
        <div class="ex-header">
          <div class="ex-code">G1</div>
          <h1 class="ex-title">מיפוי צוואר גיטרה</h1>
          <div class="ex-progress">שאלה 4 / 10  ·  מהפעם הראשונה: 3  ·  ${level.label}</div>
        </div>

        <p class="ex-prompt">שמע את המנגינה ולחץ על הפרט הנכון בצוואר עבור כל תו.</p>

        <button class="play-pad" title="נגן שוב">🔊</button>

        <!-- NoteIndicator equivalent: ●●○ — which note in the sequence -->
        <div class="guitar-note-indicator">
          <span class="ni-label">תו</span>
          ${noteDots.join('')}
          <span class="ni-label" style="margin-inline:6px 0">מתוך ${level.notes}</span>
        </div>

        <div class="guitar-fretboard-wrap">
          <!-- Range banner — communicates the level's fret window -->
          <div class="control-row" style="gap:14px">
            <div class="guitar-range-banner">
              <span class="dot"></span>
              <span>טווח פרטים:</span>
              <span class="v">${fromFret}-${toFret}</span>
            </div>
            <!-- String filter — visualizes which strings are live at this level -->
            <div class="guitar-string-filter">
              <span class="gsf-label">מיתרים</span>
              ${stringChips}
            </div>
          </div>

          <div class="fretboard" dir="ltr">
            <div class="fb-grid">
              ${fretNums.join('')}
              ${stringRows}
            </div>
          </div>

          <div class="guitar-fb-legend">
            <span class="legend-item"><span class="swatch scale"></span> אפשרי</span>
            <span class="legend-item"><span class="swatch placed"></span> סימנת</span>
            <span class="legend-item"><span class="swatch target"></span> מטרה (רמז)</span>
          </div>
        </div>

        <!-- Note-name display toggle: visible labels on/off -->
        <div class="toggles-row">
          <button class="pill-toggle active">שמות תווים: גלוי</button>
          <button class="pill-toggle">שמות תווים: מוסתר</button>
        </div>

        <!-- Settings strip — mirrors ctrlRow in ExerciseG1.jsx -->
        <div class="guitar-settings-strip">
          <div class="strip-title">הגדרות תרגיל</div>
          <div class="control-row">
            <span class="select-pill" style="cursor:default"><strong>שאלות:</strong> <span class="v">10</span></span>

  // Builds a 4-bar × 4-beat × 4-subdivision grid.
  // Rows = bars (4). Each row contains 16 cells = 4 beats × 4 sixteenths.
  function buildRhythmGrid({ numBars = 4, hits = [], expected = [], currentCol = -1 } = {}) {
    const SUB_PER_BEAT = 4;
    const BEATS_PER_BAR = 4;
    const CELLS = BEATS_PER_BAR * SUB_PER_BEAT;
    const rows = [];
    for (let b = 0; b < numBars; b++) {
      const cells = [];
      for (let s = 0; s < CELLS; s++) {
        const sub = s % SUB_PER_BEAT;
        const cls = ['dictation-rhythm-cell'];
        if (sub === 0) cls.push('is-downbeat');
        if (sub === 2) cls.push('is-eighth');
        const key = `${b}-${s}`;
        if (hits.includes(key))     cls.push('is-hit');
        if (expected.includes(key)) cls.push('is-expected');
        if (currentCol === s && b === 1) cls.push('is-now'); // pretend metronome is sweeping bar 2
        const glyph = sub === 0 ? (s/SUB_PER_BEAT + 1) : (sub === 2 ? '&' : '');
        cells.push(`<div class="${cls.join(' ')}">${glyph}</div>`);
      }
      const rowCls = ['dictation-rhythm-grid-row'];
      if (b > 0) rowCls.push('is-bar-divider');
      rows.push(`
        <div class="${rowCls.join(' ')}">
          <div class="dictation-rhythm-row-label">תיבה <span class="bar-num">${b+1}</span></div>
          ${cells.join('')}
        </div>`);
    }
    return `<div class="dictation-rhythm-grid">${rows.join('')}</div>`;
  }

  function buildBeatCounter(numBars, activeBar, activeBeat, phase) {
    const bars = [];
    for (let b = 0; b < numBars; b++) {
      const dots = [];
      for (let beat = 0; beat < 4; beat++) {
        const cls = ['dictation-beat-dot'];
        if (beat === 0) cls.push('accent');
        if (b === activeBar && beat === activeBeat) {
          cls.push(phase === 'rec' ? 'active-rec' : 'active-play');
        }
        dots.push(`<div class="${cls.join(' ')}">${beat + 1}</div>`);
      }
      if (b > 0) bars.push(`<span class="bar-sep">|</span>`);
      bars.push(`<div class="bar-group">${dots.join('')}</div>`);
    }
    return `<div class="dictation-beat-counter">${bars.join('')}</div>`;
  }

  function buildVUMeter(level = 0.55, recording = true) {
    const SEGS = 16;
    const filled = Math.min(1, level * 4);
    const litCount = Math.round(filled * SEGS);
    const segs = [];
    for (let i = 0; i < SEGS; i++) {
      const lit = i < litCount;
      let color = '';
      if (lit) {
        if (i < SEGS * 0.6)       color = 'green';
        else if (i < SEGS * 0.85) color = 'yellow';
        else                       color = 'red';
      }
      segs.push(`<div class="dictation-vu-seg${lit ? ' lit ' + color : ''}"></div>`);
    }
    return `
      <div class="dictation-vu-row">
        <span class="dictation-vu-label">🎙</span>
        <div class="dictation-vu-meter">${segs.join('')}</div>
        ${recording ? '<span class="dictation-vu-rec">REC</span>' : ''}
      </div>`;
  }

  function drawConstellationLines() {
    const container = document.getElementById('cur-const');
    const svg = document.getElementById('cur-lines');
    if (!container || !svg) return;
    const w = container.clientWidth, h = container.clientHeight;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.innerHTML = '';
    const cRect = container.getBoundingClientRect();
    const cx = w / 2, cy = h / 2;
    container.querySelectorAll('.satellite .orb').forEach(orb => {
      const r = orb.getBoundingClientRect();
      const x = r.left + r.width / 2 - cRect.left;
      const y = r.top + r.height / 2 - cRect.top;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', cx); line.setAttribute('y1', cy);
      line.setAttribute('x2', x);  line.setAttribute('y2', y);
      svg.appendChild(line);
    });
  }

  // ---- Beat grid (Rhythm Explorer) ----

        const playing = playingPos && playingPos.beat === beatIdx && playingPos.cell === cellIdx;
        return `<div class="rhythm-cell state-${state} ${playing ? 'playing' : ''}"

      }).join('');
      return `

          <div class="rhythm-beat-label">Beat ${beatIdx + 1}</div>

  const CHROMATIC = ['A', 'A#/Bb', 'B', 'C', 'C#/Db', 'D', 'D#/Eb', 'E', 'F', 'F#/Gb', 'G', 'G#/Ab'];

    { id: 'dots',    label: 'Dots Only'    },

  ];
  const ARPEGGIOS = [

  // Scale list — short subset of allScalesData.js
  const SCALE_OPTGROUPS = [
    { label: 'Major Family', items: [

  ];

  // ===== Helper: render a 14-fret fretboard =====
  //  dotsFn(stringIdx, fret) -> { show: bool, root?: bool, arp?: bool, label?: string }
  function renderFretboard(dotsFn) {
    const stringNames = ['e', 'B', 'G', 'D', 'A', 'E']; // high to low
    const fretNums = Array.from({length: 14}, (_, i) =>
      `<div class="fb-cell fret-num">${i}</div>`).join('');
    const rows = stringNames.map((sn, sIdx) => {
      const cells = Array.from({length: 14}, (_, fIdx) => {
        const d = dotsFn(sIdx, fIdx) || {};
        const nut = fIdx === 0 ? 'nut' : '';
        if (!d.show) return `<div class="fb-cell ${nut}"></div>`;
        const cls = ['fb-dot'];
        if (d.root) cls.push('root');
        if (d.arp)  cls.push('arp');
        const style = d.color ? `style="background:${d.color}; box-shadow:0 0 10px ${d.color}"` : '';
        return `<div class="fb-cell ${nut}"><div class="${cls.join(' ')}" ${style}>${d.label || ''}</div></div>`;
      }).join('');
      return `<div class="fb-string">${sn}</div>${cells}`;
    }).join('');
    return `
      <div class="fretboard">
        <div class="fb-grid">
          <div></div>${fretNums}
          ${rows}
        </div>
      </div>`;
  }

  // Mini fretboard for partial-chord cards — 5 frets wide, 6 strings
  function renderMiniFretboard(dotsFn, startFret) {
    const stringNames = ['e','B','G','D','A','E'];
    const fretNums = Array.from({length: 5}, (_, i) =>
      `<div class="mini-cell fret-num">${startFret + i}</div>`).join('');
    const rows = stringNames.map((sn, sIdx) => {
      const cells = Array.from({length: 5}, (_, fIdx) => {
        const d = dotsFn(sIdx, fIdx) || {};
        if (!d.show) return `<div class="mini-cell"></div>`;
        const cls = ['mini-dot'];
        if (d.root) cls.push('root');
        return `<div class="mini-cell"><div class="${cls.join(' ')}">${d.label || ''}</div></div>`;
      }).join('');
      return `<div class="mini-string">${sn}</div>${cells}`;
    }).join('');
    return `
      <div class="positions-mini-fb">
        <div></div>${fretNums}
        ${rows}
      </div>`;
  }

  // ===== Dot generators per tab =====
  // A minor scale in G-shape (5th fret position) — degrees displayed
  function dotsForPositionsTab(sIdx, fIdx) {
    // mock A natural minor in 5th-position area
    const map = {
      // [stringIdx]: { fIdx: {root, label} }
      0: { 5: { label: 'A', root: true }, 7: { label: 'b' }, 8: { label: 'c' }, 10: { label: 'd' }, 12: { label: 'e' } },
      1: { 5: { label: 'e' }, 6: { label: 'f' }, 8: { label: 'g' }, 10: { label: 'a', root: true } },
      2: { 5: { label: 'c' }, 7: { label: 'd' }, 9: { label: 'e' }, 10: { label: 'f' }, 12: { label: 'g' } },
      3: { 5: { label: 'g' }, 7: { label: 'a', root: true }, 8: { label: 'b' }, 10: { label: 'c' }, 12: { label: 'd' } },
      4: { 5: { label: 'd' }, 7: { label: 'e' }, 8: { label: 'f' }, 10: { label: 'g' }, 12: { label: 'a', root: true } },
      5: { 5: { label: 'a', root: true }, 7: { label: 'b' }, 8: { label: 'c' }, 10: { label: 'd' }, 12: { label: 'e' } }
    };
    const cell = map[sIdx] && map[sIdx][fIdx];
    if (!cell) return null;
    // Show degree labels for the active mode
    const degreeMap = { a: '1', b: '2', c: 'b3', d: '4', e: '5', f: 'b6', g: 'b7' };
    return { show: true, root: cell.root, label: degreeMap[cell.label.toLowerCase()] || cell.label };
  }

  // Arpeggios overlay — i (Am) + iv (Dm) overlaid on Am scale dots
  function dotsForArpeggiosTab(sIdx, fIdx) {
    // First show greyish scale dots, then color overlays for active arpeggios
    const scaleCell = dotsForPositionsTab(sIdx, fIdx);
    // i = Am (root A, 3rd C, 5th E) — cyan
    const iCells = {
      0: { 5: true, 8: true, 12: true },
      1: { 5: true, 10: true, 13: true },
      2: { 7: true, 9: true, 10: true },
      3: { 5: true, 7: true, 10: true },
      4: { 7: true, 8: true, 12: true },
      5: { 5: true, 8: true, 12: true }
    };
    // iv = Dm (D, F, A) — purple
    const ivCells = {
      0: { 6: true, 10: true, 13: true },
      1: { 6: true, 10: true },
      2: { 7: true, 10: true },
      3: { 7: true, 8: true, 12: true },
      4: { 5: true, 8: true, 12: true },
      5: { 5: true, 8: true }
    };
    if (iCells[sIdx] && iCells[sIdx][fIdx]) {
      return { show: true, label: '', color: '#00BCD4' };
    }
    if (ivCells[sIdx] && ivCells[sIdx][fIdx]) {
      return { show: true, label: '', color: '#673AB7' };
    }
    if (scaleCell) return { show: true, label: '', color: 'rgba(180,210,255,0.18)' };
    return null;
  }

  // All Scales — A Dorian across the whole neck (notes mode)
  function dotsForAllScales(sIdx, fIdx) {
    // A Dorian = A B C D E F# G — scatter notes across neck
    const noteNames = ['A','B','C','D','E','F#','G'];
    // string open notes high→low: e B G D A E
    const openMidi = { 0: 64, 1: 59, 2: 55, 3: 50, 4: 45, 5: 40 };
    const noteAt = (s, f) => {
      const midi = openMidi[s] + f;
      const pc = midi % 12;
      // 0=C 1=C# 2=D 3=D# 4=E 5=F 6=F# 7=G 8=G# 9=A 10=A# 11=B
      const nameMap = { 0:'C',1:'C#',2:'D',3:'D#',4:'E',5:'F',6:'F#',7:'G',8:'G#',9:'A',10:'A#',11:'B' };
      return nameMap[pc];
    };
    const n = noteAt(sIdx, fIdx);
    if (noteNames.includes(n)) {
      const root = (n === 'A');
      // Overlay sample: F# colored amber (from overlay 1)
      let color = null;
      if (n === 'F#') color = '#FFC107';
      return { show: true, root, label: n, color };
    }
    return null;
  }

  // Partial chord mini — Dm triad on strings G-B-e, frets 3-5
  function dotsForPctMini(chord) {
    // Dm@5fr triad on top 3 strings: D-A-D-F-A-D — show shape on strings 0,1,2
    if (chord.label === 'Dm') {
      return (sIdx, fIdx) => {
        // fIdx 0 = startFret (3). String 0=e, 1=B, 2=G
        if (sIdx === 0 && fIdx === 2) return { show: true, label: '5' };          // 5fr e = D? actually A; label as 5
        if (sIdx === 1 && fIdx === 0) return { show: true, label: 'b3' };         // 3fr B = D... label b3
        if (sIdx === 2 && fIdx === 2) return { show: true, label: '1', root: true };
        return null;
      };
    }
    if (chord.label === 'Am') {
      return (sIdx, fIdx) => {
        if (sIdx === 0 && fIdx === 2) return { show: true, label: '5' };
        if (sIdx === 1 && fIdx === 2) return { show: true, label: '1', root: true };
        if (sIdx === 2 && fIdx === 2) return { show: true, label: 'b3' };
        return null;
      };
    }
    if (chord.label === 'G') {
      return (sIdx, fIdx) => {
        if (sIdx === 0 && fIdx === 0) return { show: true, label: '1', root: true };
        if (sIdx === 1 && fIdx === 0) return { show: true, label: '3' };
        if (sIdx === 2 && fIdx === 1) return { show: true, label: '5' };
        return null;
      };
    }
    if (chord.label === 'C') {
      return (sIdx, fIdx) => {
        if (sIdx === 0 && fIdx === 0) return { show: true, label: '3' };
        if (sIdx === 1 && fIdx === 2) return { show: true, label: '1', root: true };
        if (sIdx === 2 && fIdx === 2) return { show: true, label: '5' };
        return null;
      };
    }
    return () => null;
  }

  function renderAllScalesTab() {

  function renderPartialChordsTab() {
    const dispBtns = [
      { id: 'dots',  label: 'Dots'    },
      { id: 'tones', label: 'Numbers' },
      { id: 'notes', label: 'Notes'   }
    ].map(m =>
      `<button class="positions-display-btn${POS_STATE.pctDisplay === m.id ? ' active' : ''}"
               onclick="setPctDisplay('${m.id}')">${m.label}</button>`
    ).join('');

    const widthBtns = [3,4,5,6].map(w =>
      `<button class="positions-caged-btn${POS_STATE.pctWidth === w ? ' active' : ''}"
               style="width:36px; height:36px; font-size:13px"
               onclick="setPctWidth(${w})">${w}</button>`
    ).join('');

    const pills = POS_STATE.progression.map((c, i) =>
      `<button class="positions-prog-pill${i === POS_STATE.pctActiveIdx ? ' active' : ''}"
               onclick="setPctActiveIdx(${i})">${c.label}</button>`
    ).join('');

    const cards = POS_STATE.progression.map((c, i) => {
      const isActive = i === POS_STATE.pctActiveIdx;
      return `
        <div class="positions-pct-card${isActive ? ' active' : ''}" onclick="setPctActiveIdx(${i})">
          <div class="positions-pct-card-header">
            <span class="positions-pct-card-title">${c.label}</span>
            <span class="positions-pct-card-fret">${POS_STATE.pctFret}fr</span>
          </div>
          ${renderMiniFretboard(dotsForPctMini(c), POS_STATE.pctFret - 2)}
          <div class="positions-pct-card-nav">
            <div class="positions-pct-nav-group">
              <button class="positions-pct-nav-btn" title="CAGED prev">◀</button>
              <span>CAGED</span>
              <button class="positions-pct-nav-btn" title="CAGED next">▶</button>
            </div>
            <div class="positions-pct-nav-group">
              <button class="positions-pct-nav-btn" title="String set prev">◀</button>
              <span>Set</span>
              <button class="positions-pct-nav-btn" title="String set next">▶</button>
            </div>
            <button class="positions-overlay-remove" onclick="event.stopPropagation(); removeFromProgression(${i})">✕</button>
          </div>
        </div>
      `;
    }).join('');

    return `
      <div class="tool-card">
        <h3>Partial Chords — בנה פרוגרשן באקורדים חלקיים</h3>
        <div class="positions-pct-builder">
          <div class="positions-pct-group">
            <span class="ctrl-label">Root</span>
            ${renderRootSelect(POS_STATE.pctRoot, "setPctRoot(event.target.value)")}
          </div>
          <div class="positions-pct-group">
            <span class="ctrl-label">Quality</span>
            <div class="positions-seg">
              <button class="positions-seg-btn${POS_STATE.pctQuality === 'major' ? ' active' : ''}"
                      onclick="setPctQuality('major')">Maj</button>
              <button class="positions-seg-btn${POS_STATE.pctQuality === 'minor' ? ' active' : ''}"
                      onclick="setPctQuality('minor')">Min</button>
              <button class="positions-seg-btn" onclick="openQualityPicker()" title="Choose extended quality">More…</button>
            </div>
          </div>

          <button class="positions-pct-add" onclick="addPctChord()">+ Add</button>
          <button class="positions-action-btn" onclick="clearProgression()">Clear</button>

          <div class="positions-pct-group">
            <span class="ctrl-label">Position — <span class="positions-pct-fret-val">${POS_STATE.pctFret}fr</span></span>

                   class="positions-pct-slider"
                   oninput="setPctFret(Number(this.value))" />

            <span class="ctrl-label">Strings</span>
            <div class="positions-caged-row">${widthBtns}</div>

            <span class="ctrl-label">Show</span>
            <div class="positions-display-bar">${dispBtns}</div>

      ${POS_STATE.progression.length === 0
        ? `<div class="tool-card" style="text-align:center; padding:40px">
             <p style="color:var(--text-dim); margin:0">
               Pick a root and quality, then press <b style="color:var(--text)">+ Add</b> to start a progression.
             </p>

        : `<div class="tool-card">
             <div class="positions-pct-cards">${cards}</div>

  // ===== MAIN renderer — the single view registered in VIEWS =====
  function renderPositions() {
    const tabs = [
      { id: 'positions',     label: 'Positions'      },
      { id: 'arpeggios',     label: 'Arpeggios'      },
      { id: 'allscales',     label: 'All Scales'     },
      { id: 'partialchords', label: 'Partial Chords' }
    ];
    const tabRow = tabs.map(t =>
      `<button class="pos-tab${POS_STATE.activeTab === t.id ? ' active' : ''}"
               onclick="switchPositionsTab('${t.id}')"
               data-tab="${t.id}">${t.label}</button>`
    ).join('');

    let tabContent = '';
    if (POS_STATE.activeTab === 'positions')          tabContent = renderPositionsTab();
    else if (POS_STATE.activeTab === 'arpeggios')     tabContent = renderArpeggiosTab();
    else if (POS_STATE.activeTab === 'allscales')     tabContent = renderAllScalesTab();
    else if (POS_STATE.activeTab === 'partialchords') tabContent = renderPartialChordsTab();

    const scaleTitleStr = `${POS_STATE.root} ${POS_STATE.type === 'major' ? 'Major' : 'Minor'}`;

    return `
      <div class="tool-stage"><div class="container">

        <div class="positions-pageheader">
