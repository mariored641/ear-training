            <h1>🎸 פוזיציות</h1>
            <span class="scale-title-pill">${scaleTitleStr}</span>
          </div>
          <p>CAGED · ארפג'יואים · כל הסולמות · אקורדים חלקיים</p>
        </div>

        <div class="pos-tabs">${tabRow}</div>

        <div id="positions-tab-content">${tabContent}</div>

      </div></div>
    `;
  }

  // ===== State mutations (rerender on each change) =====
  function rerender() {
    document.getElementById('positions-app-root').innerHTML = renderPositions();
  }

  // Tab switching — exposed to onclick handlers
  function switchPositionsTab(tabId) {
    POS_STATE.activeTab = tabId;
    // When leaving arpeggios, the React component clears active arpeggios
    if (tabId !== 'arpeggios') POS_STATE.activeArpeggios = [];
    rerender();
  }

  // Positions tab
  function setRoot(v)       { POS_STATE.root = v; rerender(); }
  function setType(v)       { POS_STATE.type = v; rerender(); }
  function togglePosition(p) {
    const idx = POS_STATE.positions.indexOf(p);
    if (idx >= 0) POS_STATE.positions.splice(idx, 1);
    else          POS_STATE.positions.push(p);
    rerender();
  }
  function setShowAll(v)    { POS_STATE.showAll = v; rerender(); }
  function setDisplayMode(m){ POS_STATE.displayMode = m; rerender(); }
  function setPentatonic(v) { POS_STATE.showPentatonic = v; rerender(); }
  function toggleQuickRef() { console.log('[mockup] open QuickReferencePopup'); }

  // Arpeggios tab
  function toggleArpeggio(id) {
    const idx = POS_STATE.activeArpeggios.indexOf(id);
    if (idx >= 0) POS_STATE.activeArpeggios.splice(idx, 1);
    else {
      if (POS_STATE.activeArpeggios.length >= 3) POS_STATE.activeArpeggios.shift();
      POS_STATE.activeArpeggios.push(id);
    }
    rerender();
  }
  function toggleHideRoots() { POS_STATE.hideRoots = !POS_STATE.hideRoots; rerender(); }
  function clearArpeggios()  { POS_STATE.activeArpeggios = []; rerender(); }

  // All Scales tab
  function setAllScalesRoot(v)    { POS_STATE.allScalesRoot = v; rerender(); }
  function setAllScalesId(v)      { POS_STATE.allScalesId = v; rerender(); }
  function setAllScalesDisplay(m) { POS_STATE.allScalesDisplay = m; rerender(); }
  function addOverlay() {
    const palette = ['#FFC107', '#E91E8C', '#00BCD4', '#76FF03'];
    const c = palette[POS_STATE.overlays.length % palette.length];
    POS_STATE.overlays.push({ id: Date.now(), color: c, root: 'A', chord: 'maj7' });
    rerender();
  }
  function removeOverlay(id) {
    POS_STATE.overlays = POS_STATE.overlays.filter(o => o.id !== id);
    rerender();
  }
  function allScalesClearNotes()  { console.log('[mockup] clear notes'); }
  function allScalesClearRange()  { console.log('[mockup] clear fret range'); }
  function allScalesClearColors() { console.log('[mockup] clear highlight colors'); }

  // Partial Chords tab
  function setPctRoot(v)    { POS_STATE.pctRoot = v; rerender(); }
  function setPctQuality(v) { POS_STATE.pctQuality = v; rerender(); }
  function setPctDisplay(m) { POS_STATE.pctDisplay = m; rerender(); }
  function setPctWidth(w)   { POS_STATE.pctWidth = w; rerender(); }
  function setPctFret(f)    { POS_STATE.pctFret = f; rerender(); }
  function setPctActiveIdx(i) { POS_STATE.pctActiveIdx = i; rerender(); }
  function addPctChord() {
    const lbl = POS_STATE.pctRoot + (POS_STATE.pctQuality === 'minor' ? 'm' : '');
    POS_STATE.progression.push({ root: POS_STATE.pctRoot, quality: POS_STATE.pctQuality, label: lbl });
    POS_STATE.pctActiveIdx = POS_STATE.progression.length - 1;
    rerender();
  }
  function clearProgression() {
    POS_STATE.progression = [];
    POS_STATE.pctActiveIdx = 0;
    rerender();
  }
  function removeFromProgression(idx) {
    POS_STATE.progression.splice(idx, 1);
    if (POS_STATE.pctActiveIdx >= POS_STATE.progression.length) {
      POS_STATE.pctActiveIdx = Math.max(0, POS_STATE.progression.length - 1);
    }
    rerender();
  }
  function openQualityPicker() { console.log('[mockup] open QualityPickerModal'); }

  // ===== Standalone preview =====
  function renderStandalonePreview() {
    document.getElementById('app').innerHTML = `
      <section class="preview-section">
        <div class="preview-marker">VIEW 1 / 1  ·  positions (4 tabs in-page)</div>
        <div id="positions-app-root"></div>
      </section>
    `;
    rerender();
  }

  // ===== Stubs (master assembler will override) =====
  function navigate(id) { console.log('[mockup] navigate →', id); }
  function goBack()     { history.back(); }

  

</script>

  // ===== Chord progression editor =====
  function renderChordEditor() {
    // chord 1 = "Cm7" + 7 more whole bars, then a split bar (D7 + Gm), then 3 more bars
    let html = '';
    let visualBar = 1;
    let i = 0;
    while (i < MOCK_CHORDS.length) {
      const c = MOCK_CHORDS[i];
      const isActive = c.name === 'Bb△7' && visualBar === 3;
      if (c.beats === 4) {
        html += `
          <div class="chord-bar${isActive ? ' active' : ''}" onclick="selectBar(${visualBar})">
            <span class="bar-num">${visualBar}</span>
            ${c.name}
            <span class="beats">4 beats</span>
          </div>`;
        i++;
      } else {
        // Two consecutive 2-beat chords form one split bar
        const c2 = MOCK_CHORDS[i + 1];
        html += `
          <div class="chord-bar split">
            <span class="bar-num">${visualBar}</span>
            <div class="split-row">
              <button class="split-half" onclick="selectBar(${visualBar}, 0)">${c.name}</button>
              <button class="split-half" onclick="selectBar(${visualBar}, 1)">${c2.name}</button>
            </div>
            <span class="beats">2 + 2 beats</span>
          </div>`;
        i += 2;
      }
      visualBar++;
    }
    // + Add bar tile
    html += `
      <div class="chord-bar add-bar" onclick="alert('Add bar (mock) — MAX_BARS = 64')" title="הוסף תיבה">
        +
      </div>`;

    return `

        <div class="backing-chord-editor-header">

  // ===== Live Fretboard (always shown — mocked as open) =====
  function renderFretboard() {

    const rows = stringNames.map((sn, sIdx) => {
      const cells = Array.from({length: 14}, (_, fIdx) => {
        // mock: scatter dots so it reads as a real Bb△7 / C major scale
        const hasDot = ((sIdx + fIdx) % 3 === 0) && fIdx > 0;
        const isRoot = hasDot && (fIdx === 5 || fIdx === 10);
        // Arpeggio overlay (cyan) — chord tones of Bb△7 = Bb, D, F, A
        const isArp = hasDot && (fIdx === 3 || fIdx === 7 || fIdx === 11);
        if (hasDot) {
          const cls = isRoot ? 'root' : (isArp ? 'arp' : '');
          return `<div class="fb-cell ${fIdx===0?'nut':''}"><div class="fb-dot ${cls}">${isRoot?'R':''}</div></div>`;
        }
        return `<div class="fb-cell ${fIdx===0?'nut':''}"></div>`;
      }).join('');
      return `<div class="fb-string">${sn}</div>${cells}`;
    }).join('');

          </div>
        </div>

          <div class="fb-grid">
            <div></div>${fretNums}
            ${rows}
          </div>
        </div>

        <div class="backing-fretboard-legend">
          <span class="backing-legend-item">
            <span class="backing-legend-dot scale"></span> תווי סולם
          </span>
          <span class="backing-legend-item">
            <span class="backing-legend-dot arp"></span> ארפג'יו של האקורד הנוכחי

          </span>
        </div>

        <!-- Polyscale per-bar override strip -->
        <div class="backing-polyscale-strip">
          <div class="strip-title">
            <span>⚡</span>
            <span>Polyscale Override · סולם נפרד לכל אקורד</span>
          </div>

              <div class="cell-chord">Cm7</div>
              <div class="cell-scale">Dorian</div>
            </div>
            <div class="backing-polyscale-cell">

              <div class="cell-scale">Mixolydian</div>
            </div>
            <div class="backing-polyscale-cell current">

        <!-- Back button (hidden while recording — shown here muted for completeness) -->
        <button class="feedback-rec-back" style="opacity:0.4" disabled>← חזרה (אחרי עצירה)</button>

  // ===== Screen 3: Preview =====
  function renderFeedbackPrev() {
    return `

        <div class="feedback-preview-video">

            <div class="pb-track"></div>

      <div class="control-row" style="margin-top: 4px">

  // ===== Screen switching (canonical helper expected by the assembler) =====
  function feedbackScreen(which) {
    ['prep', 'rec', 'prev'].forEach(s => {
      const el = document.getElementById('feedback-' + s);
      if (el) el.style.display = (s === which) ? 'flex' : 'none';
    });
    const btns = document.querySelectorAll('#feedback-tabs button');
    const order = ['prep', 'rec', 'prev'];
    btns.forEach((b, i) => b.classList.toggle('active', order[i] === which));
  }

  // ===== Standalone preview: stack 3 instances, one per initial screen =====
  function renderStandalonePreview() {
    document.getElementById('app').innerHTML = `
      <section class="preview-section" id="sec-prep">
        <div class="preview-marker">VIEW 1 / 3  ·  feedback — prep</div>
        ${renderFeedback('prep')}
      </section>
      <section class="preview-section" id="sec-rec">
        <div class="preview-marker">VIEW 2 / 3  ·  feedback — recording (live)</div>
        ${renderFeedbackStandalone('rec')}
      </section>
      <section class="preview-section" id="sec-prev">
        <div class="preview-marker">VIEW 3 / 3  ·  feedback — preview</div>
        ${renderFeedbackStandalone('prev')}
      </section>
    `;
  }

  /* The single-view renderer above keys all 3 screens off the same element
     ids ("feedback-prep", "feedback-rec", "feedback-prev"). For the
     STANDALONE preview we want each section to show its own screen
     without sharing ids — so we render a duplicate with unique scoped ids. */
  function renderFeedbackStandalone(which) {
    let inner;
    if (which === 'prep') inner = renderFeedbackPrep();
    else if (which === 'rec') inner = renderFeedbackRec();
    else inner = renderFeedbackPrev();
    return `
      <div class="tool-stage"><div class="container">
        <div class="tool-title">
          <h1>📹 פידבק</h1>
          <p>הקלט את עצמך מנגן על באקינג טראק מ-YouTube ושלח למישר</p>
        </div>
        <div class="screen-tabs">
          <button class="${which==='prep'?'active':''}">1. הכנה</button>
          <button class="${which==='rec' ?'active':''}">2. הקלטה</button>
          <button class="${which==='prev'?'active':''}">3. תצוגה מקדימה</button>
        </div>
        <div class="feedback-screen" style="display:flex; flex-direction:column; gap:18px">
          ${inner}
        </div>
      </div></div>
    `;
  }

  // ===== Stubs (master assembler will override) =====
  function navigate(id) {
    const map = { 'feedback': 0 };
    const idx = map[id];
    if (idx != null) {
      document.querySelectorAll('.preview-section')[idx]
        ?.scrollIntoView({ behavior: 'smooth' });
    }
  }
  function goBack() { history.back(); }

  

</script>

<!-- ============ MASTER DISPATCH ============ -->
<script>
  function renderRadial(def) {
    const n = def.satellites.length;
    const center = def.centerLogo
      ? `<div class="center-logo"><img src="${def.centerLogo}" alt="logo"/></div>`
      : `<div class="center-info">
           <div class="emoji">${def.centerEmoji || '🎵'}</div>
           <h2>${def.title}</h2>
           <p>${def.sub || ''}</p>
         </div>`;
    const sats = def.satellites.map((s, i) => {
      const angle = (i * 360 / n).toFixed(2);
      const slot = (i % 7) + 1;
      const subLabel = s.sub ? `<div class="sub-label">${s.sub}</div>` : '';
      return `
        <div class="satellite s-${slot}" style="--angle:${angle}deg" data-angle="${angle}">
          <div class="label">${s.label}</div>
          <div class="orb" onclick="navigate('${s.goto}')">${s.icon}</div>
          ${subLabel}
        </div>`;
    }).join('');
    return `
      <div class="stage">
        <div class="constellation" id="cur-const">
          <svg class="lines" id="cur-lines"></svg>
          <div class="center-hub">${center}</div>
          ${sats}
        </div>
      </div>`;
  }

  function drawLines() {
    const container = document.getElementById('cur-const');
    const svg = document.getElementById('cur-lines');
    if (!container || !svg) return;
    const w = container.clientWidth, h = container.clientHeight;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.innerHTML = '';
    const cRect = container.getBoundingClientRect();
    const cx = w/2, cy = h/2;
    container.querySelectorAll('.satellite .orb').forEach(orb => {
      const r = orb.getBoundingClientRect();
      const x = r.left + r.width/2 - cRect.left;
      const y = r.top + r.height/2 - cRect.top;
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', cx); line.setAttribute('y1', cy);
      line.setAttribute('x2', x);  line.setAttribute('y2', y);
      svg.appendChild(line);
    });
  }

  function render(id) {
    const def = window.VIEWS[id] || window.VIEWS.home;
    const app = document.getElementById('app');
    const back = document.getElementById('back-btn');
    const crumb = document.getElementById('crumb');

    back.style.display = id === 'home' ? 'none' : 'block';

    // breadcrumb path
    let path = [], cur = id;
    while (cur && window.VIEWS[cur]) {
      path.unshift(window.VIEWS[cur].breadcrumb || cur);
      cur = window.VIEWS[cur].parent;
    }
    if (id !== 'home') path.unshift('🏠');
    crumb.innerHTML = path.join('<span>›</span>');

    // close any open drawers
    document.querySelectorAll('.levels-drawer.open, .levels-overlay.open').forEach(el => el.classList.remove('open'));

    if (def.type === 'radial') {
      app.innerHTML = renderRadial(def);
      requestAnimationFrame(drawLines);
    } else if (def.type === 'exercise-custom' || def.type === 'tool-custom') {
      const fn = window[def.renderer];
      if (typeof fn === 'function') {
        app.innerHTML = fn();
      } else {
        app.innerHTML = '<div style="text-align:center;padding:80px;color:var(--text-dim)">⚠️ renderer not found: ' + def.renderer + '</div>';
      }
    } else if (def.type === 'exercise') {
      // legacy generic exercise template (from v1)
      app.innerHTML = '<div style="text-align:center;padding:80px;color:var(--text-dim)">[generic exercise: ' + (def.title || id) + ']</div>';
    } else if (def.type === 'tool') {
      app.innerHTML = '<div style="text-align:center;padding:80px;color:var(--text-dim)">[legacy tool: ' + (def.tool || id) + ']</div>';
    } else {
      app.innerHTML = '<div style="text-align:center;padding:80px;color:var(--text-dim)">⚠️ unknown view type: ' + def.type + '</div>';
    }
  }

  function navigate(id) {
    history.pushState(null, '', '#' + id);
    render(id);
  }
  function goBack() {
    if (history.length > 1) history.back();
    else navigate('home');
  }

  // Master drawer toggle — works for all sections (levels-drawer-X / levels-overlay-X)
  function toggleDrawer(idOrSuffix) {
    // try both forms: full id, or suffix to be combined with levels-drawer- prefix
    let drawer = document.getElementById(idOrSuffix);
    let overlay = null;
    if (!drawer) {
      drawer = document.getElementById('levels-drawer-' + idOrSuffix);
      overlay = document.getElementById('levels-overlay-' + idOrSuffix);
    }
    if (drawer) drawer.classList.toggle('open');
    if (overlay) overlay.classList.toggle('open');
    else {
      // try sibling overlay
      const sib = drawer && drawer.previousElementSibling;
      if (sib && sib.classList.contains('levels-overlay')) sib.classList.toggle('open');
    }
  }

  function selectLevel(exId, n) {
    // mock — closes drawer
    toggleDrawer(exId);
  }

  // Master tab/screen switchers
  function feedbackScreen(which) {
    ['prep','rec','prev'].forEach(s => {
      const el = document.getElementById('feedback-' + s);
      if (el) el.style.display = (s === which) ? 'block' : 'none';
    });
    // also try fb- prefix (v1 naming)
    ['prep','rec','prev'].forEach(s => {
      const el = document.getElementById('fb-' + s);
      if (el) el.style.display = (s === which) ? 'block' : 'none';
    });
    document.querySelectorAll('.screen-tabs button').forEach((b, i) => {
      b.classList.toggle('active', ['prep','rec','prev'][i] === which);
    });
  }

  window.addEventListener('popstate', () => {
    render(location.hash.slice(1) || 'home');
  });
  window.addEventListener('resize', drawLines);

  // initial render
  render(location.hash.slice(1) || 'home');
</script>
