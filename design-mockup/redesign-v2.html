<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ear Training App — Redesign v2 (Full Mockup)</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style id="canon-base">

  :root {
    --bg-deep:    #050d2a;
    --bg-mid:     #0a1f5c;
    --bg-light:   #2a5aff;
    --accent:     #6ea8ff;
    --accent-2:   #b8d4ff;
    --text:       #eaf2ff;
    --text-dim:   #9fb4d6;
    --orb-bg:     rgba(255, 255, 255, 0.06);
    --orb-border: rgba(180, 210, 255, 0.25);
    --orb-glow:   rgba(110, 168, 255, 0.35);
    --glass-bg:   rgba(255, 255, 255, 0.06);
    --glass-border: rgba(180, 210, 255, 0.22);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--text);
  }

  /* ===== Aurora background ===== */
  body {
    position: relative;
    background: radial-gradient(ellipse at 50% 60%, #0d2a7a 0%, #050d2a 70%);
  }
  .aurora {
    position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none;
  }
  .blob {
    position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.55; will-change: transform;
  }
  .blob-1 {
    width: 50vmax; height: 50vmax;
    background: radial-gradient(circle, #2a5aff 0%, transparent 70%);
    top: -10%; left: -10%; animation: drift1 22s ease-in-out infinite alternate;
  }
  .blob-2 {
    width: 45vmax; height: 45vmax;
    background: radial-gradient(circle, #4b8bff 0%, transparent 70%);
    bottom: -15%; right: -10%; animation: drift2 28s ease-in-out infinite alternate;
  }
  .blob-3 {
    width: 35vmax; height: 35vmax;
    background: radial-gradient(circle, #6ea8ff 0%, transparent 70%);
    top: 30%; right: 20%; opacity: 0.35; animation: drift3 18s ease-in-out infinite alternate;
  }
  @keyframes drift1 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(20vw,10vh) scale(1.15)} 100%{transform:translate(10vw,25vh) scale(0.95)} }
  @keyframes drift2 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(-15vw,-10vh) scale(1.1)} 100%{transform:translate(-25vw,5vh) scale(0.9)} }
  @keyframes drift3 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(-20vw,15vh) scale(1.2)} 100%{transform:translate(15vw,-10vh) scale(0.85)} }

  .stars {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 12% 28%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 78% 64%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 35% 75%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 88% 18%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 55% 42%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.5px 1.5px at 22% 88%, rgba(255,255,255,0.5), transparent);
  }

  /* ===== Top bar (mockup label + breadcrumb) ===== */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 90;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    font-size: 12px;
  }
  .top-bar .label { opacity: 0.7; letter-spacing: 0.3px; }
  .top-bar .crumb { color: var(--accent-2); font-weight: 500; }
  .top-bar .crumb span { opacity: 0.5; margin: 0 6px; }

  /* ===== Back pill ===== */
  .back-pill {
    position: fixed; top: 50px; right: 18px; z-index: 80;
    background: rgba(255,255,255,0.08);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 8px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    font-family: inherit; backdrop-filter: blur(10px);
    transition: background 0.2s ease;
  }
  .back-pill:hover { background: rgba(255,255,255,0.16); }

  /* ===== Stage / Constellation (radial views) ===== */
  .stage {
    position: relative; z-index: 1;
    height: 100vh; width: 100vw;
    display: flex; align-items: center; justify-content: center;
  }
  .constellation {
    position: relative;
    width: min(90vmin, 760px);
    height: min(90vmin, 760px);
  }

  /* ===== Center hub ===== */
  .center-hub {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 30%; aspect-ratio: 1 / 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 30%, rgba(255,255,255,0.18), rgba(255,255,255,0.02) 70%),
      linear-gradient(135deg, rgba(110, 168, 255, 0.18), rgba(42, 90, 255, 0.1));
    backdrop-filter: blur(12px);
    border: 1.5px solid rgba(180, 210, 255, 0.3);
    box-shadow:
      0 0 60px rgba(110, 168, 255, 0.45),
      inset 0 0 40px rgba(255, 255, 255, 0.05);
    overflow: hidden;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    z-index: 5;
    animation: hubPulse 5s ease-in-out infinite alternate;
  }
  @keyframes hubPulse {
    from { box-shadow: 0 0 60px rgba(110, 168, 255, 0.35), inset 0 0 40px rgba(255,255,255,0.05); }
    to   { box-shadow: 0 0 90px rgba(110, 168, 255, 0.6),  inset 0 0 50px rgba(255,255,255,0.08); }
  }

  /* logo disc (for home only) */
  .center-hub .center-logo {
    display: flex; align-items: center; justify-content: center;
    width: 84%; aspect-ratio: 1 / 1; height: auto;
    border-radius: 50%;
    background: #ffffff;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.4), 0 8px 24px rgba(0,0,0,0.25);
  }
  .center-hub .center-logo img { display: block; object-fit: contain; width: 92%; height: 92%; }

  /* emoji + title (for sub-hubs) */
  .center-hub .center-info {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 6%;
  }
  .center-hub .center-info .emoji {
    font-size: clamp(28px, 5vmin, 48px);
    margin-bottom: 4px;
    filter: drop-shadow(0 0 12px rgba(110,168,255,0.7));
  }
  .center-hub .center-info h2 {
    margin: 0 0 4px 0;
    font-size: clamp(13px, 2vmin, 20px);
    font-weight: 700; line-height: 1.15;
  }
  .center-hub .center-info p {
    margin: 0;
    font-size: clamp(9px, 1.3vmin, 12px);
    color: var(--text-dim); line-height: 1.3;
  }

  /* ===== Satellites ===== */
  .satellite {
    position: absolute; top: 50%; left: 50%;
    --angle: 0deg; --radius: 34vmin;
    transform:
      translate(-50%, -50%)
      rotate(var(--angle))
      translateY(calc(var(--radius) * -1))
      rotate(calc(var(--angle) * -1));
    width: 22vmin; height: 22vmin;
    pointer-events: none;
    animation: floatY 6s ease-in-out infinite alternate;
  }
  .satellite.s-2 { animation-delay: -1s; }
  .satellite.s-3 { animation-delay: -2s; }
  .satellite.s-4 { animation-delay: -3s; }
  .satellite.s-5 { animation-delay: -4s; }
  .satellite.s-6 { animation-delay: -5s; }
  .satellite.s-7 { animation-delay: -1.5s; }
  @keyframes floatY {
    from { transform: translate(-50%,-50%) rotate(var(--angle)) translateY(calc(var(--radius)*-1)) rotate(calc(var(--angle)*-1)); }
    to   { transform: translate(-50%,-50%) rotate(var(--angle)) translateY(calc((var(--radius)*-1) - 6px)) rotate(calc(var(--angle)*-1)); }
  }

  .satellite .label {
    position: absolute; left: 50%; bottom: calc(78% + 10px);
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: clamp(11px, 1.7vmin, 15px); font-weight: 600;
    color: var(--text);
    text-shadow: 0 0 14px rgba(0,0,0,0.85), 0 2px 8px rgba(0,0,0,0.6);
    pointer-events: none;
    animation: labelFloat 4s ease-in-out infinite alternate;
  }
  @keyframes labelFloat {
    from { transform: translateX(-50%) translateY(0); }
    to   { transform: translateX(-50%) translateY(-4px); }
  }
  .satellite.s-2 .label { animation-delay: -0.6s; }
  .satellite.s-3 .label { animation-delay: -1.2s; }
  .satellite.s-4 .label { animation-delay: -1.8s; }
  .satellite.s-5 .label { animation-delay: -2.4s; }
  .satellite.s-6 .label { animation-delay: -3.0s; }
  .satellite.s-7 .label { animation-delay: -3.6s; }

  .satellite .sub-label {
    position: absolute; left: 50%; top: calc(78% - 4px);
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: clamp(9px, 1.3vmin, 11px); font-weight: 500;
    color: var(--accent-2); opacity: 0.85;
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
    pointer-events: none;
  }

  .satellite .orb {
    position: absolute; bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 78%; aspect-ratio: 1 / 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,0.22), rgba(255,255,255,0.02) 65%),
      var(--orb-bg);
    backdrop-filter: blur(8px);
    border: 1.5px solid var(--orb-border);
    box-shadow: 0 0 30px var(--orb-glow), inset 0 0 20px rgba(255,255,255,0.04);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(28px, 5.5vmin, 52px);
    cursor: pointer; pointer-events: auto;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .satellite .orb:hover {
    transform: translateX(-50%) scale(1.12);
    box-shadow: 0 0 50px rgba(180, 210, 255, 0.7), inset 0 0 30px rgba(255,255,255,0.1);
    border-color: rgba(220, 235, 255, 0.7);
  }

  /* Glow color per satellite slot */
  .satellite.s-1 .orb { box-shadow: 0 0 30px rgba(255, 180, 100, 0.45), inset 0 0 20px rgba(255,255,255,0.04); }
  .satellite.s-2 .orb { box-shadow: 0 0 30px rgba(255, 120, 180, 0.4),  inset 0 0 20px rgba(255,255,255,0.04); }
  .satellite.s-3 .orb { box-shadow: 0 0 30px rgba(150, 220, 255, 0.45), inset 0 0 20px rgba(255,255,255,0.04); }
  .satellite.s-4 .orb { box-shadow: 0 0 30px rgba(120, 255, 180, 0.4),  inset 0 0 20px rgba(255,255,255,0.04); }
  .satellite.s-5 .orb { box-shadow: 0 0 30px rgba(200, 180, 255, 0.45), inset 0 0 20px rgba(255,255,255,0.04); }
  .satellite.s-6 .orb { box-shadow: 0 0 30px rgba(255, 220, 120, 0.45), inset 0 0 20px rgba(255,255,255,0.04); }
  .satellite.s-7 .orb { box-shadow: 0 0 30px rgba(180, 255, 220, 0.45), inset 0 0 20px rgba(255,255,255,0.04); }

  .lines { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .lines line { stroke: rgba(180, 210, 255, 0.12); stroke-width: 1; stroke-dasharray: 3 5; }

  /* ===== Exercise template ===== */
  .exercise-stage {
    position: relative; z-index: 1;
    height: 100vh; width: 100vw;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 60px 20px 20px;
    gap: 22px;
  }
  .ex-header {
    text-align: center;
    display: flex; flex-direction: column; gap: 6px;
    align-items: center;
  }
  .ex-code {
    font-size: 12px; letter-spacing: 1.5px; font-weight: 600;
    color: var(--accent); opacity: 0.85; text-transform: uppercase;
  }
  .ex-title {
    margin: 0; font-size: clamp(22px, 3.5vmin, 32px); font-weight: 700;
  }
  .ex-progress {
    font-size: 13px; color: var(--text-dim); margin-top: 4px;
  }

  .ex-prompt {
    margin: 0; font-size: clamp(15px, 2vmin, 18px);
    color: var(--text-dim); max-width: 700px; text-align: center;
    line-height: 1.5;
  }

  .play-pad {
    width: clamp(110px, 18vmin, 180px); height: clamp(110px, 18vmin, 180px);
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,0.25), rgba(255,255,255,0.05) 70%),
      linear-gradient(135deg, rgba(110, 168, 255, 0.4), rgba(42, 90, 255, 0.25));
    backdrop-filter: blur(12px);
    border: 1.5px solid rgba(180, 210, 255, 0.45);
    color: #fff;
    box-shadow: 0 0 60px rgba(110, 168, 255, 0.5), inset 0 0 30px rgba(255,255,255,0.08);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(42px, 7vmin, 72px);
    font-family: inherit;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    animation: hubPulse 5s ease-in-out infinite alternate;
  }
  .play-pad:hover {
    transform: scale(1.06);
    box-shadow: 0 0 80px rgba(180, 210, 255, 0.7), inset 0 0 40px rgba(255,255,255,0.15);
  }

  .ex-answers {
    display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center; align-items: center;
    max-width: 800px;
  }
  .ans-chip {
    background: var(--glass-bg);
    border: 1.5px solid var(--glass-border);
    backdrop-filter: blur(8px);
    color: var(--text);
    padding: 10px 22px;
    border-radius: 999px;
    font-size: clamp(13px, 1.7vmin, 16px);
    font-weight: 600;
    cursor: pointer; font-family: inherit;
    transition: all 0.2s ease;
    min-width: 60px;
  }
  .ans-chip:hover {
    background: rgba(110, 168, 255, 0.2);
    border-color: rgba(180, 210, 255, 0.5);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(110, 168, 255, 0.3);
  }

  .ex-footer {
    position: absolute; bottom: 24px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 16px;
    align-items: center;
  }
  .hint-btn, .skip-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-dim);
    padding: 8px 16px; border-radius: 999px;
    font-size: 12px; font-family: inherit;
    cursor: pointer;
  }
  .hint-btn:hover { color: var(--text); }

  .toggles-row {
    display: flex; gap: 8px; margin-top: 4px;
  }
  .pill-toggle {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-dim);
    padding: 5px 12px; border-radius: 999px;
    font-size: 11px; font-family: inherit;
    cursor: pointer;
  }
  .pill-toggle.active { background: rgba(110, 168, 255, 0.25); border-color: var(--accent); color: var(--text); }

  /* ===== Tool screens ===== */
  .tool-stage {
    position: relative; z-index: 1;
    height: 100vh; width: 100vw;
    overflow: auto;
    padding: 60px 24px 24px;
    color: var(--text);
  }
  .tool-stage .container {
    max-width: 1100px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 18px;
  }
  .tool-title {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    text-align: center;
  }
  .tool-title h1 {
    margin: 0; font-size: clamp(24px, 3.6vmin, 32px); font-weight: 700;
  }
  .tool-title p { margin: 0; color: var(--text-dim); font-size: 14px; }

  .tool-card {
    background: var(--glass-bg);
    border: 1.5px solid var(--glass-border);
    backdrop-filter: blur(10px);
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
  }
  .tool-card h3 {
    margin: 0 0 12px 0; font-size: 14px;
    color: var(--text-dim); letter-spacing: 0.5px;
    text-transform: uppercase; font-weight: 600;
  }

  /* Backing tracks specifics */
  .chord-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  .chord-bar {
    background: rgba(110, 168, 255, 0.08);
    border: 1.5px solid rgba(110, 168, 255, 0.25);
    border-radius: 12px;
    padding: 18px 8px; text-align: center;
    font-size: 22px; font-weight: 700;
    transition: all 0.2s ease;
    cursor: pointer;
  }
  .chord-bar.active {
    background: rgba(110, 168, 255, 0.3);
    border-color: var(--accent);
    box-shadow: 0 0 22px rgba(110, 168, 255, 0.55);
  }
  .chord-bar .beats { display: block; font-size: 10px; color: var(--text-dim); margin-top: 4px; font-weight: 400; }

  .transport {
    display: flex; gap: 10px; align-items: center; justify-content: center;
  }
  .transport button {
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1.5px solid var(--glass-border);
    color: var(--text); font-size: 22px;
    cursor: pointer; font-family: inherit;
    transition: all 0.2s;
  }
  .transport button.play {
    width: 64px; height: 64px; font-size: 26px;
    background: var(--bg-light); border-color: var(--accent);
    box-shadow: 0 0 30px rgba(110, 168, 255, 0.5);
  }
  .transport button:hover { transform: scale(1.06); }

  .control-row {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .select-pill {
    background: rgba(255,255,255,0.06);
    border: 1.5px solid var(--glass-border);
    color: var(--text);
    padding: 6px 14px; border-radius: 999px;
    font-size: 13px; font-family: inherit;
    cursor: pointer;
  }
  .select-pill .v { color: var(--accent); font-weight: 600; margin-inline-start: 6px; }

  /* Fretboard mock */
  .fretboard {
    background: linear-gradient(180deg, #20242c, #14171c);
    border: 1.5px solid rgba(180,210,255,0.18);
    border-radius: 14px;
    padding: 16px 14px;
    position: relative;
    overflow-x: auto;
  }
  .fb-grid {
    display: grid; gap: 4px;
    grid-template-columns: 30px repeat(14, 1fr);
  }
  .fb-cell {
    height: 28px; position: relative;
    border-right: 1px solid rgba(255,255,255,0.08);
  }
  .fb-cell.nut { border-right: 3px solid rgba(255,255,255,0.6); }
  .fb-cell.fret-num {
    background: transparent; border: none;
    color: var(--text-dim); font-size: 11px;
    display: flex; align-items: center; justify-content: center;
    height: 20px;
  }
  .fb-string { color: var(--text-dim); font-size: 11px; }
  .fb-dot {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 18px; height: 18px; border-radius: 50%;
    background: rgba(180, 210, 255, 0.35);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; color: #fff;
  }
  .fb-dot.root { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .fb-dot.arp { background: rgba(120, 220, 255, 0.7); }

  /* Position tabs */
  .pos-tabs { display: flex; gap: 6px; }
  .pos-tab {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--glass-border);
    color: var(--text-dim);
    padding: 8px 14px; border-radius: 10px;
    font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .pos-tab.active {
    background: rgba(110, 168, 255, 0.25);
    border-color: var(--accent);
    color: var(--text); font-weight: 600;
  }

  /* Rhythm Explorer specifics */
  .metronome {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .metro-disc {
    width: 180px; height: 180px; border-radius: 50%;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,0.18), rgba(255,255,255,0.02) 70%),
      linear-gradient(135deg, rgba(110, 168, 255, 0.2), rgba(42, 90, 255, 0.1));
    border: 1.5px solid rgba(180,210,255,0.35);
    box-shadow: 0 0 50px rgba(110,168,255,0.4), inset 0 0 30px rgba(255,255,255,0.05);
    position: relative;
    display: flex; align-items: center; justify-content: center;
    font-size: 38px; font-weight: 700;
  }
  .metro-disc::before {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    border-top: 3px solid var(--accent);
    animation: spinPulse 1s linear infinite;
    opacity: 0.6;
  }
  @keyframes spinPulse { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  /* Feedback (recording) screen */
  .yt-frame {
    aspect-ratio: 16 / 9; background: #000;
    border-radius: 12px; border: 1.5px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.4); font-size: 13px;
    position: relative; overflow: hidden;
  }
  .yt-frame::after {
    content: '▶'; font-size: 60px; color: rgba(255,255,255,0.25);
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .rec-btn {
    width: 80px; height: 80px; border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, #ff7a7a, #c80000);
    border: 3px solid rgba(255,255,255,0.9);
    box-shadow: 0 0 35px rgba(255, 80, 80, 0.6);
    cursor: pointer;
    transition: transform 0.2s ease;
  }
  .rec-btn:hover { transform: scale(1.05); }
  .url-input {
    background: rgba(255,255,255,0.06);
    border: 1.5px solid var(--glass-border);
    color: var(--text);
    padding: 12px 18px; border-radius: 12px;
    font-size: 14px; font-family: inherit;
    width: 100%; max-width: 560px;
  }
  .url-input::placeholder { color: var(--text-dim); }

  .screen-tabs {
    display: flex; gap: 4px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--glass-border);
    padding: 4px; border-radius: 999px;
    width: max-content; margin: 0 auto;
  }
  .screen-tabs button {
    background: transparent; color: var(--text-dim);
    border: none; padding: 6px 16px; border-radius: 999px;
    font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .screen-tabs button.active {
    background: var(--bg-light); color: #fff;
  }

  /* keyboard staff (solfège) */
  .staff-mock {
    background: rgba(255,255,255,0.06);
    border: 1.5px solid var(--glass-border);
    border-radius: 14px;
    height: 140px;
    position: relative;
    overflow: hidden;
    padding: 28px 30px;
  }
  .staff-line {
    height: 2px; background: rgba(180,210,255,0.4);
    margin-bottom: 18px;
  }
  .staff-line:last-child { margin-bottom: 0; }
  .staff-note {
    position: absolute;
    width: 22px; height: 16px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 14px var(--accent);
  }

  /* lock guitar fret (G1) */
  .fret-lock {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px;
    max-width: 480px;
  }
  .fret-lock .string-dot {
    aspect-ratio: 1 / 1; border-radius: 50%;
    background: var(--glass-bg);
    border: 1.5px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; cursor: pointer;
    transition: all 0.2s;
  }
  .fret-lock .string-dot:hover { background: rgba(110,168,255,0.2); border-color: var(--accent); }

  /* misc */
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 720px) { .row-2 { grid-template-columns: 1fr; } }
</style>
<style id="all-sections">
/* ============ melodic ============ */

  /* ---- Global Levels Drawer (shared with every section) ---- */
  .levels-trigger {
    position: fixed; top: 50px; left: 18px; z-index: 80;
    background: rgba(255,255,255,0.08);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 8px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: inherit; backdrop-filter: blur(10px);
    display: inline-flex; align-items: center; gap: 8px;
    transition: background 0.2s ease;
  }
  .levels-trigger:hover { background: rgba(255,255,255,0.16); }
  .levels-trigger .hamburger {
    font-size: 15px; line-height: 1;
    color: var(--accent-2);
  }
  .levels-trigger .current-level {
    color: var(--accent); font-weight: 700;
  }

  .levels-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(5, 13, 42, 0.55);
    backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .levels-overlay.open { opacity: 1; pointer-events: auto; }

  .levels-drawer {
    position: fixed; top: 0; bottom: 0; left: 0;
    width: min(380px, 90vw);
    z-index: 210;
    background:
      linear-gradient(180deg, rgba(13, 42, 122, 0.85), rgba(10, 31, 92, 0.92));
    border-right: 1.5px solid var(--glass-border);
    backdrop-filter: blur(16px);
    box-shadow: 4px 0 40px rgba(0, 0, 0, 0.5),
                inset -1px 0 0 rgba(180, 210, 255, 0.08);
    transform: translateX(-105%);
    transition: transform 0.32s cubic-bezier(0.2, 0.7, 0.2, 1);
    display: flex; flex-direction: column;
    direction: rtl;
  }
  .levels-drawer.open { transform: translateX(0); }

  .levels-drawer-header {
    padding: 18px 20px 14px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(180, 210, 255, 0.12);
  }
  .levels-drawer-title {
    margin: 0;
    font-size: 17px; font-weight: 700;
    color: var(--text);
    display: flex; align-items: center; gap: 10px;
  }
  .levels-drawer-title .ex-tag {
    font-size: 11px; letter-spacing: 1.5px;
    color: var(--accent);
    padding: 3px 8px; border-radius: 6px;
    background: rgba(110, 168, 255, 0.15);
    border: 1px solid rgba(110, 168, 255, 0.3);
  }
  .levels-drawer-close {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-dim);
    width: 32px; height: 32px;
    border-radius: 50%;
    font-size: 16px; cursor: pointer;
    font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease;
  }
  .levels-drawer-close:hover {
    background: rgba(255,255,255,0.14);
    color: var(--text);
  }

  .levels-drawer-list {
    list-style: none;
    margin: 0; padding: 12px;
    overflow-y: auto;
    flex: 1;
    display: flex; flex-direction: column; gap: 6px;
  }
  .levels-drawer-list::-webkit-scrollbar { width: 6px; }
  .levels-drawer-list::-webkit-scrollbar-thumb {
    background: rgba(180, 210, 255, 0.2);
    border-radius: 3px;
  }

  .level-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.03);
    border: 1.5px solid transparent;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .level-item:hover {
    background: rgba(110, 168, 255, 0.1);
    border-color: rgba(180, 210, 255, 0.2);
  }
  .level-item.active {
    background: rgba(110, 168, 255, 0.18);
    border-color: var(--accent);
    box-shadow: 0 0 18px rgba(110, 168, 255, 0.35),
                inset 0 0 14px rgba(110, 168, 255, 0.08);
  }
  .level-item.locked {
    opacity: 0.45; cursor: not-allowed;
  }
  .level-item.locked:hover {
    background: rgba(255,255,255,0.03);
    border-color: transparent;
  }
  .level-item-num {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    border: 1.5px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .level-item.active .level-item-num {
    background: var(--accent);
    border-color: var(--accent-2);
    color: #051030;
    box-shadow: 0 0 12px rgba(110, 168, 255, 0.7);
  }
  .level-item.completed .level-item-num {
    background: rgba(120, 220, 180, 0.25);
    border-color: rgba(120, 220, 180, 0.6);
    color: #e0fff0;
  }
  .level-item-label {
    flex: 1;
    font-size: 13px; font-weight: 500;
    color: var(--text);
  }
  .level-item.active .level-item-label { color: var(--accent-2); font-weight: 600; }
  .level-item-icon {
    font-size: 13px;
    color: var(--text-dim);
  }
  .level-item.completed .level-item-icon { color: rgba(120, 220, 180, 0.9); }
  .level-item.locked .level-item-icon { color: var(--text-dim); }

  /* ---- M1 — Degree Clock visualization ---- */
  /* A circular dial showing the diatonic degrees as positions on a clock.
     The "active" position (the answer being shown / clicked) glows.
     Justification: no canon class fits a circular degree picker — this
     gives M1 a memorable, distinctive visual on top of the chip list. */
  .melodic-degree-clock {
    position: relative;
    width: clamp(220px, 32vmin, 320px);
    height: clamp(220px, 32vmin, 320px);
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, rgba(110, 168, 255, 0.08), transparent 70%);
    border: 1.5px dashed rgba(180, 210, 255, 0.2);
  }
  .melodic-degree-clock-center {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 44%; aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid var(--glass-border);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; gap: 2px;
    backdrop-filter: blur(8px);
  }
  .melodic-degree-clock-center .tonic-label {
    font-size: 10px; letter-spacing: 1.2px;
    color: var(--text-dim); text-transform: uppercase;
  }
  .melodic-degree-clock-center .tonic-name {
    font-size: clamp(20px, 3.2vmin, 28px);
    font-weight: 800; color: var(--accent-2);
  }
  .melodic-degree-clock-center .scale-name {
    font-size: 11px; color: var(--text-dim); margin-top: 2px;
  }
  .melodic-degree-mark {
    position: absolute; top: 50%; left: 50%;
    --angle: 0deg; --radius: 42%;
    transform:
      translate(-50%, -50%)
      rotate(var(--angle))
      translateY(calc(var(--radius) * -1))
      rotate(calc(var(--angle) * -1));
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    border: 1.5px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .melodic-degree-mark:hover {
    background: rgba(110, 168, 255, 0.15);
    border-color: var(--accent);
    transform:
      translate(-50%, -50%)
      rotate(var(--angle))
      translateY(calc(var(--radius) * -1))
      rotate(calc(var(--angle) * -1))
      scale(1.12);
  }
  .melodic-degree-mark.active {
    background: rgba(110, 168, 255, 0.4);
    border-color: var(--accent-2);
    color: #fff;
    box-shadow: 0 0 22px rgba(110, 168, 255, 0.7);
  }
  .melodic-degree-mark.chromatic {
    background: rgba(255, 180, 100, 0.08);
    border-color: rgba(255, 200, 130, 0.35);
    color: rgba(255, 220, 170, 0.95);
    width: 36px; height: 36px;
    font-size: 11px;
  }

  /* ---- M2 — Big direction arrow buttons ----
     Justification: the v1 .ans-chip is pill-sized; M2 has only 2-4
     answers and benefits visually from large arrow tiles. We extend
     .ans-chip with a `melodic-arrow-chip` modifier rather than
     replace it, so the canon class still applies. */
  .ex-answers.melodic-arrows-row {
    gap: 20px;
    max-width: 720px;
  }
  .ans-chip.melodic-arrow-chip {
    min-width: 150px;
    min-height: 130px;
    padding: 22px 28px;
    border-radius: 20px;
    flex-direction: column;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px;
    font-size: 15px;
  }
  .ans-chip.melodic-arrow-chip .arrow-glyph {
    font-size: clamp(38px, 6vmin, 56px);
    line-height: 1;
    color: var(--accent-2);
    filter: drop-shadow(0 0 14px rgba(110, 168, 255, 0.55));
  }
  .ans-chip.melodic-arrow-chip .arrow-text {
    font-size: 14px; font-weight: 600; color: var(--text);
  }
  .ans-chip.melodic-arrow-chip:hover .arrow-glyph {
    color: #fff;
    filter: drop-shadow(0 0 22px rgba(180, 210, 255, 0.9));
  }

  /* ---- M2 — Contour visualizer (level 5) ----
     A tiny line-graph showing the melodic shape that was played.
     Justification: no canon class for a contour line. */
  .melodic-contour {
    width: clamp(200px, 30vmin, 320px);
    height: 90px;
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid var(--glass-border);
    border-radius: 14px;
    padding: 12px;
    position: relative;
  }
  .melodic-contour svg {
    width: 100%; height: 100%; display: block;
  }
  .melodic-contour-line {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 6px rgba(110, 168, 255, 0.7));
  }
  .melodic-contour-dot {
    fill: var(--accent-2);
    filter: drop-shadow(0 0 6px rgba(180, 210, 255, 0.9));
  }

  /* ---- M3 — Scale visualizer ----
     A horizontal staff with the scale's ascending notes shown as
     glowing dots, plus a label. Justification: canon `.staff-mock`
     handles the staff lines; we add a wrapper for label + the dot
     row computed per-scale at runtime. */
  .melodic-scale-vis {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    width: 100%;
    max-width: 560px;
  }
  .melodic-scale-vis .scale-vis-label {
    font-size: 12px; color: var(--text-dim);
    letter-spacing: 1px; text-transform: uppercase;
  }
  .melodic-scale-vis .scale-vis-label .v {
    color: var(--accent-2); font-weight: 700;
    margin-inline-start: 6px; text-transform: none; letter-spacing: 0;
  }

  /* ---- M1 — chromatic chip row label ---- */
  .melodic-chromatic-row {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .melodic-chromatic-row .chrom-hint {
    font-size: 11px; color: var(--text-dim); letter-spacing: 0.5px;
  }

  /* ---- shared: settings strip below answers, hidden behind divider ---- */
  .melodic-settings-strip {
    width: 100%;
    max-width: 900px;
    border-top: 1px dashed rgba(180, 210, 255, 0.18);
    padding-top: 16px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .melodic-settings-strip .strip-title {
    font-size: 10px; letter-spacing: 1.5px;
    color: var(--text-dim); text-transform: uppercase;
  }

  /* ---- standalone preview helpers (only used when opened alone) ---- */
  .preview-section {
    position: relative;
    min-height: 100vh;
  }
  .preview-section + .preview-section {
    border-top: 1px dashed rgba(180, 210, 255, 0.12);
  }
  .preview-marker {
    position: absolute; top: 50px; left: 50%;
    transform: translateX(-50%);
    z-index: 75;
    background: rgba(0, 0, 0, 0.5);
    color: var(--accent-2);
    border: 1px solid rgba(180, 210, 255, 0.25);
    padding: 6px 16px; border-radius: 999px;
    font-size: 11px; letter-spacing: 1.2px;
    backdrop-filter: blur(10px);
  }


/* ============ harmonic-isolated ============ */

  /* ---- Shared stacked-chord visualizer ----
     Used by H1 / H2 / H3 to show the played chord as a vertical
     stack of glowing noteheads. Each row = a chord tone. The bass
     row is treated specially (highlighted for H2 inversions).
     Justification: no canon class fits stacked noteheads; reusable
     across 3 of our 4 exercises. */
  .harmonic-iso-stack {
    display: flex; flex-direction: column-reverse; gap: 8px;
    padding: 14px 18px;
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid var(--glass-border);
    border-radius: 16px;
    backdrop-filter: blur(8px);
    min-width: 220px;
  }
  .harmonic-iso-stack-row {
    display: flex; align-items: center; gap: 12px;
    padding: 6px 10px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(180, 210, 255, 0.08);
    transition: all 0.25s ease;
  }
  .harmonic-iso-stack-row .interval-tag {
    width: 38px;
    font-size: 11px; font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    text-align: center;
  }
  .harmonic-iso-stack-row .notehead {
    width: 22px; height: 16px;
    border-radius: 50%;
    background: rgba(180, 210, 255, 0.35);
    box-shadow: 0 0 10px rgba(180, 210, 255, 0.45);
  }
  .harmonic-iso-stack-row .note-name {
    font-size: 13px; font-weight: 600;
    color: var(--accent-2);
    min-width: 32px;
  }
  .harmonic-iso-stack-row.root {
    background: rgba(110, 168, 255, 0.18);
    border-color: var(--accent);
    box-shadow: inset 0 0 12px rgba(110, 168, 255, 0.18);
  }
  .harmonic-iso-stack-row.root .notehead {
    background: var(--accent);
    box-shadow: 0 0 14px var(--accent);
  }
  .harmonic-iso-stack-row.root .interval-tag,
  .harmonic-iso-stack-row.root .note-name {
    color: var(--text);
  }
  /* tension row gets a warm hue */
  .harmonic-iso-stack-row.tension {
    background: rgba(255, 180, 100, 0.1);
    border-color: rgba(255, 200, 130, 0.35);
  }
  .harmonic-iso-stack-row.tension .notehead {
    background: rgba(255, 200, 130, 0.7);
    box-shadow: 0 0 12px rgba(255, 200, 130, 0.6);
  }
  .harmonic-iso-stack-row.tension .interval-tag,
  .harmonic-iso-stack-row.tension .note-name {
    color: rgba(255, 220, 170, 0.95);
  }
  .harmonic-iso-stack-row.bass-highlight {
    background: rgba(150, 220, 255, 0.18);
    border-color: rgba(150, 220, 255, 0.5);
    box-shadow: inset 0 0 14px rgba(150, 220, 255, 0.18);
  }
  .harmonic-iso-stack-row.bass-highlight .notehead {
    background: rgba(150, 220, 255, 0.95);
    box-shadow: 0 0 14px rgba(150, 220, 255, 0.85);
  }
  .harmonic-iso-stack-row.bass-highlight .interval-tag,
  .harmonic-iso-stack-row.bass-highlight .note-name {
    color: #e6f5ff;
  }

  /* ---- H1 — sequence slot row (levels 5-6) ----
     Boxes that fill as the student answers each chord in the
     sequence. Mirrors the React `slotRow`/`slotBox` styles. */
  .harmonic-iso-slot-row {
    display: flex; gap: 12px;
    justify-content: center; flex-wrap: wrap;
  }
  .harmonic-iso-slot {
    width: 78px; height: 62px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.04);
    border: 2px solid var(--glass-border);
    font-size: 17px; font-weight: 700;
    color: var(--text-dim);
    transition: all 0.2s ease;
  }
  .harmonic-iso-slot.filled {
    background: rgba(120, 220, 180, 0.15);
    border-color: rgba(120, 220, 180, 0.7);
    color: rgba(190, 250, 220, 0.95);
    box-shadow: 0 0 14px rgba(120, 220, 180, 0.3);
  }
  .harmonic-iso-slot.active {
    background: rgba(110, 168, 255, 0.18);
    border-color: var(--accent);
    color: var(--accent-2);
    box-shadow: 0 0 18px rgba(110, 168, 255, 0.5);
    animation: slotPulse 1.4s ease-in-out infinite alternate;
  }
  @keyframes slotPulse {
    from { box-shadow: 0 0 18px rgba(110, 168, 255, 0.35); }
    to   { box-shadow: 0 0 28px rgba(110, 168, 255, 0.7); }
  }

  /* ---- H2 — inversion diagram (small chord ladder + bass label) ----
     A compact horizontal diagram next to the stack that names the
     inversion (Root / 1st / 2nd / 3rd) and points to which voice is
     in the bass. */
  .harmonic-iso-inv-card {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid var(--glass-border);
    border-radius: 14px;
    backdrop-filter: blur(8px);
    min-width: 160px;
  }
  .harmonic-iso-inv-label {
    font-size: 10px; letter-spacing: 1.4px;
    color: var(--text-dim); text-transform: uppercase;
  }
  .harmonic-iso-inv-value {
    font-size: 22px; font-weight: 800;
    color: var(--accent-2);
    text-shadow: 0 0 12px rgba(180, 210, 255, 0.55);
  }
  .harmonic-iso-inv-bass {
    font-size: 12px; color: var(--text-dim);
  }
  .harmonic-iso-inv-bass .v {
    color: rgba(150, 220, 255, 0.95);
    font-weight: 700;
    margin-inline-start: 6px;
  }

  /* ---- H3 — extension ladder graphic ----
     A vertical column of small pips showing 1-3-5-7-9-11-13. The
     pips that belong to the current chord type light up. */
  .harmonic-iso-ext-ladder {
    display: flex; flex-direction: column-reverse; gap: 6px;
    padding: 12px 14px;
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid var(--glass-border);
    border-radius: 14px;
    min-width: 90px;
    align-items: center;
  }
  .harmonic-iso-ext-pip {
    display: flex; align-items: center; gap: 8px;
    opacity: 0.4;
    transition: opacity 0.2s ease;
  }
  .harmonic-iso-ext-pip.on { opacity: 1; }
  .harmonic-iso-ext-pip .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: rgba(180, 210, 255, 0.25);
    border: 1.5px solid var(--glass-border);
  }
  .harmonic-iso-ext-pip.on .dot {
    background: var(--accent);
    border-color: var(--accent-2);
    box-shadow: 0 0 10px rgba(110, 168, 255, 0.7);
  }
  .harmonic-iso-ext-pip .num {
    font-size: 12px; font-weight: 700;
    color: var(--text-dim);
    min-width: 22px;
  }
  .harmonic-iso-ext-pip.on .num { color: var(--accent-2); }

  /* ---- H4 — tension grid + dot-above-chord visual ----
     Big square buttons (multi-select) for tensions, mirroring the
     React `tensionGrid`. */
  .harmonic-iso-tension-grid {
    display: flex; flex-wrap: wrap; gap: 14px;
    justify-content: center;
    max-width: 540px;
  }
  .harmonic-iso-tension-btn {
    width: 82px; height: 82px;
    border-radius: 14px;
    background: var(--glass-bg);
    border: 1.5px solid var(--glass-border);
    color: var(--text);
    font-size: 22px; font-weight: 800;
    cursor: pointer; font-family: inherit;
    backdrop-filter: blur(8px);
    transition: all 0.2s ease;
    display: flex; align-items: center; justify-content: center;
  }
  .harmonic-iso-tension-btn:hover {
    background: rgba(110, 168, 255, 0.18);
    border-color: rgba(180, 210, 255, 0.5);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(110, 168, 255, 0.35);
  }
  .harmonic-iso-tension-btn.checked {
    background: rgba(110, 168, 255, 0.28);
    border-color: var(--accent);
    color: var(--text);
    box-shadow: 0 0 18px rgba(110, 168, 255, 0.5);
  }
  .harmonic-iso-tension-btn.correct {
    background: rgba(120, 220, 180, 0.28);
    border-color: rgba(120, 220, 180, 0.8);
    color: #e8fff4;
    box-shadow: 0 0 18px rgba(120, 220, 180, 0.45);
  }

  /* H4 — the tension dot floating above the stacked chord */
  .harmonic-iso-tension-overlay {
    position: relative;
    display: inline-block;
  }
  .harmonic-iso-tension-bubble {
    position: absolute;
    top: -14px; left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 200, 130, 0.95);
    color: #2a1a05;
    font-size: 12px; font-weight: 800;
    padding: 4px 10px;
    border-radius: 999px;
    box-shadow: 0 0 18px rgba(255, 200, 130, 0.6);
    white-space: nowrap;
  }
  .harmonic-iso-tension-bubble::after {
    content: '';
    position: absolute;
    bottom: -5px; left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: 8px; height: 8px;
    background: rgba(255, 200, 130, 0.95);
  }

  /* ---- H4 — Submit pill (different from chip-style ans) ---- */
  .harmonic-iso-submit {
    background: linear-gradient(135deg, rgba(110, 168, 255, 0.55), rgba(42, 90, 255, 0.45));
    border: 1.5px solid var(--accent);
    color: #fff;
    padding: 14px 38px;
    border-radius: 999px;
    font-size: 16px; font-weight: 700;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 0 30px rgba(110, 168, 255, 0.55);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .harmonic-iso-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 42px rgba(180, 210, 255, 0.8);
  }

  /* ---- H4 — three-button play row (Base / With tensions / Compare) ---- */
  .harmonic-iso-play-row {
    display: flex; gap: 12px;
    justify-content: center; flex-wrap: wrap;
  }
  .harmonic-iso-play-row .ans-chip {
    padding: 12px 22px;
    font-size: 14px;
  }
  /* H4 — current chord readout */
  .harmonic-iso-chord-readout {
    font-size: 14px; color: var(--text-dim);
    text-align: center;
  }
  .harmonic-iso-chord-readout strong {
    color: var(--accent-2);
    font-size: 22px; font-weight: 800;
    margin: 0 8px;
    text-shadow: 0 0 12px rgba(180, 210, 255, 0.5);
  }

  /* ---- standalone preview helpers (only used when opened alone) ---- */
  .preview-section { position: relative; min-height: 100vh; }
  .preview-section + .preview-section {
    border-top: 1px dashed rgba(180, 210, 255, 0.12);
  }
  .preview-marker {
    position: absolute; top: 50px; left: 50%;
    transform: translateX(-50%);
    z-index: 75;
    background: rgba(0, 0, 0, 0.5);
    color: var(--accent-2);
    border: 1px solid rgba(180, 210, 255, 0.25);
    padding: 6px 16px; border-radius: 999px;
    font-size: 11px; letter-spacing: 1.2px;
    backdrop-filter: blur(10px);
  }


/* ============ functional ============ */

  /* ---- Global Levels Drawer (shared with every section) ---- */
  .levels-trigger {
    position: fixed; top: 50px; left: 18px; z-index: 80;
    background: rgba(255,255,255,0.08);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 8px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: inherit; backdrop-filter: blur(10px);
    display: inline-flex; align-items: center; gap: 8px;
    transition: background 0.2s ease;
  }
  .levels-trigger:hover { background: rgba(255,255,255,0.16); }
  .levels-trigger .hamburger {
    font-size: 15px; line-height: 1;
    color: var(--accent-2);
  }
  .levels-trigger .current-level {
    color: var(--accent); font-weight: 700;
  }

  .levels-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(5, 13, 42, 0.55);
    backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .levels-overlay.open { opacity: 1; pointer-events: auto; }

  .levels-drawer {
    position: fixed; top: 0; bottom: 0; left: 0;
    width: min(380px, 90vw);
    z-index: 210;
    background:
      linear-gradient(180deg, rgba(13, 42, 122, 0.85), rgba(10, 31, 92, 0.92));
    border-right: 1.5px solid var(--glass-border);
    backdrop-filter: blur(16px);
    box-shadow: 4px 0 40px rgba(0, 0, 0, 0.5),
                inset -1px 0 0 rgba(180, 210, 255, 0.08);
    transform: translateX(-105%);
    transition: transform 0.32s cubic-bezier(0.2, 0.7, 0.2, 1);
    display: flex; flex-direction: column;
    direction: rtl;
  }
  .levels-drawer.open { transform: translateX(0); }

  .levels-drawer-header {
    padding: 18px 20px 14px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(180, 210, 255, 0.12);
  }
  .levels-drawer-title {
    margin: 0;
    font-size: 17px; font-weight: 700;
    color: var(--text);
    display: flex; align-items: center; gap: 10px;
  }
  .levels-drawer-title .ex-tag {
    font-size: 11px; letter-spacing: 1.5px;
    color: var(--accent);
    padding: 3px 8px; border-radius: 6px;
    background: rgba(110, 168, 255, 0.15);
    border: 1px solid rgba(110, 168, 255, 0.3);
  }
  .levels-drawer-close {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-dim);
    width: 32px; height: 32px;
    border-radius: 50%;
    font-size: 16px; cursor: pointer;
    font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease;
  }
  .levels-drawer-close:hover {
    background: rgba(255,255,255,0.14);
    color: var(--text);
  }

  .levels-drawer-list {
    list-style: none;
    margin: 0; padding: 12px;
    overflow-y: auto;
    flex: 1;
    display: flex; flex-direction: column; gap: 6px;
  }
  .levels-drawer-list::-webkit-scrollbar { width: 6px; }
  .levels-drawer-list::-webkit-scrollbar-thumb {
    background: rgba(180, 210, 255, 0.2);
    border-radius: 3px;
  }

  .level-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.03);
    border: 1.5px solid transparent;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .level-item:hover {
    background: rgba(110, 168, 255, 0.1);
    border-color: rgba(180, 210, 255, 0.2);
  }
  .level-item.active {
    background: rgba(110, 168, 255, 0.18);
    border-color: var(--accent);
    box-shadow: 0 0 18px rgba(110, 168, 255, 0.35),
                inset 0 0 14px rgba(110, 168, 255, 0.08);
  }
  .level-item.locked {
    opacity: 0.45; cursor: not-allowed;
  }
  .level-item.locked:hover {
    background: rgba(255,255,255,0.03);
    border-color: transparent;
  }
  .level-item-num {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    border: 1.5px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .level-item.active .level-item-num {
    background: var(--accent);
    border-color: var(--accent-2);
    color: #051030;
    box-shadow: 0 0 12px rgba(110, 168, 255, 0.7);
  }
  .level-item.completed .level-item-num {
    background: rgba(120, 220, 180, 0.25);
    border-color: rgba(120, 220, 180, 0.6);
    color: #e0fff0;
  }
  .level-item-label {
    flex: 1;
    font-size: 13px; font-weight: 500;
    color: var(--text);
  }
  .level-item.active .level-item-label { color: var(--accent-2); font-weight: 600; }
  .level-item-icon {
    font-size: 13px;
    color: var(--text-dim);
  }
  .level-item.completed .level-item-icon { color: rgba(120, 220, 180, 0.9); }
  .level-item.locked .level-item-icon { color: var(--text-dim); }

  /* ---- Shared settings strip (mirrored from melodic.html) ----
     Same visual pattern: a faint dashed divider, then a strip
     title + 1-2 rows of select-pills and pill-toggles. Used by
     every functional exercise. */
  .functional-settings-strip {
    width: 100%;
    max-width: 900px;
    border-top: 1px dashed rgba(180, 210, 255, 0.18);
    padding-top: 16px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .functional-settings-strip .strip-title {
    font-size: 10px; letter-spacing: 1.5px;
    color: var(--text-dim); text-transform: uppercase;
  }

  /* ---- F0 — Roman-numeral degree wheel ----
     A 7-position circular dial showing the diatonic degrees in
     roman numerals around the hub. The current "answer" position
     glows; chromatic degrees (V/V, ♭VII, ♭VI in level 6) appear
     as smaller, warm-toned satellites between the diatonic ones.
     Justification: F0 is single-chord identification; a circular
     dial frames each degree as a position around the tonic — the
     same metaphor M1 uses for the degree clock, applied to the
     harmonic plane. */
  .functional-degree-wheel {
    position: relative;
    width: clamp(240px, 36vmin, 360px);
    height: clamp(240px, 36vmin, 360px);
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, rgba(110, 168, 255, 0.08), transparent 70%);
    border: 1.5px dashed rgba(180, 210, 255, 0.2);
  }
  .functional-degree-wheel-center {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 42%; aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid var(--glass-border);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; gap: 2px;
    backdrop-filter: blur(8px);
  }
  .functional-degree-wheel-center .tonic-label {
    font-size: 10px; letter-spacing: 1.2px;
    color: var(--text-dim); text-transform: uppercase;
  }
  .functional-degree-wheel-center .tonic-name {
    font-size: clamp(22px, 3.6vmin, 30px);
    font-weight: 800; color: var(--accent-2);
  }
  .functional-degree-wheel-center .mode-name {
    font-size: 11px; color: var(--text-dim); margin-top: 2px;
  }
  .functional-degree-spoke {
    position: absolute; top: 50%; left: 50%;
    --angle: 0deg; --radius: 42%;
    transform:
      translate(-50%, -50%)
      rotate(var(--angle))
      translateY(calc(var(--radius) * -1))
      rotate(calc(var(--angle) * -1));
    width: 52px; height: 52px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    border: 1.5px solid var(--glass-border);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .functional-degree-spoke:hover {
    background: rgba(110, 168, 255, 0.15);
    border-color: var(--accent);
  }
  .functional-degree-spoke.active {
    background: rgba(110, 168, 255, 0.4);
    border-color: var(--accent-2);
    color: #fff;
    box-shadow: 0 0 22px rgba(110, 168, 255, 0.7);
  }
  .functional-degree-spoke.chromatic {
    background: rgba(255, 180, 100, 0.08);
    border-color: rgba(255, 200, 130, 0.35);
    color: rgba(255, 220, 170, 0.95);
    width: 44px; height: 44px;
    font-size: 12px;
  }
  .functional-degree-spoke .chord-hint {
    font-size: 9px; font-weight: 500;
    color: var(--text-dim); margin-top: 1px;
    letter-spacing: 0.3px;
  }
  .functional-degree-spoke.active .chord-hint {
    color: rgba(255, 255, 255, 0.85);
  }

  /* ---- F1 — Cadence chord-sequence visualizer ----
     A row of 2–3 chord boxes side-by-side showing the cadence
     that was played (e.g. "V → I" for PAC, "I → IV" for Plagal).
     Justification: cadence ID is fundamentally about a tiny
     chord sequence; surfacing the actual sequence (after the
     answer is revealed, or as a hint) gives the student a
     visual anchor for the harmonic motion. */
  .functional-cadence-vis {
    display: flex; align-items: center; justify-content: center;
    gap: 14px;
    padding: 8px 16px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    backdrop-filter: blur(8px);
  }
  .functional-cadence-box {
    min-width: 78px; padding: 12px 16px;
    border-radius: 12px;
    background: rgba(110, 168, 255, 0.08);
    border: 1.5px solid rgba(110, 168, 255, 0.25);
    display: flex; flex-direction: column;
    align-items: center; gap: 2px;
  }
  .functional-cadence-box.resolution {
    background: rgba(120, 220, 180, 0.12);
    border-color: rgba(120, 220, 180, 0.4);
    box-shadow: 0 0 14px rgba(120, 220, 180, 0.25);
  }
  .functional-cadence-box .roman {
    font-size: 20px; font-weight: 800;
    color: var(--accent-2);
    letter-spacing: 0.5px;
  }
  .functional-cadence-box.resolution .roman {
    color: rgba(180, 240, 210, 0.95);
  }
  .functional-cadence-box .chord-name {
    font-size: 11px; color: var(--text-dim);
    letter-spacing: 0.3px;
  }
  .functional-cadence-arrow {
    font-size: 22px; color: var(--accent);
    opacity: 0.6;
    line-height: 1;
  }

  /* ---- F2 — Typed harmonic progression input ----
     The most distinctive view. The student hears a chord
     progression and types it back, one slot at a time.
     - `.functional-prog-input` is the row of slots that fills up
        left-to-right, with the active slot pulsing.
     - `.functional-prog-chip-bank` is the bank of degree chips
        (I, ii, iii, IV, V, vi, vii°) the student picks from.
        Higher levels grow the bank (+secondary dominants,
        borrowed chords, ♭VII, ♭VI, jazz 7ths, etc.).
     Justification: no canon class matches the slot-fill pattern;
     this exercise is unique in the app for being typing/input
     rather than single-choice. */
  .functional-prog-input {
    display: flex; gap: 12px;
    justify-content: center; align-items: center;
    flex-wrap: wrap;
    padding: 8px;
  }
  .functional-prog-slot {
    width: 78px; height: 78px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.04);
    border: 2px dashed rgba(180, 210, 255, 0.25);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 18px; font-weight: 800;
    color: var(--text-dim);
    transition: all 0.2s ease;
  }
  .functional-prog-slot.empty { color: rgba(159, 180, 214, 0.4); }
  .functional-prog-slot.filled {
    background: rgba(120, 220, 180, 0.15);
    border: 2px solid rgba(120, 220, 180, 0.55);
    color: rgba(220, 255, 235, 0.98);
    box-shadow: 0 0 18px rgba(120, 220, 180, 0.25);
  }
  .functional-prog-slot.active {
    background: rgba(110, 168, 255, 0.18);
    border: 2px solid var(--accent);
    color: var(--accent-2);
    box-shadow: 0 0 22px rgba(110, 168, 255, 0.55),
                inset 0 0 14px rgba(110, 168, 255, 0.12);
    animation: slotPulse 1.2s ease-in-out infinite alternate;
  }
  @keyframes slotPulse {
    from { box-shadow: 0 0 18px rgba(110, 168, 255, 0.4), inset 0 0 10px rgba(110, 168, 255, 0.1); }
    to   { box-shadow: 0 0 28px rgba(110, 168, 255, 0.75), inset 0 0 18px rgba(110, 168, 255, 0.2); }
  }
  .functional-prog-slot .slot-roman { font-size: 18px; line-height: 1; }
  .functional-prog-slot .slot-chord {
    font-size: 10px; font-weight: 500; margin-top: 3px;
    color: var(--text-dim);
    letter-spacing: 0.3px;
  }
  .functional-prog-slot.filled .slot-chord { color: rgba(180, 240, 210, 0.85); }

  .functional-prog-chip-bank {
    display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center; align-items: center;
    max-width: 720px;
    padding: 10px;
    background: rgba(255, 255, 255, 0.025);
    border: 1px dashed rgba(180, 210, 255, 0.18);
    border-radius: 18px;
  }
  .functional-prog-chip {
    min-width: 78px; padding: 10px 14px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.05);
    border: 1.5px solid var(--glass-border);
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s ease;
    display: flex; flex-direction: column;
    align-items: center; gap: 2px;
  }
  .functional-prog-chip:hover {
    background: rgba(110, 168, 255, 0.18);
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(110, 168, 255, 0.3);
  }
  .functional-prog-chip.chromatic {
    background: rgba(255, 180, 100, 0.06);
    border-color: rgba(255, 200, 130, 0.3);
  }
  .functional-prog-chip.chromatic:hover {
    background: rgba(255, 180, 100, 0.18);
    border-color: rgba(255, 220, 170, 0.7);
  }
  .functional-prog-chip .chip-roman {
    font-size: 15px; font-weight: 700;
    color: var(--text);
  }
  .functional-prog-chip.chromatic .chip-roman {
    color: rgba(255, 220, 170, 0.95);
  }
  .functional-prog-chip .chip-chord {
    font-size: 10px; color: var(--text-dim);
    letter-spacing: 0.3px;
  }

  .functional-submit-btn {
    background: linear-gradient(135deg, rgba(110, 168, 255, 0.35), rgba(42, 90, 255, 0.2));
    border: 1.5px solid var(--accent);
    color: #fff;
    padding: 10px 24px;
    border-radius: 999px;
    font-size: 14px; font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 0 24px rgba(110, 168, 255, 0.45);
    transition: all 0.2s ease;
  }
  .functional-submit-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 34px rgba(180, 210, 255, 0.7);
  }
  .functional-submit-btn:disabled {
    opacity: 0.4; cursor: not-allowed;
    box-shadow: none;
  }

  /* ---- F3 — Rhythmus / harmonic-rhythm grid ----
     A 2-bar (or 4-bar at higher levels) grid where each beat is
     a clickable cell. The student marks the cells where a chord
     change is heard. Filled cells glow; the "play head" pulses
     across as the question plays.
     Justification: F3 measures harmonic rhythm — *when* changes
     occur, not *what* the chord is. A bar/beat grid is the
     natural visual. No canon class fits. */
  .functional-rhythm-grid-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    width: 100%; max-width: 640px;
  }
  .functional-rhythm-grid-wrap .grid-hint {
    font-size: 12px; color: var(--text-dim);
    letter-spacing: 0.5px;
  }
  .functional-rhythm-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
    width: 100%;
    background: rgba(255, 255, 255, 0.03);
    border: 1.5px solid var(--glass-border);
    border-radius: 14px;
    padding: 12px;
    direction: ltr; /* music reads left-to-right even in an RTL UI */
  }
  .functional-rhythm-cell {
    aspect-ratio: 1.4 / 1;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid var(--glass-border);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 11px; color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s ease;
    position: relative;
  }
  .functional-rhythm-cell:hover {
    background: rgba(110, 168, 255, 0.12);
    border-color: rgba(180, 210, 255, 0.4);
  }
  .functional-rhythm-cell.downbeat {
    border-color: rgba(180, 210, 255, 0.35);
  }
  .functional-rhythm-cell.downbeat .beat-num {
    color: var(--accent-2);
    font-weight: 700;
  }
  .functional-rhythm-cell.change {
    background: rgba(110, 168, 255, 0.3);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 16px rgba(110, 168, 255, 0.45);
  }
  .functional-rhythm-cell.change .chord-on-beat {
    font-size: 11px; font-weight: 700;
    color: #fff;
    letter-spacing: 0.3px;
  }
  .functional-rhythm-cell .beat-num {
    font-size: 10px; letter-spacing: 0.5px;
  }
  .functional-rhythm-cell .chord-on-beat {
    font-size: 13px; font-weight: 700;
    color: var(--accent-2);
    margin-top: 1px;
  }
  .functional-rhythm-cell.playhead::after {
    content: '';
    position: absolute; inset: -3px;
    border-radius: 11px;
    border: 2px solid rgba(255, 220, 130, 0.9);
    box-shadow: 0 0 16px rgba(255, 220, 130, 0.65);
    pointer-events: none;
    animation: playheadPulse 0.8s ease-in-out infinite alternate;
  }
  @keyframes playheadPulse {
    from { opacity: 0.7; }
    to   { opacity: 1; }
  }
  .functional-bar-divider {
    grid-column: 5 / 5;
    width: 0;
    border-right: 2px dashed rgba(180, 210, 255, 0.3);
  }

  /* ---- F4 — Known progression cards ----
     Distractor cards each showing a progression name + its roman
     numerals + a real-world example song. The "correct" answer
     glows. Justification: F4 is recognition of a *named* pattern;
     each option is richer than a single chip — name, sequence,
     and a song the student might know. We extend `.ans-chip`
     with a `functional-prog-card` modifier to keep the canon. */
  .functional-prog-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    max-width: 760px;
    width: 100%;
    padding: 0 12px;
  }
  .ans-chip.functional-prog-card {
    min-width: 0; min-height: 110px;
    padding: 14px 16px;
    border-radius: 16px;
    flex-direction: column;
    display: inline-flex;
    align-items: stretch;
    justify-content: center;
    gap: 6px;
    text-align: center;
  }
  .ans-chip.functional-prog-card .card-name {
    font-size: 14px; font-weight: 700;
    color: var(--text);
    line-height: 1.25;
  }

  /* ---- Voice-Leading: 4-voice SATB stack visualizer ----
     Justification: V1 and V2 both ask "how did ONE voice move
     between two chords?" No canon class shows a voicing stack
     with a single voice spotlighted and an arrow between its
     two positions. We need: rows (SATB) × columns (chords),
     one row glowing, an arrow drawn between two cells of that
     row, the other rows dimmed so the eye matches the ear. */
  .voice-leading-voice-stack {
    position: relative;
    width: 100%;
    max-width: 620px;
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid var(--glass-border);
    border-radius: 18px;
    padding: 18px 18px 14px;
    display: flex; flex-direction: column; gap: 10px;
    backdrop-filter: blur(8px);
  }
  .voice-leading-stack-header {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--text-dim);
    padding-bottom: 4px;
    border-bottom: 1px dashed rgba(180, 210, 255, 0.12);
  }
  .voice-leading-stack-header .key-tag {
    color: var(--accent-2); font-weight: 700; letter-spacing: 0.4px;
  }
  .voice-leading-voice-row {
    display: grid;
    grid-template-columns: 70px repeat(var(--chord-count, 4), 1fr);
    gap: 8px;
    align-items: center;
    position: relative;
    padding: 4px 0;
    border-radius: 10px;
    transition: background 0.25s ease;
  }
  .voice-leading-voice-row.dim { opacity: 0.4; }
  .voice-leading-voice-row.highlighted {
    background: rgba(110, 168, 255, 0.08);
    box-shadow: inset 0 0 18px rgba(110, 168, 255, 0.12);
  }
  .voice-leading-voice-tag {
    font-size: 11px; font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    text-align: start;
    padding-inline-start: 6px;
    display: flex; flex-direction: column; line-height: 1.2;
  }
  .voice-leading-voice-tag .he { color: var(--text); font-weight: 700; font-size: 12px; }
  .voice-leading-voice-row.highlighted .voice-leading-voice-tag .he {
    color: var(--accent-2);
    text-shadow: 0 0 10px rgba(110, 168, 255, 0.6);
  }
  .voice-leading-voice-cell {
    height: 42px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .voice-leading-voice-note {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.06);
    border: 1.5px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    color: var(--text);
    transition: all 0.2s ease;
  }
  .voice-leading-voice-row.highlighted .voice-leading-voice-note {
    background: rgba(110, 168, 255, 0.32);
    border-color: var(--accent-2);
    color: #fff;
    box-shadow: 0 0 18px rgba(110, 168, 255, 0.55);
  }
  .voice-leading-voice-row.highlighted .voice-leading-voice-note.from-note {
    background: rgba(255, 200, 130, 0.32);
    border-color: rgba(255, 200, 130, 0.85);
    box-shadow: 0 0 16px rgba(255, 200, 130, 0.45);
  }
  .voice-leading-voice-row.highlighted .voice-leading-voice-note.to-note {
    background: rgba(110, 220, 180, 0.32);
    border-color: rgba(140, 230, 200, 0.95);
    box-shadow: 0 0 18px rgba(120, 220, 180, 0.55);
  }

  /* ---- Motion arrow drawn between two cells of the highlighted voice.
     Sits absolutely positioned inside the highlighted row, between
     the FROM cell (previous chord) and the TO cell (current chord). */
  .voice-leading-motion-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    height: 28px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .voice-leading-motion-arrow svg {
    width: 100%; height: 100%;
    overflow: visible;
  }
  .voice-leading-motion-arrow .arrow-stem {
    stroke: var(--accent-2);
    stroke-width: 2.5;
    stroke-linecap: round;
    fill: none;
    filter: drop-shadow(0 0 6px rgba(180, 210, 255, 0.75));

  .voice-leading-motion-arrow .arrow-head {

  .voice-leading-motion-arrow .motion-tag {

  /* ============================================================
     S1 / S2 — staff variants

     Justification: the canon `.staff-mock` is a "filler" prop —
     it gives 5 lines and a few dots. Solfège exercises USE the
     staff as their *primary information surface* — so we add
     `solfege-staff-large` as a modifier that grows the canvas,
     keeps the same line/dot DNA, and supports note-labels (the
     Do/Re/Mi caption under each note) and a target-glow ring
     used by S2 to mark the question note.
     ============================================================ */
  .staff-mock.solfege-staff-large {
    height: clamp(170px, 22vmin, 220px);
    padding: 36px 42px 50px;
    width: 100%; max-width: 640px;
    background: rgba(255, 255, 255, 0.05);
  }
  .staff-mock.solfege-staff-large .staff-line {
    margin-bottom: 20px;
    background: rgba(180, 210, 255, 0.55);
  }
  .staff-mock.solfege-staff-large .staff-note {
    width: 24px; height: 18px;
    transform: translate(-50%, -50%);
    /* dot positions are placed at the center, so the layout uses
       50%-anchored positioning rather than top/left corner anchoring */
  }
  /* clef glyph on the leading edge of the staff */
  .staff-mock.solfege-staff-large .solfege-clef {
    position: absolute;
    right: 14px; top: 50%;
    transform: translateY(-50%);
    font-size: clamp(46px, 7vmin, 64px);
    color: var(--accent-2);
    opacity: 0.85;
    line-height: 1;
    filter: drop-shadow(0 0 8px rgba(110, 168, 255, 0.55));
    pointer-events: none;
  }
  /* note-name label (Do, Re, Mi…) — placed under each staff-note */
  .solfege-note-label {
    position: absolute;
    transform: translate(-50%, 0);
    font-size: 11px; font-weight: 700;
    color: var(--accent-2);
    text-shadow: 0 0 8px rgba(0, 0, 0, 0.7);
    letter-spacing: 0.5px;
    pointer-events: none;
  }
  /* note "now playing" state for S1 — pulses */
  .staff-note.solfege-note-current {
    background: #fff;
    box-shadow: 0 0 22px #fff, 0 0 38px var(--accent);
    animation: solfegeNotePulse 1.1s ease-in-out infinite;
  }
  @keyframes solfegeNotePulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50%      { transform: translate(-50%, -50%) scale(1.18); }
  }
  /* target ring for S2 — glowing halo around the answer note */
  .staff-note.solfege-note-target {
    background: rgba(255, 200, 100, 0.95);
    box-shadow: 0 0 20px rgba(255, 200, 100, 0.95),
                0 0 36px rgba(255, 180, 60, 0.7);
  }
  .staff-note.solfege-note-target::after {
    content: '';
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 2px dashed rgba(255, 220, 150, 0.7);
    animation: solfegeTargetSpin 6s linear infinite;
  }
  @keyframes solfegeTargetSpin {
    from { transform: rotate(0); }
    to   { transform: rotate(360deg); }
  }

  /* ============================================================
     S1 — record button extension + state copy

     The canon `.rec-btn` is the right primitive — we extend it
     with an `.solfege-rec-btn` modifier that adds a recording-
     state pulsing ring (for the "now recording" state) and a
     row containing the button + a Play-target button so the
     user can audition the target before singing.
     ============================================================ */
  .solfege-record-row {
    display: flex; gap: 18px; align-items: center; justify-content: center;
    flex-wrap: wrap;
  }
  .rec-btn.solfege-rec-btn {
    position: relative;
  }
  .rec-btn.solfege-rec-btn .rec-dot {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: #fff;
    box-shadow: inset 0 0 6px rgba(255, 80, 80, 0.6);
  }
  .rec-btn.solfege-rec-btn.recording {
    animation: solfegeRecPulse 1s ease-in-out infinite;
  }
  .rec-btn.solfege-rec-btn.recording .rec-dot {
    border-radius: 6px;
    width: 24px; height: 24px;
    background: #fff;
  }
  @keyframes solfegeRecPulse {
    0%, 100% { box-shadow: 0 0 35px rgba(255, 80, 80, 0.6); }
    50%      { box-shadow: 0 0 65px rgba(255, 80, 80, 1), 0 0 100px rgba(255, 50, 50, 0.5); }
  }
  .rec-btn.solfege-rec-btn .rec-caption {
    position: absolute;
    bottom: -28px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px; letter-spacing: 1px;
    color: var(--text-dim);
    white-space: nowrap;
    text-transform: uppercase;
  }
  .rec-btn.solfege-rec-btn.recording .rec-caption {
    color: #ff8a8a;
    font-weight: 700;
  }

  /* small audition button next to the record button */
  .solfege-audition-btn {
    width: 80px; height: 80px; border-radius: 50%;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,0.22), rgba(255,255,255,0.02) 65%),
      linear-gradient(135deg, rgba(110, 168, 255, 0.32), rgba(42, 90, 255, 0.2));
    border: 1.5px solid rgba(180, 210, 255, 0.45);
    color: #fff;
    font-size: 30px;
    cursor: pointer;
    font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 30px rgba(110, 168, 255, 0.35);
    transition: transform 0.2s ease;
  }
  .solfege-audition-btn:hover { transform: scale(1.06); }

  /* ============================================================
     S1 — Pitch tracker (THE distinctive S1 element)

     Justification: nothing in the canon represents *live audio
     input vs target pitch*. This is a vertical column showing
     the staff range with a horizontal line for the target pitch
     and a moving glowing dot for the sung pitch. The dot is
     positioned by --sung-y (% from top), the target by
     --target-y. A semitone-cents readout sits at the bottom.
     ============================================================ */
  .solfege-pitch-tracker {
    position: relative;
    width: 100%; max-width: 640px;
    height: 110px;
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid var(--glass-border);
    border-radius: 14px;
    overflow: hidden;
    padding: 10px 14px;
  }
  .solfege-pitch-tracker .pt-header {
    position: absolute;
    top: 8px; right: 14px; left: 14px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 10px; letter-spacing: 1px;
    color: var(--text-dim); text-transform: uppercase;
    pointer-events: none;
  }
  .solfege-pitch-tracker .pt-header .v {
    color: var(--accent-2); font-weight: 700; letter-spacing: 0;
  }
  .solfege-pitch-tracker .pt-track {
    position: absolute;
    top: 28px; left: 14px; right: 14px; bottom: 28px;
    background:
      linear-gradient(180deg,
        rgba(110, 168, 255, 0.04) 0%,
        rgba(110, 168, 255, 0.08) 50%,
        rgba(110, 168, 255, 0.04) 100%);
    border-radius: 8px;
    overflow: hidden;
  }
  /* horizontal target-pitch line */
  .solfege-pitch-tracker .pt-target-line {
    position: absolute;
    left: 0; right: 0;
    top: var(--target-y, 50%);
    height: 2px;
    background: rgba(255, 200, 100, 0.95);
    box-shadow: 0 0 12px rgba(255, 200, 100, 0.7);
  }
  .solfege-pitch-tracker .pt-target-label {
    position: absolute;
    left: 8px;
    top: calc(var(--target-y, 50%) - 9px);
    font-size: 10px; font-weight: 700;
    color: rgba(255, 220, 160, 0.95);
    padding: 1px 6px;
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.4);
    pointer-events: none;
  }
  /* sung pitch — moving dot with vertical guide line */
  .solfege-pitch-tracker .pt-sung-dot {
    position: absolute;
    left: var(--sung-x, 50%);
    top: var(--sung-y, 50%);
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent-2);
    box-shadow: 0 0 14px var(--accent-2), 0 0 28px rgba(110, 168, 255, 0.7);
    transform: translate(-50%, -50%);
  }
  .solfege-pitch-tracker .pt-sung-trace {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .solfege-pitch-tracker .pt-sung-trace path {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.55;
    filter: drop-shadow(0 0 4px rgba(110, 168, 255, 0.5));
  }
  /* cents readout */
  .solfege-pitch-tracker .pt-readout {
    position: absolute;
    bottom: 6px; left: 14px; right: 14px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px;
    color: var(--text-dim);
  }
  .solfege-pitch-tracker .pt-readout .pt-cents {
    color: var(--accent-2); font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .solfege-pitch-tracker .pt-readout .pt-cents.flat { color: #ffb56e; }
  .solfege-pitch-tracker .pt-readout .pt-cents.sharp { color: #ff8a8a; }
  .solfege-pitch-tracker .pt-readout .pt-cents.intune { color: #6fffa1; }

  /* ============================================================
     S1 — Self-rate buttons (correct / wrong)

     Justification: S1 ends with a "did you sing it right?"
     dialog. The React code uses tinted green/red CTA buttons
     — we mirror that with a chip variant that's strongly
     coloured rather than glassy.
     ============================================================ */
  .solfege-self-rate {
    display: flex; gap: 14px; justify-content: center;
    align-items: center; flex-wrap: wrap;
  }
  .solfege-self-rate .rate-btn {
    padding: 12px 28px;
    border-radius: 14px;
    font-size: 15px; font-weight: 700; font-family: inherit;
    cursor: pointer;
    border: 1.5px solid transparent;
    backdrop-filter: blur(8px);
    display: inline-flex; align-items: center; gap: 8px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .solfege-self-rate .rate-btn.correct {
    background: rgba(45, 187, 91, 0.25);
    border-color: rgba(120, 220, 160, 0.6);
    color: #d6ffe0;
    box-shadow: 0 0 22px rgba(45, 187, 91, 0.35);
  }
  .solfege-self-rate .rate-btn.correct:hover {
    background: rgba(45, 187, 91, 0.4);
    transform: translateY(-2px);
  }
  .solfege-self-rate .rate-btn.wrong {
    background: rgba(231, 76, 60, 0.2);
    border-color: rgba(255, 130, 130, 0.55);
    color: #ffdcd6;
    box-shadow: 0 0 22px rgba(231, 76, 60, 0.3);
  }
  .solfege-self-rate .rate-btn.wrong:hover {
    background: rgba(231, 76, 60, 0.35);
    transform: translateY(-2px);
  }

  /* ============================================================
     Settings strip (shared with melodic fragment) — uses
     `solfege-settings-strip` to keep the namespace local but
     visually matches the melodic one for consistency.
     ============================================================ */
  .solfege-settings-strip {
    width: 100%;
    max-width: 900px;
    border-top: 1px dashed rgba(180, 210, 255, 0.18);
    padding-top: 16px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .solfege-settings-strip .strip-title {
    font-size: 10px; letter-spacing: 1.5px;
    color: var(--text-dim); text-transform: uppercase;
  }

  /* ============================================================
     S2 — Solfège syllable chips

     Justification: the canon `.ans-chip` is a pill — fine for
     short text. For Do/Re/Mi/Fa/Sol/La/Ti we want the syllable
     bigger and we also want each chip to carry a small "scale-
     degree number" superscript (1, 2, 3…). The modifier
     `solfege-syllable-chip` adds that without breaking the
     canon styling.
     ============================================================ */
  .ex-answers.solfege-syllables-row {
    gap: 12px;
    max-width: 720px;
  }
  .ans-chip.solfege-syllable-chip {
    min-width: 78px;
    padding: 14px 18px 10px;
    border-radius: 14px;
    flex-direction: column;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 2px;
    font-size: 17px;
    line-height: 1.1;
  }
  .ans-chip.solfege-syllable-chip .syl-name {
    font-size: 17px; font-weight: 700; letter-spacing: 0.5px;
  }
  .ans-chip.solfege-syllable-chip .syl-degree {
    font-size: 10px; font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 1px;
  }
  .ans-chip.solfege-syllable-chip.active .syl-degree {
    color: var(--accent-2);
  }

  /* ============================================================
     standalone preview helpers (only used when opened alone)
     ============================================================ */
  .preview-section {
    position: relative;
    min-height: 100vh;
  }
  .preview-section + .preview-section {
    border-top: 1px dashed rgba(180, 210, 255, 0.12);
  }
  .preview-marker {
    position: absolute; top: 50px; left: 50%;
    transform: translateX(-50%);
    z-index: 75;
    background: rgba(0, 0, 0, 0.5);
    color: var(--accent-2);
    border: 1px solid rgba(180, 210, 255, 0.25);
    padding: 6px 16px; border-radius: 999px;
    font-size: 11px; letter-spacing: 1.2px;
    backdrop-filter: blur(10px);
  }


/* ============ guitar ============ */

  /* ---- Global Levels Drawer (shared with every section) ---- */
  .levels-trigger {
    position: fixed; top: 50px; left: 18px; z-index: 80;
    background: rgba(255,255,255,0.08);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 8px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: inherit; backdrop-filter: blur(10px);
    display: inline-flex; align-items: center; gap: 8px;
    transition: background 0.2s ease;
  }
  .levels-trigger:hover { background: rgba(255,255,255,0.16); }
  .levels-trigger .hamburger { font-size: 15px; line-height: 1; color: var(--accent-2); }
  .levels-trigger .current-level { color: var(--accent); font-weight: 700; }

  .levels-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(5, 13, 42, 0.55);
    backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .levels-overlay.open { opacity: 1; pointer-events: auto; }

  .levels-drawer {
    position: fixed; top: 0; bottom: 0; left: 0;
    width: min(380px, 90vw);
    z-index: 210;
