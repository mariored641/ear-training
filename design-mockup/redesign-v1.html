<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מוקאפ — אלתור בהישג יד</title>
<style>
  :root {
    --bg: #0d0e1a;
    --card: #161826;
    --accent: #7c5cbf;
    --accent2: #a97cf8;
    --gold: #f0c060;
    --text: #e8e0f0;
    --muted: #8880a0;
    --circle-size: 300px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    font-family: 'Segoe UI', Arial, sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 40px;
  }

  /* ═══ SELECTOR BAR ═══ */
  .selector-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    width: 100%;
    background: #0a0b14ee;
    backdrop-filter: blur(12px);
    border-bottom: 1px solid #ffffff18;
    padding: 12px 16px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .selector-bar .bar-label {
    width: 100%;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 6px;
  }
  .logo-btn {
    background: #ffffff0f;
    border: 1px solid #ffffff20;
    color: var(--muted);
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .logo-btn:hover { background: #ffffff18; color: var(--text); }
  .logo-btn.active {
    background: var(--accent);
    border-color: var(--accent2);
    color: #fff;
    box-shadow: 0 0 12px #7c5cbf80;
  }

  /* ═══ PHONE FRAME ═══ */
  .phone-frame {
    margin-top: 28px;
    width: 390px;
    background: var(--bg);
    border-radius: 40px;
    border: 1.5px solid #ffffff18;
    box-shadow: 0 30px 80px #00000080, 0 0 0 8px #0a0b14;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ═══ APP BAR ═══ */
  .app-bar {
    width: 100%;
    padding: 24px 24px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .app-title {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: .3px;
    color: var(--text);
  }
  .app-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: #ffffff0f;
    border: 1px solid #ffffff18;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; cursor: pointer;
  }

  /* ═══ LEVEL CHIPS ═══ */
  .level-strip {
    display: flex; gap: 8px; padding: 4px 24px 16px;
    justify-content: flex-end; width: 100%;
  }
  .chip {
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .chip.active { background: var(--accent); color: #fff; }
  .chip:not(.active) { background: #ffffff10; color: var(--muted); border: 1px solid #ffffff18; }

  /* ═══ MAIN CIRCLE ═══ */
  .circle-wrapper {
    position: relative;
    width: var(--circle-size);
    height: var(--circle-size);
    margin: 20px auto 28px;
    cursor: pointer;
  }
  .circle-outer {
    position: absolute; inset: -12px;
    border-radius: 50%;
    background: conic-gradient(from 180deg, #7c5cbf40, #a97cf830, #f0c06020, #7c5cbf40);
    animation: spin 8s linear infinite;
    opacity: .7;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .circle-glow {
    position: absolute; inset: -24px;
    border-radius: 50%;
    background: radial-gradient(circle, #7c5cbf28 0%, transparent 70%);
  }
  .circle-main {
    position: absolute; inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #2a1e50, #0f0f1e 70%);
    border: 1.5px solid #ffffff28;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }

  /* ═══ LOGO INSIDE CIRCLE ═══ */
  .logo-in-circle {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    border-radius: 50%;
  }
  .logo-in-circle img {
    width: 65%;
    height: 65%;
    object-fit: contain;
    transition: all .35s ease;
  }

  /* play icon overlay */
  .play-icon {
    position: relative; z-index: 5;
    width: 52px; height: 52px;
    border-radius: 50%;
    background: #ffffffcc;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    box-shadow: 0 4px 20px #00000060;
    transition: transform .15s;
  }
  .circle-wrapper:hover .play-icon { transform: scale(1.1); }
  .play-icon span { margin-right: -3px; }

  /* ═══ STATUS TEXT ═══ */
  .status-area {
    text-align: center;
    padding: 0 24px 24px;
  }
  .status-label { font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  .status-value { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: .5px; }

  /* ═══ ANSWER BUTTONS ═══ */
  .answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 0 24px 28px;
    width: 100%;
  }
  .ans-btn {
    background: #ffffff0a;
    border: 1px solid #ffffff18;
    border-radius: 14px;
    padding: 14px 10px;
    text-align: center;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
    transition: all .15s;
  }
  .ans-btn:hover { background: #7c5cbf40; border-color: var(--accent); }
  .ans-btn.correct { background: #1a4a2a; border-color: #4caf50; color: #7fff97; }
  .ans-btn .interval { font-weight: 700; font-size: 16px; display: block; }
  .ans-btn .note { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* ═══ SCORE BAR ═══ */
  .score-bar {
    width: calc(100% - 48px);
    margin: 0 24px 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .score-label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .progress-track {
    flex: 1; height: 5px; background: #ffffff18; border-radius: 3px;
  }
  .progress-fill {
    width: 60%; height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold));
    border-radius: 3px;
  }
  .score-num { font-size: 13px; font-weight: 600; color: var(--gold); }

  /* ═══ BOTTOM NAV ═══ */
  .bottom-nav {
    width: 100%;
    display: flex;
    border-top: 1px solid #ffffff12;
    padding: 14px 0 10px;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; gap: 4px; cursor: pointer;
  }
  .nav-icon { font-size: 20px; }
  .nav-label { font-size: 10px; color: var(--muted); }
  .nav-item.active .nav-label { color: var(--accent2); }
  .nav-item.active .nav-icon { filter: drop-shadow(0 0 4px var(--accent2)); }

  /* ═══ LOGO STYLE VARIANTS ═══ */

  /* 1 — centered, full opacity */
  .logo-in-circle.style-centered img {
    width: 62%; height: 62%; opacity: 1;
    mix-blend-mode: normal;
  }

  /* 2 — watermark, very faint */
  .logo-in-circle.style-watermark img {
    width: 78%; height: 78%; opacity: .18;
    mix-blend-mode: normal;
    filter: none;
  }

  /* 3 — semi transparent 50% */
  .logo-in-circle.style-semi img {
    width: 66%; height: 66%; opacity: .5;
    mix-blend-mode: normal;
  }

  /* 4 — white logo + glow */
  .logo-in-circle.style-white-glow img {
    width: 60%; height: 60%; opacity: .9;
    mix-blend-mode: normal;
    filter: drop-shadow(0 0 14px #ffffffa0) drop-shadow(0 0 6px #a97cf8cc);
  }

  /* 5 — blend mode: screen */
  .logo-in-circle.style-screen img {
    width: 80%; height: 80%; opacity: .85;
    mix-blend-mode: screen;
  }

  /* 6 — blend mode: overlay */
  .logo-in-circle.style-overlay img {
    width: 80%; height: 80%; opacity: .7;
    mix-blend-mode: overlay;
  }

  /* 7 — diagonal, large */
  .logo-in-circle.style-diagonal img {
    width: 90%; height: 90%; opacity: .65;
    mix-blend-mode: normal;
    transform: rotate(-8deg);
  }

  /* 8 — full fill, circular crop */
  .logo-in-circle.style-fill img {
    width: 100%; height: 100%; opacity: 1;
    object-fit: cover;
    mix-blend-mode: normal;
  }

  /* ═══ DESCRIPTION BADGE ═══ */
  .style-desc {
    margin: 8px 0 0;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    min-height: 16px;
  }
</style>
</head>

const container = document.getElementById('logoContainer');
const logoImg   = document.getElementById('logoImg');
const styleDesc = document.getElementById('styleDesc');

document.querySelectorAll('.logo-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.logo-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const style = btn.dataset.style;
    const src   = btn.dataset.src;
    const desc  = btn.dataset.desc;

    // swap image source
    logoImg.src = IMGS[src];

    // swap CSS class
    container.className = 'logo-in-circle style-' + style;

    // update description
    styleDesc.textContent = desc;
  });
});
</script>
