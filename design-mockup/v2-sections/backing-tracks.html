<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Backing Tracks Fragment — v2</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

<!-- ============================================================
     CANON BASE — copied verbatim from redesign-v1.html so this
     fragment opens standalone. Master assembler may strip and
     replace with its own copy.
     ============================================================ -->
<style id="canon-base">
  :root {
    --bg-deep:    #050d2a;
    --bg-mid:     #0a1f5c;
    --bg-light:   #2a5aff;
    --accent:     #6ea8ff;
    --accent-2:   #b8d4ff;
    --text:       #eaf2ff;
    --text-dim:   #9fb4d6;
    --orb-bg:     rgba(255, 255, 255, 0.06);
    --orb-border: rgba(180, 210, 255, 0.25);
    --orb-glow:   rgba(110, 168, 255, 0.35);
    --glass-bg:   rgba(255, 255, 255, 0.06);
    --glass-border: rgba(180, 210, 255, 0.22);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    font-family: 'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--text);
  }
  body {
    position: relative;
    background: radial-gradient(ellipse at 50% 60%, #0d2a7a 0%, #050d2a 70%);
  }

  /* ===== Aurora background ===== */
  .aurora {
    position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none;
  }
  .blob {
    position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.55; will-change: transform;
  }
  .blob-1 {
    width: 50vmax; height: 50vmax;
    background: radial-gradient(circle, #2a5aff 0%, transparent 70%);
    top: -10%; left: -10%; animation: drift1 22s ease-in-out infinite alternate;
  }
  .blob-2 {
    width: 45vmax; height: 45vmax;
    background: radial-gradient(circle, #4b8bff 0%, transparent 70%);
    bottom: -15%; right: -10%; animation: drift2 28s ease-in-out infinite alternate;
  }
  .blob-3 {
    width: 35vmax; height: 35vmax;
    background: radial-gradient(circle, #6ea8ff 0%, transparent 70%);
    top: 30%; right: 20%; opacity: 0.35; animation: drift3 18s ease-in-out infinite alternate;
  }
  @keyframes drift1 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(20vw,10vh) scale(1.15)} 100%{transform:translate(10vw,25vh) scale(0.95)} }
  @keyframes drift2 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(-15vw,-10vh) scale(1.1)} 100%{transform:translate(-25vw,5vh) scale(0.9)} }
  @keyframes drift3 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(-20vw,15vh) scale(1.2)} 100%{transform:translate(15vw,-10vh) scale(0.85)} }

  .stars {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 12% 28%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 78% 64%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 35% 75%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 88% 18%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 55% 42%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.5px 1.5px at 22% 88%, rgba(255,255,255,0.5), transparent);
  }

  /* ===== Top bar ===== */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 90;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    font-size: 12px;
  }
  .top-bar .label { opacity: 0.7; letter-spacing: 0.3px; }
  .top-bar .crumb { color: var(--accent-2); font-weight: 500; }
  .top-bar .crumb span { opacity: 0.5; margin: 0 6px; }

  /* ===== Back pill ===== */
  .back-pill {
    position: fixed; top: 50px; right: 18px; z-index: 80;
    background: rgba(255,255,255,0.08);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 8px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    font-family: inherit; backdrop-filter: blur(10px);
    transition: background 0.2s ease;
  }
  .back-pill:hover { background: rgba(255,255,255,0.16); }

  /* ===== Tool screens ===== */
  .tool-stage {
    position: relative; z-index: 1;
    min-height: 100vh; width: 100vw;
    padding: 80px 24px 32px;
    color: var(--text);
  }
  .tool-stage .container {
    max-width: 1180px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 18px;
  }
  .tool-title {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    text-align: center;
  }
  .tool-title h1 {
    margin: 0; font-size: clamp(24px, 3.6vmin, 32px); font-weight: 700;
  }
  .tool-title p { margin: 0; color: var(--text-dim); font-size: 14px; }

  .tool-card {
    background: var(--glass-bg);
    border: 1.5px solid var(--glass-border);
    backdrop-filter: blur(10px);
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
  }
  .tool-card h3 {
    margin: 0 0 12px 0; font-size: 14px;
    color: var(--text-dim); letter-spacing: 0.5px;
    text-transform: uppercase; font-weight: 600;
  }

  /* ── Canon: chord-grid / chord-bar (used as the editor visual) ── */
  .chord-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  .chord-bar {
    background: rgba(110, 168, 255, 0.08);
    border: 1.5px solid rgba(110, 168, 255, 0.25);
    border-radius: 12px;
    padding: 18px 8px; text-align: center;
    font-size: 22px; font-weight: 700;
    transition: all 0.2s ease;
    cursor: pointer;
    position: relative;
  }
  .chord-bar:hover {
    background: rgba(110, 168, 255, 0.15);
    border-color: rgba(180, 210, 255, 0.5);
  }
  .chord-bar.active {
    background: rgba(110, 168, 255, 0.3);
    border-color: var(--accent);
    box-shadow: 0 0 22px rgba(110, 168, 255, 0.55);
  }
  .chord-bar .beats {
    display: block; font-size: 10px;
    color: var(--text-dim); margin-top: 4px; font-weight: 400;
  }

  /* ── Canon: transport ── */
  .transport {
    display: flex; gap: 10px; align-items: center; justify-content: center;
  }
  .transport button {
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1.5px solid var(--glass-border);
    color: var(--text); font-size: 22px;
    cursor: pointer; font-family: inherit;
    transition: all 0.2s;
  }
  .transport button.play {
    width: 64px; height: 64px; font-size: 26px;
    background: var(--bg-light); border-color: var(--accent);
    box-shadow: 0 0 30px rgba(110, 168, 255, 0.5);
  }
  .transport button:hover { transform: scale(1.06); }
  .transport button.active {
    background: rgba(110, 168, 255, 0.25);
    border-color: var(--accent);
    color: var(--accent-2);
  }

  /* ── Canon: control-row / select-pill ── */
  .control-row {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .select-pill {
    background: rgba(255,255,255,0.06);
    border: 1.5px solid var(--glass-border);
    color: var(--text);
    padding: 6px 14px; border-radius: 999px;
    font-size: 13px; font-family: inherit;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .select-pill:hover { background: rgba(255,255,255,0.1); }
  .select-pill.active {
    background: rgba(110, 168, 255, 0.25);
    border-color: var(--accent);
  }
  .select-pill .v { color: var(--accent); font-weight: 600; margin-inline-start: 6px; }
  .select-pill .caret { color: var(--text-dim); font-size: 10px; }

  /* ── Canon: fretboard ── */
  .fretboard {
    background: linear-gradient(180deg, #20242c, #14171c);
    border: 1.5px solid rgba(180,210,255,0.18);
    border-radius: 14px;
    padding: 16px 14px;
    position: relative;
    overflow-x: auto;
  }
  .fb-grid {
    display: grid; gap: 4px;
    grid-template-columns: 30px repeat(14, 1fr);
  }
  .fb-cell {
    height: 28px; position: relative;
    border-right: 1px solid rgba(255,255,255,0.08);
  }
  .fb-cell.nut { border-right: 3px solid rgba(255,255,255,0.6); }
  .fb-cell.fret-num {
    background: transparent; border: none;
    color: var(--text-dim); font-size: 11px;
    display: flex; align-items: center; justify-content: center;
    height: 20px;
  }
  .fb-string { color: var(--text-dim); font-size: 11px;
    display: flex; align-items: center; justify-content: center; }
  .fb-dot {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 18px; height: 18px; border-radius: 50%;
    background: rgba(180, 210, 255, 0.35);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; color: #fff;
  }
  .fb-dot.root { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .fb-dot.arp  {
    background: rgba(120, 220, 255, 0.85);
    box-shadow: 0 0 14px rgba(120, 220, 255, 0.85),
                inset 0 0 6px rgba(255, 255, 255, 0.4);
    border: 1.5px solid rgba(180, 240, 255, 0.95);
  }

  /* misc */
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 720px) { .row-2 { grid-template-columns: 1fr; } }

  /* preview helpers */
  .preview-section {
    position: relative;
    min-height: 100vh;
  }
  .preview-marker {
    position: absolute; top: 50px; left: 50%;
    transform: translateX(-50%);
    z-index: 75;
    background: rgba(0, 0, 0, 0.5);
    color: var(--accent-2);
    border: 1px solid rgba(180, 210, 255, 0.25);
    padding: 6px 16px; border-radius: 999px;
    font-size: 11px; letter-spacing: 1.2px;
    backdrop-filter: blur(10px);
  }
</style>

<!-- ============================================================
     SECTION STYLES — Backing-Tracks fragment additions
     All new classes prefixed `backing-`. The shared `.preset-drawer`
     is the same family as the `.levels-drawer` from melodic.html,
     but slides from the LEFT (mirrored RTL → right edge of screen).
     ============================================================ -->
<style id="section-backing-tracks">

  /* ============================================================
     1.  TOP CONTROL BAR — key / style / tempo / preset library
     ============================================================ */
  /* All controls reuse `.select-pill`; only the "key" pill needs a
     larger affordance because it carries Root + Maj/Min. */
  .backing-top-bar {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
    padding: 14px 18px;
    background: rgba(255,255,255,0.04);
    border: 1.5px solid var(--glass-border);
    border-radius: 16px;
    backdrop-filter: blur(10px);
  }
  .backing-top-bar-group {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }

  /* The "Key" pill is slightly larger, with two visible parts (root | quality) */
  .backing-key-pill {
    background: rgba(110, 168, 255, 0.15);
    border: 1.5px solid rgba(110, 168, 255, 0.5);
    color: var(--text);
    padding: 8px 16px; border-radius: 999px;
    font-size: 14px; font-family: inherit; font-weight: 600;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    transition: all 0.2s ease;
  }
  .backing-key-pill:hover {
    background: rgba(110, 168, 255, 0.25);
    box-shadow: 0 0 14px rgba(110, 168, 255, 0.35);
  }
  .backing-key-pill .key-icon { font-size: 16px; }
  .backing-key-pill .key-root { color: var(--accent-2); font-weight: 800; }
  .backing-key-pill .key-sep  { color: var(--text-dim); opacity: 0.5; }
  .backing-key-pill .key-qual { color: var(--accent); font-weight: 600; }
  .backing-key-pill .caret    { color: var(--text-dim); margin-inline-start: 4px; font-size: 10px; }

  /* Tempo stepper inline */
  .backing-tempo {
    display: inline-flex; align-items: center;
    background: rgba(255,255,255,0.06);
    border: 1.5px solid var(--glass-border);
    border-radius: 999px;
    overflow: hidden;
  }
  .backing-tempo-btn {
    background: transparent; border: none;
    color: var(--text); font-family: inherit; font-size: 18px; font-weight: 600;
    width: 32px; height: 32px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .backing-tempo-btn:hover { background: rgba(110, 168, 255, 0.2); }
  .backing-tempo-value {
    padding: 0 14px;
    font-size: 13px; font-weight: 600;
    color: var(--text);
    border-left: 1px solid var(--glass-border);
    border-right: 1px solid var(--glass-border);
    line-height: 32px; min-width: 90px; text-align: center;
  }
  .backing-tempo-value .bpm-tag {
    color: var(--text-dim); font-size: 10px; margin-inline-start: 4px;
    letter-spacing: 0.6px; font-weight: 500;
  }

  /* Preset Library trigger — emphasis as the primary entry point */
  .backing-preset-trigger {
    background: linear-gradient(135deg, rgba(110, 168, 255, 0.25), rgba(42, 90, 255, 0.15));
    border: 1.5px solid rgba(180, 210, 255, 0.5);
    color: var(--text);
    padding: 8px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 600; font-family: inherit;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    box-shadow: 0 0 14px rgba(110, 168, 255, 0.25);
    transition: all 0.2s ease;
  }
  .backing-preset-trigger:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 22px rgba(110, 168, 255, 0.5);
  }
  .backing-preset-trigger .count-badge {
    background: rgba(255,255,255,0.15);
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 11px;
    color: var(--accent-2);
    font-weight: 700;
  }

  /* ============================================================
     2.  KEY DROPDOWN — anchored under the key pill (mocked open)
     ============================================================ */
  .backing-key-dropdown {
    position: absolute;
    top: calc(100% + 6px); right: 0;
    width: 280px;
    background: linear-gradient(180deg, rgba(13, 42, 122, 0.95), rgba(10, 31, 92, 0.97));
    border: 1.5px solid var(--glass-border);
    border-radius: 16px;
    padding: 14px;
    backdrop-filter: blur(16px);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    z-index: 50;
    display: none;
  }
  .backing-key-dropdown.open { display: block; }
  .backing-key-dropdown-title {
    font-size: 10px; letter-spacing: 1.5px;
    color: var(--text-dim); text-transform: uppercase;
    margin-bottom: 8px;
  }
  .backing-key-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    margin-bottom: 12px;
  }
  .backing-key-cell {
    background: rgba(255,255,255,0.05);
    border: 1.5px solid transparent;
    color: var(--text);
    padding: 8px 0;
    border-radius: 10px;
    font-size: 13px; font-weight: 600;
    text-align: center;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
  }
  .backing-key-cell:hover {
    background: rgba(110, 168, 255, 0.15);
    border-color: rgba(180, 210, 255, 0.3);
  }
  .backing-key-cell.active {
    background: rgba(110, 168, 255, 0.35);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 12px rgba(110, 168, 255, 0.55);
  }
  .backing-key-qual-row {
    display: flex; gap: 6px;
    background: rgba(0,0,0,0.25);
    border-radius: 10px;
    padding: 4px;
  }
  .backing-key-qual-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 8px 0; border-radius: 8px;
    font-size: 13px; font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .backing-key-qual-btn.active {
    background: var(--bg-light);
    color: #fff;
    box-shadow: 0 2px 8px rgba(110, 168, 255, 0.4);
  }

  .backing-pos-wrapper { position: relative; }

  /* ============================================================
     3.  PRESET LIBRARY PANEL — slides from RIGHT (RTL view)
     ============================================================ */
  .backing-preset-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(5, 13, 42, 0.55);
    backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .backing-preset-overlay.open { opacity: 1; pointer-events: auto; }

  .backing-preset-panel {
    position: fixed; top: 0; bottom: 0; right: 0;
    width: min(420px, 92vw);
    z-index: 210;
    background: linear-gradient(180deg, rgba(13, 42, 122, 0.92), rgba(10, 31, 92, 0.96));
    border-left: 1.5px solid var(--glass-border);
    backdrop-filter: blur(16px);
    box-shadow: -4px 0 40px rgba(0, 0, 0, 0.5);
    transform: translateX(105%);
    transition: transform 0.32s cubic-bezier(0.2, 0.7, 0.2, 1);
    display: flex; flex-direction: column;
    direction: rtl;
  }
  .backing-preset-panel.open { transform: translateX(0); }

  .backing-preset-header {
    padding: 18px 20px 14px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(180, 210, 255, 0.12);
  }
  .backing-preset-title {
    margin: 0;
    font-size: 17px; font-weight: 700;
    color: var(--text);
    display: flex; align-items: center; gap: 10px;
  }
  .backing-preset-title .count-tag {
    font-size: 11px; letter-spacing: 1px;
    color: var(--accent);
    padding: 3px 8px; border-radius: 6px;
    background: rgba(110, 168, 255, 0.15);
    border: 1px solid rgba(110, 168, 255, 0.3);
  }
  .backing-preset-close {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-dim);
    width: 32px; height: 32px;
    border-radius: 50%;
    font-size: 16px; cursor: pointer;
    font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease;
  }
  .backing-preset-close:hover { background: rgba(255,255,255,0.14); color: var(--text); }

  .backing-preset-search-row {
    padding: 12px 16px;
    display: flex; gap: 8px; align-items: center;
    border-bottom: 1px solid rgba(180, 210, 255, 0.08);
  }
  .backing-preset-search {
    flex: 1;
    background: rgba(0,0,0,0.25);
    border: 1.5px solid var(--glass-border);
    color: var(--text);
    padding: 9px 14px; border-radius: 12px;
    font-size: 13px; font-family: inherit;
    direction: rtl;
  }
  .backing-preset-search::placeholder { color: var(--text-dim); }
  .backing-preset-search:focus {
    outline: none;
    border-color: var(--accent);
    background: rgba(0,0,0,0.4);
  }
  .backing-preset-fav-btn {
    background: rgba(255,255,255,0.04);
    border: 1.5px solid var(--glass-border);
    color: var(--text-dim);
    padding: 8px 14px;
    border-radius: 12px;
    font-size: 13px; font-family: inherit;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .backing-preset-fav-btn.active {
    background: rgba(255, 200, 80, 0.18);
    border-color: rgba(255, 200, 80, 0.5);
    color: #ffd575;
  }

  .backing-preset-info-strip {
    padding: 10px 18px;
    font-size: 11px;
    color: var(--text-dim);
    border-bottom: 1px solid rgba(180, 210, 255, 0.06);
    display: flex; gap: 10px; align-items: center;
  }
  .backing-preset-info-strip .count {
    color: var(--accent-2); font-weight: 600;
  }
  .backing-preset-info-strip .auto-switch {
    color: rgba(255, 200, 130, 0.95);
    font-size: 10px;
    background: rgba(255, 180, 100, 0.1);
    border: 1px solid rgba(255, 180, 100, 0.25);
    padding: 2px 8px;
    border-radius: 6px;
    margin-inline-start: auto;
  }

  .backing-preset-list {
    flex: 1; overflow-y: auto;
    padding: 8px 10px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .backing-preset-list::-webkit-scrollbar { width: 6px; }
  .backing-preset-list::-webkit-scrollbar-thumb {
    background: rgba(180, 210, 255, 0.2);
    border-radius: 3px;
  }

  .backing-preset-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    background: rgba(255, 255, 255, 0.03);
    border: 1.5px solid transparent;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .backing-preset-item:hover {
    background: rgba(110, 168, 255, 0.1);
    border-color: rgba(180, 210, 255, 0.2);
  }
  .backing-preset-item.featured {
    background: rgba(110, 168, 255, 0.12);
    border-color: rgba(110, 168, 255, 0.35);
  }
  .backing-preset-fav-star {
    background: transparent; border: none;
    color: var(--text-dim);
    font-size: 18px; cursor: pointer;
    padding: 0; line-height: 1;
    flex-shrink: 0;
    transition: color 0.15s ease;
  }
  .backing-preset-fav-star.starred { color: #ffd575; }

  .backing-preset-item-info {

  .backing-bars-stepper .label {

  .backing-layout-pill.active {

  /* Half-bar split: two chords inside one bar */
  .chord-bar.split {
    padding: 12px 6px;
    display: flex; flex-direction: column; gap: 6px;

  .chord-bar .split-row {
    display: grid; grid-template-columns: 1fr 1fr;

  .chord-bar .split-half {
    background: rgba(110, 168, 255, 0.1);
    border: 1px solid rgba(110, 168, 255, 0.2);
    border-radius: 8px;
    padding: 8px 4px;
    font-size: 17px; font-weight: 700;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .chord-bar .split-half:hover {
    background: rgba(110, 168, 255, 0.2);
    border-color: var(--accent);
  }
  .chord-bar .split-half.active {
    background: rgba(110, 168, 255, 0.35);
    border-color: var(--accent);
    box-shadow: 0 0 12px rgba(110, 168, 255, 0.6);
  }

  /* Bar number badge in top-right of each chord-bar */
  .chord-bar .bar-num {
    position: absolute; top: 4px; inset-inline-start: 6px;
    font-size: 9px; font-weight: 700; color: var(--text-dim);
    letter-spacing: 0.5px;
  }

  /* Add-bar tile — uses .chord-bar shell with a different visual */
  .chord-bar.add-bar {
    background: transparent;
    border: 1.5px dashed rgba(180, 210, 255, 0.3);
    color: var(--text-dim);

  .chord-bar.add-bar:hover {

  /* Time-signature mini-badge above the grid */
  .backing-time-sig-row {

  .backing-time-sig-row .badge .v {
    color: var(--accent); font-weight: 700;
    margin-inline-start: 4px;
  }

  /* ============================================================
     5.  TRANSPORT — extends canon .transport
     ============================================================ */
  .backing-transport-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 10px;

  .backing-transport-status {
    display: flex; gap: 14px; align-items: center;
    font-size: 12px; color: var(--text-dim);
  }
  .backing-transport-status .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    animation: pulseDot 1s ease-in-out infinite;
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 0.4; transform: scale(0.85); }
    50%      { opacity: 1; transform: scale(1.2); }
  }
  .backing-transport-status .now-playing {
    color: var(--accent-2); font-weight: 700;
  }
  .backing-loop-badge {
    color: var(--accent);
    font-size: 11px; font-weight: 700;
    background: rgba(110, 168, 255, 0.15);
    border: 1px solid rgba(110, 168, 255, 0.35);
    padding: 2px 8px;
    border-radius: 999px;
  }

  /* ============================================================
     6.  LIVE FRETBOARD PANEL — extends canon .fretboard
     ============================================================ */
  .backing-fretboard-header {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 10px;
    margin-bottom: 14px;
  }
  .backing-fretboard-header h3 {
    margin: 0; font-size: 14px;
    color: var(--text-dim); letter-spacing: 0.5px;
    text-transform: uppercase; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .backing-fretboard-header h3 .now-chord {
    color: var(--accent);
    font-weight: 800; text-transform: none;
    font-size: 16px; letter-spacing: 0;
    padding: 3px 10px;
    background: rgba(110, 168, 255, 0.15);
    border: 1px solid rgba(110, 168, 255, 0.4);
    border-radius: 8px;
    box-shadow: 0 0 12px rgba(110, 168, 255, 0.3);
  }
  .backing-fretboard-controls {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }

  /* Legend strip under fretboard */
  .backing-fretboard-legend {
    display: flex; gap: 18px; justify-content: center;
    margin-top: 12px;
    font-size: 11px; color: var(--text-dim);
  }
  .backing-legend-item {
    display: inline-flex; align-items: center; gap: 6px;
  }
  .backing-legend-dot {
    width: 12px; height: 12px; border-radius: 50%;

  }
  .backing-legend-dot.scale {
    background: rgba(180, 210, 255, 0.35);
  }
  .backing-legend-dot.arp {
    background: rgba(120, 220, 255, 0.85);
    box-shadow: 0 0 8px rgba(120, 220, 255, 0.7);

  .backing-legend-dot.root {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  /* Polyscale mini-strip (one cell per bar) */
  .backing-polyscale-strip {
    margin-top: 14px;
    padding: 12px;
    background: rgba(255, 180, 100, 0.06);
    border: 1px dashed rgba(255, 200, 130, 0.3);
    border-radius: 12px;
  }
  .backing-polyscale-strip .strip-title {
    font-size: 10px; letter-spacing: 1.2px;
    color: rgba(255, 200, 130, 0.95); text-transform: uppercase;
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .backing-polyscale-cells {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
  }
  .backing-polyscale-cell {
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    padding: 8px 4px;
    text-align: center;

    transition: all 0.15s ease;
  }
  .backing-polyscale-cell:hover {
    background: rgba(255, 180, 100, 0.12);
    border-color: rgba(255, 200, 130, 0.5);

  .backing-polyscale-cell.current {

  .backing-polyscale-cell .cell-bar {

  .backing-polyscale-cell .cell-chord {
    font-size: 13px; font-weight: 700; color: var(--text);

  }
  .backing-polyscale-cell .cell-scale {
    font-size: 10px; color: rgba(255, 200, 130, 0.85);
    margin-top: 3px;
  }

  /* ============================================================
     7.  SF2 LOADER STATUS (mocked, hidden by default)
     ============================================================ */
  .backing-status-bar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px;
    background: rgba(110, 168, 255, 0.12);
    border: 1px solid rgba(110, 168, 255, 0.3);

    font-size: 12px; color: var(--accent-2);
  }
  .backing-status-bar .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(180, 210, 255, 0.25);
    border-top-color: var(--accent);

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>

<!-- ============================================================
     RENDERERS
     ============================================================ -->
<script>
  // ===== Mock data =====
  const KEY_ROOTS = ['C', 'G', 'D', 'A', 'E', 'B', 'F#', 'Db', 'Ab', 'Eb', 'Bb', 'F'];

  const MOCK_PRESETS = [
    { title: 'Autumn Leaves',     composer: 'Joseph Kosma',      key: { root: 'G', type: 'minor' }, style: 'Medium Swing',      tempo: 130, ts: '4/4', fav: true },
    { title: 'All The Things You Are', composer: 'Jerome Kern',  key: { root: 'Ab', type: 'major' }, style: 'Medium Swing',     tempo: 130, ts: '4/4', fav: false },
    { title: 'So What',           composer: 'Miles Davis',       key: { root: 'D', type: 'minor' }, style: 'Cool Swing',        tempo: 134, ts: '4/4', fav: true },
    { title: 'Blue Bossa',        composer: 'Kenny Dorham',      key: { root: 'C', type: 'minor' }, style: 'Bossa Nova',        tempo: 150, ts: '4/4', fav: false },
    { title: 'Take Five',         composer: 'Paul Desmond',      key: { root: 'Eb', type: 'minor' }, style: 'Cool Swing',       tempo: 174, ts: '5/4', fav: false, tsWarn: true },
    { title: 'Someday My Prince Will Come', composer: 'Frank Churchill', key: { root: 'Bb', type: 'major' }, style: 'Jazz Waltz', tempo: 140, ts: '3/4', fav: false, autoSwitch: true },
    { title: 'Round Midnight',    composer: 'Thelonious Monk',   key: { root: 'Eb', type: 'minor' }, style: 'Ballad',           tempo: 60,  ts: '4/4', fav: true },
    { title: 'Footprints',        composer: 'Wayne Shorter',     key: { root: 'C', type: 'minor' }, style: 'Jazz Waltz',        tempo: 140, ts: '6/4', fav: false, autoSwitch: true },
    { title: 'Giant Steps',       composer: 'John Coltrane',     key: { root: 'B', type: 'major' }, style: 'Medium Swing',      tempo: 290, ts: '4/4', fav: false },
    { title: 'Stella By Starlight', composer: 'Victor Young',    key: { root: 'Bb', type: 'major' }, style: 'Medium Swing',     tempo: 145, ts: '4/4', fav: false }
  ];

  // Autumn Leaves chord progression (A section, 8 bars + B section start)
  // Bars 1-7 = whole bars (4 beats), bar 8 = half-bar split (2+2 beats)
  const MOCK_CHORDS = [
    { name: 'Cm7',    beats: 4 },
    { name: 'F7',     beats: 4 },
    { name: 'Bb△7',   beats: 4 },
    { name: 'Eb△7',   beats: 4 },
    { name: 'Am7♭5',  beats: 4 },
    { name: 'D7',     beats: 4 },
    { name: 'Gm',     beats: 4 },
    { name: 'D7',     beats: 2 },
    { name: 'Gm',     beats: 2 },
    { name: 'Cm7',    beats: 4 },
    { name: 'F7',     beats: 4 },
    { name: 'Bb△7',   beats: 4 }
  ];

  // ===== Top control bar =====
  function renderTopBar() {
    return `
      <div class="backing-top-bar">
        <div class="backing-top-bar-group">

          <!-- Key pill with anchored dropdown -->
          <div class="backing-pos-wrapper">
            <button class="backing-key-pill" onclick="toggleKeyDropdown(event)" id="bt-key-pill">
              <span class="key-icon">🎹</span>
              <span class="key-root" id="bt-key-root">C</span>
              <span class="key-sep">·</span>
              <span class="key-qual" id="bt-key-qual">Maj</span>
              <span class="caret">▼</span>
            </button>
            <!-- Dropdown (hidden until clicked) -->
            <div class="backing-key-dropdown" id="bt-key-dropdown">
              <div class="backing-key-dropdown-title">Root</div>
              <div class="backing-key-grid">
                ${KEY_ROOTS.map(r =>
                  `<button class="backing-key-cell${r === 'C' ? ' active' : ''}" onclick="setKeyRoot('${r}', event)">${r}</button>`
                ).join('')}
              </div>
              <div class="backing-key-dropdown-title">Quality</div>
              <div class="backing-key-qual-row">
                <button class="backing-key-qual-btn active" onclick="setKeyQual('Maj', event)">Major</button>
                <button class="backing-key-qual-btn" onclick="setKeyQual('Min', event)">Minor</button>
              </div>
            </div>
          </div>

          <!-- Style pill -->
          <button class="select-pill" onclick="alert('Style picker (mock): Jazz · Bossa · Samba · Jazz Waltz · 5 categories × 9-11 sub-styles')">
            🎵 <strong>Style:</strong> <span class="v">Medium Swing</span> <span class="caret">▼</span>
          </button>

          <!-- Tempo stepper -->
          <div class="backing-tempo">
            <button class="backing-tempo-btn" onclick="bumpTempo(-1)" title="−1 BPM">−</button>
            <div class="backing-tempo-value">
              <span id="bt-tempo-val">130</span><span class="bpm-tag">BPM</span>
            </div>
            <button class="backing-tempo-btn" onclick="bumpTempo(1)" title="+1 BPM">+</button>
          </div>

          <!-- Repeats -->
          <button class="select-pill" onclick="alert('Loop count picker (mock): 0 = infinite, 1-20 = fixed')">
            ↻ <strong>Loops:</strong> <span class="v">∞</span>
          </button>
        </div>

        <div class="backing-top-bar-group">
          <!-- Preset Library trigger -->
          <button class="backing-preset-trigger" onclick="openPresetPanel()" title="פתח ספריית פרסטים">
            <span>📚</span>
            <span>ספריית פרסטים</span>
            <span class="count-badge">1,460</span>
          </button>
        </div>
      </div>
    `;
  }

  // ===== Preset Library panel =====
  function renderPresetPanel() {
    const items = MOCK_PRESETS.map((s, i) => {
      const isFeatured = s.title === 'Autumn Leaves';
      const keyLabel = `${s.key.root}${s.key.type === 'minor' ? 'm' : ''}`;
      const tsWarn = s.tsWarn ? `<span class="ts-warn">⚠️ ${s.ts} → 4/4</span>` : '';
      const autoSw = s.autoSwitch ? `<span class="ts-warn" style="color:rgba(150, 220, 255, 0.95); background:rgba(110, 168, 255, 0.12); border-color:rgba(110, 168, 255, 0.3)">${s.ts} → Jazz Waltz</span>` : '';
      return `
        <div class="backing-preset-item${isFeatured ? ' featured' : ''}" onclick="loadPreset('${s.title}')">
          <button class="backing-preset-fav-star${s.fav ? ' starred' : ''}" onclick="toggleFav(event, '${s.title}')">★</button>
          <div class="backing-preset-item-info">
            <span class="backing-preset-item-title">${s.title}</span>
            <span class="backing-preset-item-meta">
              ${s.composer}
              <span class="key">· ${keyLabel} ·</span>
              <span class="style">${s.style}</span>
              ${tsWarn}${autoSw}
            </span>
          </div>
          <span class="backing-preset-item-tempo">${s.tempo}♩</span>
        </div>
      `;
    }).join('');

    return `
      <div class="backing-preset-overlay" id="bt-preset-overlay" onclick="closePresetPanel()"></div>
      <aside class="backing-preset-panel" id="bt-preset-panel" role="dialog" aria-label="ספריית פרסטים">

        <div class="backing-preset-header">
          <h3 class="backing-preset-title">
            <span>📚 ספריית פרסטים</span>
            <span class="count-tag">1,460 STANDARDS</span>
          </h3>
          <button class="backing-preset-close" onclick="closePresetPanel()" aria-label="סגור">✕</button>
        </div>

        <div class="backing-preset-search-row">
          <input class="backing-preset-search" type="text" placeholder="חיפוש שם / מלחין…" oninput="filterPresets(this.value)" />
          <button class="backing-preset-fav-btn" id="bt-fav-filter" onclick="toggleFavFilter()" title="הצג מועדפים בלבד">⭐ 3</button>
        </div>

        <div class="backing-preset-info-strip">
          <span class="count">${MOCK_PRESETS.length} שירים</span>
          <span>· מסונן לפי "ג'אז סטנדרטים"</span>
          <span class="auto-switch">3/4 + 6/4 → Jazz Waltz</span>
        </div>

        <div class="backing-preset-list">${items}</div>
      </aside>
    `;
  }

  // ===== Chord progression editor =====
  function renderChordEditor() {
    // chord 1 = "Cm7" + 7 more whole bars, then a split bar (D7 + Gm), then 3 more bars
    let html = '';
    let visualBar = 1;
    let i = 0;
    while (i < MOCK_CHORDS.length) {
      const c = MOCK_CHORDS[i];
      const isActive = c.name === 'Bb△7' && visualBar === 3;
      if (c.beats === 4) {
        html += `
          <div class="chord-bar${isActive ? ' active' : ''}" onclick="selectBar(${visualBar})">
            <span class="bar-num">${visualBar}</span>
            ${c.name}
            <span class="beats">4 beats</span>
          </div>`;
        i++;
      } else {
        // Two consecutive 2-beat chords form one split bar
        const c2 = MOCK_CHORDS[i + 1];
        html += `
          <div class="chord-bar split">
            <span class="bar-num">${visualBar}</span>
            <div class="split-row">
              <button class="split-half" onclick="selectBar(${visualBar}, 0)">${c.name}</button>
              <button class="split-half" onclick="selectBar(${visualBar}, 1)">${c2.name}</button>
            </div>
            <span class="beats">2 + 2 beats</span>
          </div>`;
        i += 2;
      }
      visualBar++;
    }
    // + Add bar tile
    html += `
      <div class="chord-bar add-bar" onclick="alert('Add bar (mock) — MAX_BARS = 64')" title="הוסף תיבה">
        +
      </div>`;

    return `
      <div class="tool-card">
        <div class="backing-chord-editor-header">
          <h3>
            פרוגרשן אקורדים
            <span class="song-title">— Autumn Leaves</span>
          </h3>
          <div class="backing-bars-controls">
            <div class="backing-bars-stepper" title="Bars count">
              <button onclick="alert('decrement bars')">−</button>
              <span class="label">10 <span class="max-hint">/ 64</span></span>
              <button onclick="alert('increment bars')">+</button>
            </div>
            <div class="backing-layout-pills" title="עמודות בשורה">
              <button class="backing-layout-pill">3</button>
              <button class="backing-layout-pill active">4</button>
              <button class="backing-layout-pill">6</button>
              <button class="backing-layout-pill">8</button>
            </div>
          </div>
        </div>

        <div class="backing-time-sig-row">
          <span class="badge">⏱ Time Sig:<span class="v">4/4</span></span>
          <span class="badge">♩ Beats/Bar:<span class="v">4</span></span>
          <span class="badge">🎼 Transposed:<span class="v">C Maj (original Eb Maj)</span></span>
          <span class="badge">📚 Loaded from:<span class="v">Jazz Standards</span></span>
        </div>

        <div class="chord-grid">${html}</div>
      </div>
    `;
  }

  // ===== Transport =====
  function renderTransport() {
    return `
      <div class="backing-transport-wrap">
        <div class="backing-transport-status">
          <span class="pulse"></span>
          <span>Now playing:</span>
          <span class="now-playing">Bb△7 — Bar 3 / 10 · Beat 2</span>
          <span class="backing-loop-badge">Loop 2 / ∞</span>
        </div>
        <div class="transport">
          <button title="Stop" onclick="alert('stop')">■</button>
          <button class="play" title="Play / Pause" onclick="alert('play/pause')">▶</button>
          <button class="active" title="Loop ON" onclick="alert('toggle loop')">⟲</button>
          <button title="Count-in" onclick="alert('toggle count-in')">1234</button>
          <button title="Mixer" onclick="alert('open mixer popup — Bass · Drums · Piano · Guitar volumes')">🎚</button>
          <button title="Practice mode" onclick="alert('open practice popup — +tempo / loop · +transpose / loop')">🎯</button>
        </div>
      </div>
    `;
  }

  // ===== Live Fretboard (always shown — mocked as open) =====
  function renderFretboard() {
    const stringNames = ['e','B','G','D','A','E'];
    const fretNums = Array.from({length: 14}, (_, i) =>
      `<div class="fb-cell fret-num">${i}</div>`
    ).join('');
    const rows = stringNames.map((sn, sIdx) => {
      const cells = Array.from({length: 14}, (_, fIdx) => {
        // mock: scatter dots so it reads as a real Bb△7 / C major scale
        const hasDot = ((sIdx + fIdx) % 3 === 0) && fIdx > 0;
        const isRoot = hasDot && (fIdx === 5 || fIdx === 10);
        // Arpeggio overlay (cyan) — chord tones of Bb△7 = Bb, D, F, A
        const isArp = hasDot && (fIdx === 3 || fIdx === 7 || fIdx === 11);
        if (hasDot) {
          const cls = isRoot ? 'root' : (isArp ? 'arp' : '');
          return `<div class="fb-cell ${fIdx===0?'nut':''}"><div class="fb-dot ${cls}">${isRoot?'R':''}</div></div>`;
        }
        return `<div class="fb-cell ${fIdx===0?'nut':''}"></div>`;
      }).join('');
      return `<div class="fb-string">${sn}</div>${cells}`;
    }).join('');

    return `
      <div class="tool-card">
        <div class="backing-fretboard-header">
          <h3>
            <span>🎸 צוואר חי</span>
            <span class="now-chord">Bb△7</span>
          </h3>
          <div class="backing-fretboard-controls">
            <button class="select-pill active" title="Root selector">
              <strong>Root:</strong> <span class="v">Auto</span> <span class="caret">▼</span>
            </button>
            <button class="select-pill" title="Scale selector">
              <strong>Scale:</strong> <span class="v">Bb Lydian</span> <span class="caret">▼</span>
            </button>
            <button class="select-pill active" title="Polyscale mode">
              <strong>Polyscale:</strong> <span class="v">ON</span>
            </button>
            <button class="select-pill" title="Display mode">
              <strong>Display:</strong> <span class="v">Dots</span> <span class="caret">▼</span>
            </button>
          </div>
        </div>

        <div class="fretboard">
          <div class="fb-grid">
            <div></div>${fretNums}
            ${rows}
          </div>
        </div>

        <div class="backing-fretboard-legend">
          <span class="backing-legend-item">
            <span class="backing-legend-dot scale"></span> תווי סולם
          </span>
          <span class="backing-legend-item">
            <span class="backing-legend-dot arp"></span> ארפג'יו של האקורד הנוכחי
          </span>
          <span class="backing-legend-item">
            <span class="backing-legend-dot root"></span> שורש האקורד
          </span>
        </div>

        <!-- Polyscale per-bar override strip -->
        <div class="backing-polyscale-strip">
          <div class="strip-title">
            <span>⚡</span>
            <span>Polyscale Override · סולם נפרד לכל אקורד</span>
          </div>
          <div class="backing-polyscale-cells">
            <div class="backing-polyscale-cell">
              <div class="cell-bar">1</div>
              <div class="cell-chord">Cm7</div>
              <div class="cell-scale">Dorian</div>
            </div>
            <div class="backing-polyscale-cell">
              <div class="cell-bar">2</div>
              <div class="cell-chord">F7</div>
              <div class="cell-scale">Mixolydian</div>
            </div>
            <div class="backing-polyscale-cell current">
              <div class="cell-bar">3</div>
              <div class="cell-chord">Bb△7</div>
              <div class="cell-scale">Lydian</div>
            </div>
            <div class="backing-polyscale-cell">
              <div class="cell-bar">4</div>
              <div class="cell-chord">Eb△7</div>
              <div class="cell-scale">Lydian</div>
            </div>
            <div class="backing-polyscale-cell">
              <div class="cell-bar">5</div>
              <div class="cell-chord">Am7♭5</div>
              <div class="cell-scale">Locrian</div>
            </div>
            <div class="backing-polyscale-cell">
              <div class="cell-bar">6</div>
              <div class="cell-chord">D7</div>
              <div class="cell-scale">Alt</div>
            </div>
            <div class="backing-polyscale-cell">
              <div class="cell-bar">7</div>
              <div class="cell-chord">Gm</div>
              <div class="cell-scale">Aeolian</div>
            </div>
            <div class="backing-polyscale-cell">
              <div class="cell-bar">8</div>
              <div class="cell-chord">D7 / Gm</div>
              <div class="cell-scale">Alt / Aeolian</div>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  // ===== SF2 status (mocked, optional) =====
  function renderSf2Status() {
    return `
      <div class="backing-status-bar" style="display:none" id="bt-sf2-status">
        <span class="spinner"></span>
        <span>טוען SoundFont — JJazzLab SF2 (28MB)…</span>
      </div>
    `;
  }

  // ===== Main renderer (referenced in the views JSON) =====
  function renderBackingTracks() {
    return `
      <div class="tool-stage">
        <div class="container">

          <div class="tool-title">
            <h1>🎵 באקינג טראקס</h1>
            <p>1,460 ג'אז סטנדרטים · 5 קטגוריות סטייל · עורך אקורדים · צוואר חי · Polyscale</p>
          </div>

          ${renderSf2Status()}
          ${renderTopBar()}
          ${renderChordEditor()}
          ${renderTransport()}
          ${renderFretboard()}

        </div>
      </div>
      ${renderPresetPanel()}
    `;
  }

  // ===== Interactions (mocked) =====
  function toggleKeyDropdown(e) {
    e.stopPropagation();
    const dd = document.getElementById('bt-key-dropdown');
    dd.classList.toggle('open');
  }
  function setKeyRoot(root, e) {
    e.stopPropagation();
    document.getElementById('bt-key-root').textContent = root;
    document.querySelectorAll('.backing-key-cell').forEach(c => {
      c.classList.toggle('active', c.textContent === root);
    });
  }
  function setKeyQual(qual, e) {
    e.stopPropagation();
    document.getElementById('bt-key-qual').textContent = qual;
    document.querySelectorAll('.backing-key-qual-btn').forEach(b => {
      b.classList.toggle('active', b.textContent.startsWith(qual === 'Maj' ? 'Major' : 'Minor'));
    });
  }
  function bumpTempo(delta) {
    const el = document.getElementById('bt-tempo-val');
    const cur = parseInt(el.textContent, 10);
    el.textContent = Math.max(20, Math.min(300, cur + delta));
  }
  function openPresetPanel() {
    document.getElementById('bt-preset-panel').classList.add('open');
    document.getElementById('bt-preset-overlay').classList.add('open');
  }
  function closePresetPanel() {
    document.getElementById('bt-preset-panel').classList.remove('open');
    document.getElementById('bt-preset-overlay').classList.remove('open');
  }
  function toggleFav(e, title) {
    e.stopPropagation();
    e.currentTarget.classList.toggle('starred');
  }
  function toggleFavFilter() {
    document.getElementById('bt-fav-filter').classList.toggle('active');
  }
  function loadPreset(title) {
    console.log(`[mockup] loadPreset → ${title}`);
    closePresetPanel();
  }
  function filterPresets(q) {
    console.log(`[mockup] filter → ${q}`);
  }
  function selectBar(bar, half) {
    console.log(`[mockup] selectBar ${bar}${half!==undefined ? ` half=${half}` : ''}`);
    // Visual: toggle active state on the clicked chord-bar
    document.querySelectorAll('.chord-bar.active, .split-half.active').forEach(el =>
      el.classList.remove('active'));
    event.currentTarget.classList.add('active');
  }

  // Click anywhere to close key dropdown
  document.addEventListener('click', (e) => {
    const dd = document.getElementById('bt-key-dropdown');
    const pill = document.getElementById('bt-key-pill');
    if (dd && pill && !pill.contains(e.target) && !dd.contains(e.target)) {
      dd.classList.remove('open');
    }
  });

  // ===== Stubs (master assembler will override) =====
  function navigate(id) { console.log('[mockup] navigate →', id); }
  function goBack() { history.back(); }

  // ===== Standalone preview =====
  function renderStandalonePreview() {
    document.getElementById('app').innerHTML = `
      <section class="preview-section">
        <div class="preview-marker">VIEW 1 / 1  ·  backing-tracks</div>
        ${renderBackingTracks()}
      </section>
    `;
  }
  document.addEventListener('DOMContentLoaded', renderStandalonePreview);
</script>
</body>
