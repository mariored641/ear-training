<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Voice-Leading Fragment — v2</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

<!-- ============================================================
     CANON BASE — copied verbatim from redesign-v1.html so this
     fragment opens standalone. Master assembler may strip and
     replace with its own copy. (Identical to melodic.html.)
     ============================================================ -->
<style id="canon-base">
  :root {
    --bg-deep:    #050d2a;
    --bg-mid:     #0a1f5c;
    --bg-light:   #2a5aff;
    --accent:     #6ea8ff;
    --accent-2:   #b8d4ff;
    --text:       #eaf2ff;
    --text-dim:   #9fb4d6;
    --orb-bg:     rgba(255, 255, 255, 0.06);
    --orb-border: rgba(180, 210, 255, 0.25);
    --orb-glow:   rgba(110, 168, 255, 0.35);
    --glass-bg:   rgba(255, 255, 255, 0.06);
    --glass-border: rgba(180, 210, 255, 0.22);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    font-family: 'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--text);
  }
  body {
    position: relative;
    background: radial-gradient(ellipse at 50% 60%, #0d2a7a 0%, #050d2a 70%);
  }

  /* ===== Aurora background ===== */
  .aurora {
    position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none;
  }
  .blob {
    position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.55; will-change: transform;
  }
  .blob-1 {
    width: 50vmax; height: 50vmax;
    background: radial-gradient(circle, #2a5aff 0%, transparent 70%);
    top: -10%; left: -10%; animation: drift1 22s ease-in-out infinite alternate;
  }
  .blob-2 {
    width: 45vmax; height: 45vmax;
    background: radial-gradient(circle, #4b8bff 0%, transparent 70%);
    bottom: -15%; right: -10%; animation: drift2 28s ease-in-out infinite alternate;
  }
  .blob-3 {
    width: 35vmax; height: 35vmax;
    background: radial-gradient(circle, #6ea8ff 0%, transparent 70%);
    top: 30%; right: 20%; opacity: 0.35; animation: drift3 18s ease-in-out infinite alternate;
  }
  @keyframes drift1 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(20vw,10vh) scale(1.15)} 100%{transform:translate(10vw,25vh) scale(0.95)} }
  @keyframes drift2 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(-15vw,-10vh) scale(1.1)} 100%{transform:translate(-25vw,5vh) scale(0.9)} }
  @keyframes drift3 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(-20vw,15vh) scale(1.2)} 100%{transform:translate(15vw,-10vh) scale(0.85)} }

  .stars {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 12% 28%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 78% 64%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 35% 75%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 88% 18%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 55% 42%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.5px 1.5px at 22% 88%, rgba(255,255,255,0.5), transparent);
  }

  /* ===== Top bar ===== */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 90;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    font-size: 12px;
  }
  .top-bar .label { opacity: 0.7; letter-spacing: 0.3px; }
  .top-bar .crumb { color: var(--accent-2); font-weight: 500; }
  .top-bar .crumb span { opacity: 0.5; margin: 0 6px; }

  /* ===== Back pill ===== */
  .back-pill {
    position: fixed; top: 50px; right: 18px; z-index: 80;
    background: rgba(255,255,255,0.08);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 8px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    font-family: inherit; backdrop-filter: blur(10px);
    transition: background 0.2s ease;
  }
  .back-pill:hover { background: rgba(255,255,255,0.16); }

  /* ===== Stage / Constellation ===== */
  .stage {
    position: relative; z-index: 1;
    height: 100vh; width: 100vw;
    display: flex; align-items: center; justify-content: center;
  }
  .constellation {
    position: relative;
    width: min(90vmin, 760px);
    height: min(90vmin, 760px);
  }
  .center-hub {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 30%; aspect-ratio: 1 / 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 30%, rgba(255,255,255,0.18), rgba(255,255,255,0.02) 70%),
      linear-gradient(135deg, rgba(110, 168, 255, 0.18), rgba(42, 90, 255, 0.1));
    backdrop-filter: blur(12px);
    border: 1.5px solid rgba(180, 210, 255, 0.3);
    box-shadow:
      0 0 60px rgba(110, 168, 255, 0.45),
      inset 0 0 40px rgba(255, 255, 255, 0.05);
    overflow: hidden;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    z-index: 5;
    animation: hubPulse 5s ease-in-out infinite alternate;
  }
  @keyframes hubPulse {
    from { box-shadow: 0 0 60px rgba(110, 168, 255, 0.35), inset 0 0 40px rgba(255,255,255,0.05); }
    to   { box-shadow: 0 0 90px rgba(110, 168, 255, 0.6),  inset 0 0 50px rgba(255,255,255,0.08); }
  }
  .center-hub .center-info {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 6%;
  }
  .center-hub .center-info .emoji {
    font-size: clamp(28px, 5vmin, 48px);
    margin-bottom: 4px;
    filter: drop-shadow(0 0 12px rgba(110,168,255,0.7));
  }
  .center-hub .center-info h2 {
    margin: 0 0 4px 0;
    font-size: clamp(13px, 2vmin, 20px);
    font-weight: 700; line-height: 1.15;
  }
  .center-hub .center-info p {
    margin: 0;
    font-size: clamp(9px, 1.3vmin, 12px);
    color: var(--text-dim); line-height: 1.3;
  }

  /* Satellites */
  .satellite {
    position: absolute; top: 50%; left: 50%;
    --angle: 0deg; --radius: 34vmin;
    transform:
      translate(-50%, -50%)
      rotate(var(--angle))
      translateY(calc(var(--radius) * -1))
      rotate(calc(var(--angle) * -1));
    width: 22vmin; height: 22vmin;
    pointer-events: none;
    animation: floatY 6s ease-in-out infinite alternate;
  }
  .satellite.s-2 { animation-delay: -1s; }
  .satellite.s-3 { animation-delay: -2s; }
  @keyframes floatY {
    from { transform: translate(-50%,-50%) rotate(var(--angle)) translateY(calc(var(--radius)*-1)) rotate(calc(var(--angle)*-1)); }
    to   { transform: translate(-50%,-50%) rotate(var(--angle)) translateY(calc((var(--radius)*-1) - 6px)) rotate(calc(var(--angle)*-1)); }
  }
  .satellite .label {
    position: absolute; left: 50%; bottom: calc(78% + 10px);
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: clamp(11px, 1.7vmin, 15px); font-weight: 600;
    color: var(--text);
    text-shadow: 0 0 14px rgba(0,0,0,0.85), 0 2px 8px rgba(0,0,0,0.6);
    pointer-events: none;
    animation: labelFloat 4s ease-in-out infinite alternate;
  }
  @keyframes labelFloat {
    from { transform: translateX(-50%) translateY(0); }
    to   { transform: translateX(-50%) translateY(-4px); }
  }
  .satellite .sub-label {
    position: absolute; left: 50%; top: calc(78% - 4px);
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: clamp(9px, 1.3vmin, 11px); font-weight: 500;
    color: var(--accent-2); opacity: 0.85;
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
    pointer-events: none;
  }
  .satellite .orb {
    position: absolute; bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 78%; aspect-ratio: 1 / 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,0.22), rgba(255,255,255,0.02) 65%),
      var(--orb-bg);
    backdrop-filter: blur(8px);
    border: 1.5px solid var(--orb-border);
    box-shadow: 0 0 30px var(--orb-glow), inset 0 0 20px rgba(255,255,255,0.04);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(28px, 5.5vmin, 52px);
    cursor: pointer; pointer-events: auto;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .satellite .orb:hover {
    transform: translateX(-50%) scale(1.12);
    box-shadow: 0 0 50px rgba(180, 210, 255, 0.7), inset 0 0 30px rgba(255,255,255,0.1);
    border-color: rgba(220, 235, 255, 0.7);
  }
  .satellite.s-1 .orb { box-shadow: 0 0 30px rgba(255, 180, 100, 0.45), inset 0 0 20px rgba(255,255,255,0.04); }
  .satellite.s-2 .orb { box-shadow: 0 0 30px rgba(255, 120, 180, 0.4),  inset 0 0 20px rgba(255,255,255,0.04); }
  .satellite.s-3 .orb { box-shadow: 0 0 30px rgba(150, 220, 255, 0.45), inset 0 0 20px rgba(255,255,255,0.04); }

  .lines { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .lines line { stroke: rgba(180, 210, 255, 0.12); stroke-width: 1; stroke-dasharray: 3 5; }

  /* ===== Exercise template ===== */
  .exercise-stage {
    position: relative; z-index: 1;
    min-height: 100vh; width: 100vw;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    padding: 80px 20px 110px;
    gap: 22px;
  }
  .ex-header {
    text-align: center;
    display: flex; flex-direction: column; gap: 6px;
    align-items: center;
  }
  .ex-code {
    font-size: 12px; letter-spacing: 1.5px; font-weight: 600;
    color: var(--accent); opacity: 0.85; text-transform: uppercase;
  }
  .ex-title {
    margin: 0; font-size: clamp(22px, 3.5vmin, 32px); font-weight: 700;
  }
  .ex-progress {
    font-size: 13px; color: var(--text-dim); margin-top: 4px;
  }
  .ex-prompt {
    margin: 0; font-size: clamp(15px, 2vmin, 18px);
    color: var(--text-dim); max-width: 700px; text-align: center;
    line-height: 1.5;
  }
  .play-pad {
    width: clamp(110px, 18vmin, 180px); height: clamp(110px, 18vmin, 180px);
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,0.25), rgba(255,255,255,0.05) 70%),
      linear-gradient(135deg, rgba(110, 168, 255, 0.4), rgba(42, 90, 255, 0.25));
    backdrop-filter: blur(12px);
    border: 1.5px solid rgba(180, 210, 255, 0.45);
    color: #fff;
    box-shadow: 0 0 60px rgba(110, 168, 255, 0.5), inset 0 0 30px rgba(255,255,255,0.08);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(42px, 7vmin, 72px);
    font-family: inherit;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    animation: hubPulse 5s ease-in-out infinite alternate;
  }
  .play-pad:hover {
    transform: scale(1.06);
    box-shadow: 0 0 80px rgba(180, 210, 255, 0.7), inset 0 0 40px rgba(255,255,255,0.15);
  }

  .ex-answers {
    display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center; align-items: center;
    max-width: 800px;
  }
  .ans-chip {
    background: var(--glass-bg);
    border: 1.5px solid var(--glass-border);
    backdrop-filter: blur(8px);
    color: var(--text);
    padding: 10px 22px;
    border-radius: 999px;
    font-size: clamp(13px, 1.7vmin, 16px);
    font-weight: 600;
    cursor: pointer; font-family: inherit;
    transition: all 0.2s ease;
    min-width: 60px;
  }
  .ans-chip:hover {
    background: rgba(110, 168, 255, 0.2);
    border-color: rgba(180, 210, 255, 0.5);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(110, 168, 255, 0.3);
  }
  .ans-chip.active {
    background: rgba(110, 168, 255, 0.28);
    border-color: var(--accent);
    box-shadow: 0 0 18px rgba(110, 168, 255, 0.4);
  }

  .ex-footer {
    position: fixed; bottom: 18px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 14px;
    align-items: center;
    z-index: 70;
    flex-wrap: wrap;
    padding: 0 16px;
  }
  .hint-btn, .skip-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-dim);
    padding: 8px 16px; border-radius: 999px;
    font-size: 12px; font-family: inherit;
    cursor: pointer;
    backdrop-filter: blur(10px);
  }
  .hint-btn:hover, .skip-btn:hover { color: var(--text); background: rgba(255,255,255,0.12); }

  .toggles-row {
    display: flex; gap: 8px; margin-top: 4px;
    flex-wrap: wrap; justify-content: center;
  }
  .pill-toggle {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-dim);
    padding: 5px 12px; border-radius: 999px;
    font-size: 11px; font-family: inherit;
    cursor: pointer;
  }
  .pill-toggle.active { background: rgba(110, 168, 255, 0.25); border-color: var(--accent); color: var(--text); }

  .control-row {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    justify-content: center;
  }
  .select-pill {
    background: rgba(255,255,255,0.06);
    border: 1.5px solid var(--glass-border);
    color: var(--text);
    padding: 6px 14px; border-radius: 999px;
    font-size: 13px; font-family: inherit;
    cursor: pointer;
  }
  .select-pill .v { color: var(--accent); font-weight: 600; margin-inline-start: 6px; }
</style>

<!-- ============================================================
     SECTION STYLES — Voice-Leading fragment additions

     Reused from canon / global:
       .levels-trigger, .levels-overlay, .levels-drawer (+ children)
         — copied verbatim from melodic.html, identical CSS.
       .ans-chip, .play-pad, .pill-toggle, .select-pill, .control-row
         — canon classes, unchanged.

     New classes (prefixed `voice-leading-`):
       .voice-leading-voice-stack    — 4-voice SATB chord stack visualizer
       .voice-leading-voice-row      — one horizontal voice row (S/A/T/B)
       .voice-leading-voice-cell     — one chord position inside a row
       .voice-leading-voice-note     — the noteName disc inside a cell
       .voice-leading-motion-arrow   — arrow drawn between two cells of
                                       the highlighted voice
       .voice-leading-voice-tag      — small "Soprano / Bass / …" label
       .voice-leading-prog-row       — chord-symbol strip under the stack
       .voice-leading-prog-chord     — one chord symbol with degree

     The visualizer is unique to voice-leading because no canon class
     can express "stack of 4 voices, highlight one, show its motion
     from chord N → chord N+1". For V1 the BASS row is highlighted
     and gets the motion arrow; for V2 the SOPRANO row does. Inner
     voices stay dim so the ear hint matches the visual.
     ============================================================ -->
<style id="section-voice-leading">
  /* ---- Global Levels Drawer (shared with every section) ----
     Verbatim copy from melodic.html. -------------------------- */
  .levels-trigger {
    position: fixed; top: 50px; left: 18px; z-index: 80;
    background: rgba(255,255,255,0.08);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 8px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: inherit; backdrop-filter: blur(10px);
    display: inline-flex; align-items: center; gap: 8px;
    transition: background 0.2s ease;
  }
  .levels-trigger:hover { background: rgba(255,255,255,0.16); }
  .levels-trigger .hamburger { font-size: 15px; line-height: 1; color: var(--accent-2); }
  .levels-trigger .current-level { color: var(--accent); font-weight: 700; }

  .levels-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(5, 13, 42, 0.55);
    backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .levels-overlay.open { opacity: 1; pointer-events: auto; }

  .levels-drawer {
    position: fixed; top: 0; bottom: 0; left: 0;
    width: min(380px, 90vw);
    z-index: 210;
    background: linear-gradient(180deg, rgba(13, 42, 122, 0.85), rgba(10, 31, 92, 0.92));
    border-right: 1.5px solid var(--glass-border);
    backdrop-filter: blur(16px);
    box-shadow: 4px 0 40px rgba(0, 0, 0, 0.5),
                inset -1px 0 0 rgba(180, 210, 255, 0.08);
    transform: translateX(-105%);
    transition: transform 0.32s cubic-bezier(0.2, 0.7, 0.2, 1);
    display: flex; flex-direction: column;
    direction: rtl;
  }
  .levels-drawer.open { transform: translateX(0); }

  .levels-drawer-header {
    padding: 18px 20px 14px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(180, 210, 255, 0.12);
  }
  .levels-drawer-title {
    margin: 0;
    font-size: 17px; font-weight: 700;
    color: var(--text);
    display: flex; align-items: center; gap: 10px;
  }
  .levels-drawer-title .ex-tag {
    font-size: 11px; letter-spacing: 1.5px;
    color: var(--accent);
    padding: 3px 8px; border-radius: 6px;
    background: rgba(110, 168, 255, 0.15);
    border: 1px solid rgba(110, 168, 255, 0.3);
  }
  .levels-drawer-close {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-dim);
    width: 32px; height: 32px;
    border-radius: 50%;
    font-size: 16px; cursor: pointer;
    font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease;
  }
  .levels-drawer-close:hover { background: rgba(255,255,255,0.14); color: var(--text); }

  .levels-drawer-list {
    list-style: none;
    margin: 0; padding: 12px;
    overflow-y: auto;
    flex: 1;
    display: flex; flex-direction: column; gap: 6px;
  }
  .levels-drawer-list::-webkit-scrollbar { width: 6px; }
  .levels-drawer-list::-webkit-scrollbar-thumb { background: rgba(180,210,255,0.2); border-radius: 3px; }

  .level-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.03);
    border: 1.5px solid transparent;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .level-item:hover { background: rgba(110, 168, 255, 0.1); border-color: rgba(180, 210, 255, 0.2); }
  .level-item.active {
    background: rgba(110, 168, 255, 0.18);
    border-color: var(--accent);
    box-shadow: 0 0 18px rgba(110, 168, 255, 0.35),
                inset 0 0 14px rgba(110, 168, 255, 0.08);
  }
  .level-item.locked { opacity: 0.45; cursor: not-allowed; }
  .level-item.locked:hover { background: rgba(255,255,255,0.03); border-color: transparent; }
  .level-item-num {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    border: 1.5px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .level-item.active .level-item-num {
    background: var(--accent);
    border-color: var(--accent-2);
    color: #051030;
    box-shadow: 0 0 12px rgba(110, 168, 255, 0.7);
  }
  .level-item.completed .level-item-num {
    background: rgba(120, 220, 180, 0.25);
    border-color: rgba(120, 220, 180, 0.6);
    color: #e0fff0;
  }
  .level-item-label { flex: 1; font-size: 13px; font-weight: 500; color: var(--text); }
  .level-item.active .level-item-label { color: var(--accent-2); font-weight: 600; }
  .level-item-icon { font-size: 13px; color: var(--text-dim); }
  .level-item.completed .level-item-icon { color: rgba(120, 220, 180, 0.9); }
  .level-item.locked .level-item-icon { color: var(--text-dim); }

  /* ---- Voice-Leading: 4-voice SATB stack visualizer ----
     Justification: V1 and V2 both ask "how did ONE voice move
     between two chords?" No canon class shows a voicing stack
     with a single voice spotlighted and an arrow between its
     two positions. We need: rows (SATB) × columns (chords),
     one row glowing, an arrow drawn between two cells of that
     row, the other rows dimmed so the eye matches the ear. */
  .voice-leading-voice-stack {
    position: relative;
    width: 100%;
    max-width: 620px;
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid var(--glass-border);
    border-radius: 18px;
    padding: 18px 18px 14px;
    display: flex; flex-direction: column; gap: 10px;
    backdrop-filter: blur(8px);
  }
  .voice-leading-stack-header {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--text-dim);
    padding-bottom: 4px;
    border-bottom: 1px dashed rgba(180, 210, 255, 0.12);
  }
  .voice-leading-stack-header .key-tag {
    color: var(--accent-2); font-weight: 700; letter-spacing: 0.4px;
  }
  .voice-leading-voice-row {
    display: grid;
    grid-template-columns: 70px repeat(var(--chord-count, 4), 1fr);
    gap: 8px;
    align-items: center;
    position: relative;
    padding: 4px 0;
    border-radius: 10px;
    transition: background 0.25s ease;
  }
  .voice-leading-voice-row.dim { opacity: 0.4; }
  .voice-leading-voice-row.highlighted {
    background: rgba(110, 168, 255, 0.08);
    box-shadow: inset 0 0 18px rgba(110, 168, 255, 0.12);
  }
  .voice-leading-voice-tag {
    font-size: 11px; font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    text-align: start;
    padding-inline-start: 6px;
    display: flex; flex-direction: column; line-height: 1.2;
  }
  .voice-leading-voice-tag .he { color: var(--text); font-weight: 700; font-size: 12px; }
  .voice-leading-voice-row.highlighted .voice-leading-voice-tag .he {
    color: var(--accent-2);
    text-shadow: 0 0 10px rgba(110, 168, 255, 0.6);
  }
  .voice-leading-voice-cell {
    height: 42px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .voice-leading-voice-note {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.06);
    border: 1.5px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    color: var(--text);
    transition: all 0.2s ease;
  }
  .voice-leading-voice-row.highlighted .voice-leading-voice-note {
    background: rgba(110, 168, 255, 0.32);
    border-color: var(--accent-2);
    color: #fff;
    box-shadow: 0 0 18px rgba(110, 168, 255, 0.55);
  }
  .voice-leading-voice-row.highlighted .voice-leading-voice-note.from-note {
    background: rgba(255, 200, 130, 0.32);
    border-color: rgba(255, 200, 130, 0.85);
    box-shadow: 0 0 16px rgba(255, 200, 130, 0.45);
  }
  .voice-leading-voice-row.highlighted .voice-leading-voice-note.to-note {
    background: rgba(110, 220, 180, 0.32);
    border-color: rgba(140, 230, 200, 0.95);
    box-shadow: 0 0 18px rgba(120, 220, 180, 0.55);
  }

  /* ---- Motion arrow drawn between two cells of the highlighted voice.
     Sits absolutely positioned inside the highlighted row, between
     the FROM cell (previous chord) and the TO cell (current chord). */
  .voice-leading-motion-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    height: 28px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .voice-leading-motion-arrow svg {
    width: 100%; height: 100%;
    overflow: visible;
  }
  .voice-leading-motion-arrow .arrow-stem {
    stroke: var(--accent-2);
    stroke-width: 2.5;
    stroke-linecap: round;
    fill: none;
    filter: drop-shadow(0 0 6px rgba(180, 210, 255, 0.75));
  }
  .voice-leading-motion-arrow .arrow-head {
    fill: var(--accent-2);
    filter: drop-shadow(0 0 6px rgba(180, 210, 255, 0.85));
  }
  .voice-leading-motion-arrow .motion-tag {
    position: absolute; top: -22px; left: 50%;
    transform: translateX(-50%);
    background: rgba(5, 13, 42, 0.7);
    border: 1px solid rgba(180, 210, 255, 0.35);
    color: var(--accent-2);
    padding: 2px 8px; border-radius: 999px;
    font-size: 10px; font-weight: 700;
    white-space: nowrap;
    backdrop-filter: blur(8px);
  }

  /* ---- Chord-symbol strip under the stack ---- */
  .voice-leading-prog-row {
    display: grid;
    grid-template-columns: 70px repeat(var(--chord-count, 4), 1fr);
    gap: 8px;
    align-items: center;
    padding-top: 6px;
    border-top: 1px dashed rgba(180, 210, 255, 0.12);
  }
  .voice-leading-prog-row .prog-tag {
    font-size: 10px; letter-spacing: 0.8px;
    color: var(--text-dim); text-align: start;
    padding-inline-start: 6px;
  }
  .voice-leading-prog-chord {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 6px 0;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(180, 210, 255, 0.1);
  }
  .voice-leading-prog-chord .sym { font-size: 14px; font-weight: 700; color: var(--text); }
  .voice-leading-prog-chord .deg { font-size: 10px; color: var(--text-dim); }
  .voice-leading-prog-chord.current {
    background: rgba(110, 168, 255, 0.18);
    border-color: var(--accent);
    box-shadow: 0 0 14px rgba(110, 168, 255, 0.4);
  }
  .voice-leading-prog-chord.from-chord {
    background: rgba(255, 200, 130, 0.1);
    border-color: rgba(255, 200, 130, 0.45);
  }

  /* ---- shared: settings strip below answers ----
     (Same pattern as melodic-settings-strip — different prefix
     so each section can tune independently if needed.) */
  .voice-leading-settings-strip {
    width: 100%;
    max-width: 900px;
    border-top: 1px dashed rgba(180, 210, 255, 0.18);
    padding-top: 16px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .voice-leading-settings-strip .strip-title {
    font-size: 10px; letter-spacing: 1.5px;
    color: var(--text-dim); text-transform: uppercase;
  }

  /* ---- Direction answer chips (large arrow tiles) ----
     5 answers in V1/V2: ↑step / ↑skip / ↓step / ↓skip / —stay.
     Borrows the melodic-arrow-chip pattern but under our prefix
     so master assembler doesn't need melodic CSS loaded. */
  .ex-answers.voice-leading-arrows-row {
    gap: 14px; max-width: 760px;
  }
  .ans-chip.voice-leading-arrow-chip {
    min-width: 120px;
    min-height: 110px;
    padding: 16px 18px;
    border-radius: 18px;
    flex-direction: column;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px;
    font-size: 14px;
  }
  .ans-chip.voice-leading-arrow-chip .arrow-glyph {
    font-size: clamp(30px, 5vmin, 46px);
    line-height: 1;
    color: var(--accent-2);
    filter: drop-shadow(0 0 12px rgba(110, 168, 255, 0.55));
  }
  .ans-chip.voice-leading-arrow-chip .arrow-text {
    font-size: 12px; font-weight: 600; color: var(--text);
  }
  .ans-chip.voice-leading-arrow-chip .arrow-sub {
    font-size: 10px; color: var(--text-dim); letter-spacing: 0.4px;
  }
  .ans-chip.voice-leading-arrow-chip:hover .arrow-glyph {
    color: #fff;
    filter: drop-shadow(0 0 22px rgba(180, 210, 255, 0.9));
  }

  /* ---- standalone preview helpers (only used when opened alone) ---- */
  .preview-section {
    position: relative;
    min-height: 100vh;
  }
  .preview-section + .preview-section {
    border-top: 1px dashed rgba(180, 210, 255, 0.12);
  }
  .preview-marker {
    position: absolute; top: 50px; left: 50%;
    transform: translateX(-50%);
    z-index: 75;
    background: rgba(0, 0, 0, 0.5);
    color: var(--accent-2);
    border: 1px solid rgba(180, 210, 255, 0.25);
    padding: 6px 16px; border-radius: 999px;
    font-size: 11px; letter-spacing: 1.2px;
    backdrop-filter: blur(10px);
  }
</style>
</head>

{

  "ex-v2": {

<!-- ============================================================
     RENDERERS
     ============================================================ -->
<script>
  // ===== Level data (mirrors the React components) =====
  // V1 levels — from ExerciseV1.jsx LEVELS array
  const V1_LEVELS = [
    { n: 1, label: 'שלב 1 — כיוון',              done: true,  current: false },
    { n: 2, label: 'שלב 2 — צעד / קפיצה',         done: true,  current: true  },
    { n: 3, label: 'שלב 3 — דרגות 1, 4, 5',       done: false },
    { n: 4, label: 'שלב 4 — כל הדיאטוני',         done: false },
    { n: 5, label: 'שלב 5 — כרומטי',              done: false, locked: true },
    { n: 6, label: 'שלב 6 — היפוך דרך בס',        done: false, locked: true },
    { n: 7, label: 'שלב 7 — שעתוק',               done: false, locked: true }
  ];
  // V2 levels — from ExerciseV2.jsx LEVELS array
  const V2_LEVELS = [
    { n: 1, label: 'כיוון — עולה / יורד / חוזר',  done: true,  current: true },
    { n: 2, label: 'צעד / קפיצה',                 done: false },
    { n: 3, label: 'דרגות 1, 3, 5',               done: false },
    { n: 4, label: 'כל הדיאטוני',                 done: false },
    { n: 5, label: 'כרומטי — passing / neighbor', done: false, locked: true },
    { n: 6, label: 'שעתוק קו סופרן',              done: false, locked: true }
  ];

  // ===== Sample voicing — mirrors VOICED_PROGRESSIONS[0] (pop_bass_descending)
  //   bass:    C2 → B2 → A2 → G2   (1 → 7 → 6 → 5, all descending steps)
  //   soprano: E5 → D5 → C5 → B4   (3 → 2 → 1 → 7, all descending steps)
  // For mockup clarity we show the FROM/TO of the last motion as
  // chord[2] → chord[3] (A2→G2 for V1; C5→B4 for V2). Both = descending step.
  const SAMPLE_PROG = {
    name: 'Pop with descending bass',
    key: 'C Major',
    voicings: [
      { chord: 'C',  deg: 'I',  soprano: 'E5', alto: 'G4', tenor: 'C4', bass: 'C2' },
      { chord: 'G',  deg: 'V',  soprano: 'D5', alto: 'G4', tenor: 'B3', bass: 'B2' },
      { chord: 'Am', deg: 'vi', soprano: 'C5', alto: 'A4', tenor: 'E4', bass: 'A2' },
      { chord: 'Em', deg: 'iii',soprano: 'B4', alto: 'G4', tenor: 'E4', bass: 'G2' }
    ]
  };

  // ===== Generic drawer renderer (copy of melodic.html version) =====
  function renderLevelsDrawer(exId, exTitle, levels) {
    const items = levels.map(l => {
      const classes = ['level-item'];
      if (l.current) classes.push('active');
      if (l.done && !l.current) classes.push('completed');
      if (l.locked) classes.push('locked');
      const icon = l.locked   ? '🔒'
                 : l.current  ? '●'
                 : l.done     ? '✓'
                 :              '';
      return `
        <li class="${classes.join(' ')}" onclick="${l.locked ? '' : `selectLevel('${exId}', ${l.n})`}">
          <span class="level-item-num">${l.n}</span>
          <span class="level-item-label">${l.label}</span>
          <span class="level-item-icon">${icon}</span>
        </li>`;
    }).join('');
    return `
      <div class="levels-overlay" id="levels-overlay-${exId}" onclick="toggleDrawer('${exId}')"></div>
      <aside class="levels-drawer" id="levels-drawer-${exId}" role="dialog" aria-label="בחר שלב">
        <div class="levels-drawer-header">
          <h3 class="levels-drawer-title">
            <span class="ex-tag">${exId.toUpperCase()}</span>
            <span>בחר שלב</span>
          </h3>
          <button class="levels-drawer-close" onclick="toggleDrawer('${exId}')" aria-label="סגור">✕</button>
        </div>
        <ul class="levels-drawer-list">${items}</ul>
      </aside>`;
  }
  function renderLevelsTrigger(exId, currentLabel) {
    return `
      <button class="levels-trigger" onclick="toggleDrawer('${exId}')" title="בחר שלב">
        <span class="hamburger">☰</span>
        <span>שלבים</span>
        <span class="current-level">· ${currentLabel}</span>
      </button>`;
  }

  // ===== Voice-Leading Hub (radial — 2 satellites) =====
  function renderVoiceLeadingHub() {
    const sats = [
      { icon: '⬇️', label: 'קו בס',    sub: 'V1', goto: 'ex-v1', slot: 1 },
      { icon: '⬆️', label: 'קו סופרן', sub: 'V2', goto: 'ex-v2', slot: 2 }
    ];
    const n = sats.length;
    const satHtml = sats.map((s, i) => {
      // 2 satellites: place at 0° (top) and 180° (bottom) for symmetry
      const angle = (i * 360 / n).toFixed(2);
      return `
        <div class="satellite s-${s.slot}" style="--angle:${angle}deg" data-angle="${angle}">
          <div class="label">${s.label}</div>
          <div class="orb" onclick="navigate('${s.goto}')">${s.icon}</div>
          <div class="sub-label">${s.sub}</div>
        </div>`;
    }).join('');
    return `
      <div class="stage">
        <div class="constellation" id="cur-const">
          <svg class="lines" id="cur-lines"></svg>
          <div class="center-hub">
            <div class="center-info">
              <div class="emoji">🎶</div>
              <h2>תנועת קול</h2>
              <p>2 Exercises</p>
            </div>
          </div>
          ${satHtml}
        </div>
      </div>`;
  }

  // ===== 4-voice stack visualizer =====
  // highlightedVoice: 'soprano' | 'bass' (which row glows + gets arrow)
  // fromIdx / toIdx: which two columns to mark as FROM (orange) and TO (green)
  //                 and between which to draw the motion arrow.
  // motionLabel: short Hebrew label printed on the arrow (e.g. "↓ צעד").
  function renderVoiceStack(prog, highlightedVoice, fromIdx, toIdx, motionLabel) {
    const voiceMeta = [
      { key: 'soprano', he: 'סופרן',  en: 'Soprano (S)' },
      { key: 'alto',    he: 'אלט',    en: 'Alto (A)'    },
      { key: 'tenor',   he: 'טנור',   en: 'Tenor (T)'   },
      { key: 'bass',    he: 'באס',    en: 'Bass (B)'    }
    ];
    const n = prog.voicings.length;
    // Each cell sits inside a grid with columns: [tag, c0, c1, …, c(n-1)]
    // Tag column = 70px. Remaining = 1fr each. Arrow span between columns
    // (fromIdx+2) and (toIdx+2) in 1-based grid terms.

    const rows = voiceMeta.map(vm => {
      const isHi = vm.key === highlightedVoice;
      const cls = ['voice-leading-voice-row'];
      cls.push(isHi ? 'highlighted' : 'dim');
      const cells = prog.voicings.map((v, idx) => {
        const noteCls = ['voice-leading-voice-note'];
        if (isHi && idx === fromIdx) noteCls.push('from-note');
        if (isHi && idx === toIdx)   noteCls.push('to-note');
        return `<div class="voice-leading-voice-cell">
                  <div class="${noteCls.join(' ')}">${v[vm.key]}</div>
                </div>`;
      }).join('');

      // Arrow overlay on highlighted row only.
      // We place it as a positioned element spanning roughly the gap
      // between FROM cell center and TO cell center. Approximation: each
      // column is (100% - 70px) / n; we put the arrow positioned with
      // CSS calc() between those two centers.
      let arrow = '';
      if (isHi) {
        // Position arrow between fromIdx and toIdx using CSS calc().
        // left edge of column k center: 70px + (k + 0.5) * cellW
        // We'll set left = center of FROM cell, width = (toIdx-fromIdx)*cellW.
        const leftPct  = `calc(70px + (100% - 70px) * ${(fromIdx + 0.5) / n})`;
        const widthPct = `calc((100% - 70px) * ${Math.abs(toIdx - fromIdx) / n})`;
        // direction marker for the arrow head — bass V1 in our sample
        // moves DOWN (from A2 to G2 is descending) — but visually on the
        // row the cells are side-by-side, so the arrow just travels
        // horizontally L→R. The motion-tag label tells the listener
        // whether it was up/down/step/skip.
        arrow = `
          <div class="voice-leading-motion-arrow"
               style="left: ${leftPct}; width: ${widthPct};">
            <span class="motion-tag">${motionLabel}</span>
            <svg viewBox="0 0 100 20" preserveAspectRatio="none">
              <path class="arrow-stem" d="M 4 10 L 92 10" />
              <polygon class="arrow-head" points="92,4 98,10 92,16" />
            </svg>
          </div>`;
      }

      return `
        <div class="${cls.join(' ')}" style="--chord-count: ${n}">
          <div class="voice-leading-voice-tag">
            <span class="he">${vm.he}</span>
            <span>${vm.en}</span>
          </div>
          ${cells}
          ${arrow}
        </div>`;
    }).join('');

    // Chord-symbol strip under the stack
    const chordCells = prog.voicings.map((v, idx) => {
      const cls = ['voice-leading-prog-chord'];
      if (idx === toIdx)   cls.push('current');
      if (idx === fromIdx) cls.push('from-chord');
      return `
        <div class="${cls.join(' ')}">
          <span class="sym">${v.chord}</span>
          <span class="deg">${v.deg}</span>
        </div>`;
    }).join('');

    return `
      <div class="voice-leading-voice-stack">
        <div class="voice-leading-stack-header">
          <span>פרוגרסיה — <span class="key-tag">${prog.name}</span></span>
          <span class="key-tag">${prog.key}</span>
        </div>
        ${rows}
        <div class="voice-leading-prog-row" style="--chord-count: ${n}">
          <div class="prog-tag">אקורדים</div>
          ${chordCells}
        </div>
      </div>`;
  }

  // ===== 5 standard answer chips for V1 / V2 =====
  function renderDirectionAnswers(activeId) {
    const opts = [
      { id: 'up-step',   glyph: '↑',  text: 'עולה',     sub: 'צעד'  },
      { id: 'up-skip',   glyph: '⇑',  text: 'עולה',     sub: 'דילוג' },
      { id: 'down-step', glyph: '↓',  text: 'יורד',     sub: 'צעד'  },
      { id: 'down-skip', glyph: '⇓',  text: 'יורד',     sub: 'דילוג' },
      { id: 'stay',      glyph: '—',  text: 'נשאר',     sub: 'אותו תו' }
    ];
    return `
      <div class="ex-answers voice-leading-arrows-row">
        ${opts.map(o => `
          <button class="ans-chip voice-leading-arrow-chip${o.id === activeId ? ' active' : ''}">
            <span class="arrow-glyph">${o.glyph}</span>
            <span class="arrow-text">${o.text}</span>
            <span class="arrow-sub">${o.sub}</span>
          </button>`).join('')}
      </div>`;
  }

  // ===== Exercise V1 — קו בס =====
  function renderV1() {
    const level = V1_LEVELS.find(l => l.current) || V1_LEVELS[0];
    // Highlight BASS row; show motion A2 → G2 between cell 2 and cell 3.
    // That's a DESCENDING STEP — so the "down-step" answer is the active one.
    const stack = renderVoiceStack(SAMPLE_PROG, 'bass', 2, 3, '↓ צעד  (A2 → G2)');

    return `
      ${renderLevelsTrigger('v1', `שלב ${level.n}`)}
      <div class="exercise-stage">
        <div class="ex-header">
          <div class="ex-code">V1</div>
          <h1 class="ex-title">עקיבת קו בס</h1>
          <div class="ex-progress">שאלה 5 / 10  ·  מהפעם הראשונה: 4  ·  ${level.label}</div>
        </div>

        <p class="ex-prompt">איך נע קו הבס בין שני האקורדים?</p>

        <button class="play-pad" title="נגן שוב">▶</button>

        ${stack}

        ${renderDirectionAnswers('down-step')}

        <!-- Extra play buttons — match the React UI's two-button row -->
        <div class="control-row" style="margin-top: 4px">
          <button class="select-pill">🔊 נגן רצף</button>
          <button class="select-pill" style="background:rgba(110,168,255,0.18); border-color:var(--accent)">🎸 הבלט בס</button>
          <button class="select-pill">▶ נגן רפרנס</button>
        </div>

        <!-- Settings strip mirrors the React ctrlRow -->
        <div class="voice-leading-settings-strip">
          <div class="strip-title">הגדרות תרגיל</div>
          <div class="control-row">
            <span class="select-pill" style="cursor:default"><strong>שאלות:</strong> <span class="v">10</span></span>
            <span class="select-pill" style="cursor:default"><strong>פרוגרסיה:</strong> <span class="v">Pop bass desc.</span></span>
            <span class="select-pill" style="cursor:default"><strong>גודל מרווח:</strong> <span class="v">צעד + דילוג</span></span>
            <span class="select-pill" style="cursor:default"><strong>רפרנס:</strong> <span class="v">קדנצה</span></span>
            <span class="select-pill" style="cursor:default"><strong>כלי:</strong> <span class="v">פסנתר</span></span>
          </div>
          <div class="control-row" style="opacity:0.85">
            <button class="pill-toggle active">קדנצה</button>
            <button class="pill-toggle">אקורד</button>
            <button class="pill-toggle">תו</button>
            <button class="pill-toggle">ללא</button>
            <span style="opacity:0.4; padding:0 4px">·</span>
            <button class="pill-toggle active">פסנתר</button>
            <button class="pill-toggle">גיטרה</button>
            <span style="opacity:0.4; padding:0 4px">·</span>
            <button class="pill-toggle active">צעד</button>
            <button class="pill-toggle active">דילוג</button>
          </div>
          <!-- Per-progression chip selector (drawn from voicedProgressions.js) -->
          <div class="control-row" style="margin-top:4px">
            <span class="strip-title" style="margin-inline-end:4px">פרוגרסיות:</span>

  // ===== Standalone preview: stack all 3 views =====
  function renderStandalonePreview() {
    document.getElementById('app').innerHTML = `
      <section class="preview-section">
        <div class="preview-marker">VIEW 1 / 3  ·  voice-leading hub</div>
        ${renderVoiceLeadingHub()}
      </section>
      <section class="preview-section">
        <div class="preview-marker">VIEW 2 / 3  ·  ex-v1</div>
        ${renderV1()}
      </section>
      <section class="preview-section">
        <div class="preview-marker">VIEW 3 / 3  ·  ex-v2</div>
        ${renderV2()}
      </section>
    `;
    requestAnimationFrame(drawConstellationLines);
  }

  function drawConstellationLines() {
    const container = document.getElementById('cur-const');
    const svg = document.getElementById('cur-lines');
    if (!container || !svg) return;
    const w = container.clientWidth, h = container.clientHeight;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.innerHTML = '';
    const cRect = container.getBoundingClientRect();
    const cx = w / 2, cy = h / 2;
    container.querySelectorAll('.satellite .orb').forEach(orb => {
      const r = orb.getBoundingClientRect();
      const x = r.left + r.width / 2 - cRect.left;
      const y = r.top + r.height / 2 - cRect.top;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', cx); line.setAttribute('y1', cy);
      line.setAttribute('x2', x);  line.setAttribute('y2', y);
      svg.appendChild(line);
    });
  }

  // ===== Stubs (master assembler will override) =====
  function navigate(id) {
    const map = { 'voice-leading': 0, 'ex-v1': 1, 'ex-v2': 2 };
    const idx = map[id];
    if (idx != null) {
      document.querySelectorAll('.preview-section')[idx]
        ?.scrollIntoView({ behavior: 'smooth' });
    }
  }
  function goBack() { history.back(); }

  function toggleDrawer(exId) {
    const drawer  = document.getElementById(`levels-drawer-${exId}`);
    const overlay = document.getElementById(`levels-overlay-${exId}`);
    if (!drawer || !overlay) return;
    const open = !drawer.classList.contains('open');
    drawer.classList.toggle('open',  open);
    overlay.classList.toggle('open', open);
  }
  function selectLevel(exId, n) {
    toggleDrawer(exId);
    console.log(`[mockup] selectLevel ${exId} → ${n}`);
  }

  window.addEventListener('resize', drawConstellationLines);
  document.addEventListener('DOMContentLoaded', renderStandalonePreview);
