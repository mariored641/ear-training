<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dictation Fragment — v2</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

<!-- ============================================================
     CANON BASE — copied verbatim from redesign-v1.html / melodic.html
     so this fragment opens standalone. Master assembler may strip
     and replace with its own copy.
     ============================================================ -->
<style id="canon-base">
  :root {
    --bg-deep:    #050d2a;
    --bg-mid:     #0a1f5c;
    --bg-light:   #2a5aff;
    --accent:     #6ea8ff;
    --accent-2:   #b8d4ff;
    --text:       #eaf2ff;
    --text-dim:   #9fb4d6;
    --orb-bg:     rgba(255, 255, 255, 0.06);
    --orb-border: rgba(180, 210, 255, 0.25);
    --orb-glow:   rgba(110, 168, 255, 0.35);
    --glass-bg:   rgba(255, 255, 255, 0.06);
    --glass-border: rgba(180, 210, 255, 0.22);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    font-family: 'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--text);
  }
  body {
    position: relative;
    background: radial-gradient(ellipse at 50% 60%, #0d2a7a 0%, #050d2a 70%);
  }

  /* ===== Aurora background ===== */
  .aurora {
    position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none;
  }
  .blob {
    position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.55; will-change: transform;
  }
  .blob-1 {
    width: 50vmax; height: 50vmax;
    background: radial-gradient(circle, #2a5aff 0%, transparent 70%);
    top: -10%; left: -10%; animation: drift1 22s ease-in-out infinite alternate;
  }
  .blob-2 {
    width: 45vmax; height: 45vmax;
    background: radial-gradient(circle, #4b8bff 0%, transparent 70%);
    bottom: -15%; right: -10%; animation: drift2 28s ease-in-out infinite alternate;
  }
  .blob-3 {
    width: 35vmax; height: 35vmax;
    background: radial-gradient(circle, #6ea8ff 0%, transparent 70%);
    top: 30%; right: 20%; opacity: 0.35; animation: drift3 18s ease-in-out infinite alternate;
  }
  @keyframes drift1 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(20vw,10vh) scale(1.15)} 100%{transform:translate(10vw,25vh) scale(0.95)} }
  @keyframes drift2 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(-15vw,-10vh) scale(1.1)} 100%{transform:translate(-25vw,5vh) scale(0.9)} }
  @keyframes drift3 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(-20vw,15vh) scale(1.2)} 100%{transform:translate(15vw,-10vh) scale(0.85)} }

  .stars {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 12% 28%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 78% 64%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 35% 75%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 88% 18%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 55% 42%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.5px 1.5px at 22% 88%, rgba(255,255,255,0.5), transparent);
  }

  /* ===== Top bar ===== */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 90;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    font-size: 12px;
  }
  .top-bar .label { opacity: 0.7; letter-spacing: 0.3px; }
  .top-bar .crumb { color: var(--accent-2); font-weight: 500; }
  .top-bar .crumb span { opacity: 0.5; margin: 0 6px; }

  /* ===== Back pill ===== */
  .back-pill {
    position: fixed; top: 50px; right: 18px; z-index: 80;
    background: rgba(255,255,255,0.08);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 8px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    font-family: inherit; backdrop-filter: blur(10px);
    transition: background 0.2s ease;
  }
  .back-pill:hover { background: rgba(255,255,255,0.16); }

  /* ===== Stage / Constellation ===== */
  .stage {
    position: relative; z-index: 1;
    height: 100vh; width: 100vw;
    display: flex; align-items: center; justify-content: center;
  }
  .constellation {
    position: relative;
    width: min(90vmin, 760px);
    height: min(90vmin, 760px);
  }
  .center-hub {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 30%; aspect-ratio: 1 / 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 30%, rgba(255,255,255,0.18), rgba(255,255,255,0.02) 70%),
      linear-gradient(135deg, rgba(110, 168, 255, 0.18), rgba(42, 90, 255, 0.1));
    backdrop-filter: blur(12px);
    border: 1.5px solid rgba(180, 210, 255, 0.3);
    box-shadow:
      0 0 60px rgba(110, 168, 255, 0.45),
      inset 0 0 40px rgba(255, 255, 255, 0.05);
    overflow: hidden;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    z-index: 5;
    animation: hubPulse 5s ease-in-out infinite alternate;
  }
  @keyframes hubPulse {
    from { box-shadow: 0 0 60px rgba(110, 168, 255, 0.35), inset 0 0 40px rgba(255,255,255,0.05); }
    to   { box-shadow: 0 0 90px rgba(110, 168, 255, 0.6),  inset 0 0 50px rgba(255,255,255,0.08); }
  }
  .center-hub .center-info {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 6%;
  }
  .center-hub .center-info .emoji {
    font-size: clamp(28px, 5vmin, 48px);
    margin-bottom: 4px;
    filter: drop-shadow(0 0 12px rgba(110,168,255,0.7));
  }
  .center-hub .center-info h2 {
    margin: 0 0 4px 0;
    font-size: clamp(13px, 2vmin, 20px);
    font-weight: 700; line-height: 1.15;
  }
  .center-hub .center-info p {
    margin: 0;
    font-size: clamp(9px, 1.3vmin, 12px);
    color: var(--text-dim); line-height: 1.3;
  }

  /* Satellites */
  .satellite {
    position: absolute; top: 50%; left: 50%;
    --angle: 0deg; --radius: 34vmin;
    transform:
      translate(-50%, -50%)
      rotate(var(--angle))
      translateY(calc(var(--radius) * -1))
      rotate(calc(var(--angle) * -1));
    width: 22vmin; height: 22vmin;
    pointer-events: none;
    animation: floatY 6s ease-in-out infinite alternate;
  }
  .satellite.s-2 { animation-delay: -1s; }
  .satellite.s-3 { animation-delay: -2s; }
  @keyframes floatY {
    from { transform: translate(-50%,-50%) rotate(var(--angle)) translateY(calc(var(--radius)*-1)) rotate(calc(var(--angle)*-1)); }
    to   { transform: translate(-50%,-50%) rotate(var(--angle)) translateY(calc((var(--radius)*-1) - 6px)) rotate(calc(var(--angle)*-1)); }
  }
  .satellite .label {
    position: absolute; left: 50%; bottom: calc(78% + 10px);
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: clamp(11px, 1.7vmin, 15px); font-weight: 600;
    color: var(--text);
    text-shadow: 0 0 14px rgba(0,0,0,0.85), 0 2px 8px rgba(0,0,0,0.6);
    pointer-events: none;
    animation: labelFloat 4s ease-in-out infinite alternate;
  }
  @keyframes labelFloat {
    from { transform: translateX(-50%) translateY(0); }
    to   { transform: translateX(-50%) translateY(-4px); }
  }
  .satellite .sub-label {
    position: absolute; left: 50%; top: calc(78% - 4px);
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: clamp(9px, 1.3vmin, 11px); font-weight: 500;
    color: var(--accent-2); opacity: 0.85;
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
    pointer-events: none;
  }
  .satellite .orb {
    position: absolute; bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 78%; aspect-ratio: 1 / 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,0.22), rgba(255,255,255,0.02) 65%),
      var(--orb-bg);
    backdrop-filter: blur(8px);
    border: 1.5px solid var(--orb-border);
    box-shadow: 0 0 30px var(--orb-glow), inset 0 0 20px rgba(255,255,255,0.04);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(28px, 5.5vmin, 52px);
    cursor: pointer; pointer-events: auto;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .satellite .orb:hover {
    transform: translateX(-50%) scale(1.12);
    box-shadow: 0 0 50px rgba(180, 210, 255, 0.7), inset 0 0 30px rgba(255,255,255,0.1);
    border-color: rgba(220, 235, 255, 0.7);
  }
  .satellite.s-1 .orb { box-shadow: 0 0 30px rgba(255, 180, 100, 0.45), inset 0 0 20px rgba(255,255,255,0.04); }
  .satellite.s-2 .orb { box-shadow: 0 0 30px rgba(255, 120, 180, 0.4),  inset 0 0 20px rgba(255,255,255,0.04); }

  .lines { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .lines line { stroke: rgba(180, 210, 255, 0.12); stroke-width: 1; stroke-dasharray: 3 5; }

  /* ===== Exercise template ===== */
  .exercise-stage {
    position: relative; z-index: 1;
    min-height: 100vh; width: 100vw;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    padding: 80px 20px 110px;
    gap: 22px;
  }
  .ex-header {
    text-align: center;
    display: flex; flex-direction: column; gap: 6px;
    align-items: center;
  }
  .ex-code {
    font-size: 12px; letter-spacing: 1.5px; font-weight: 600;
    color: var(--accent); opacity: 0.85; text-transform: uppercase;
  }
  .ex-title {
    margin: 0; font-size: clamp(22px, 3.5vmin, 32px); font-weight: 700;
  }
  .ex-progress {
    font-size: 13px; color: var(--text-dim); margin-top: 4px;
  }
  .ex-prompt {
    margin: 0; font-size: clamp(15px, 2vmin, 18px);
    color: var(--text-dim); max-width: 700px; text-align: center;
    line-height: 1.5;
  }
  .play-pad {
    width: clamp(110px, 18vmin, 180px); height: clamp(110px, 18vmin, 180px);
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,0.25), rgba(255,255,255,0.05) 70%),
      linear-gradient(135deg, rgba(110, 168, 255, 0.4), rgba(42, 90, 255, 0.25));
    backdrop-filter: blur(12px);
    border: 1.5px solid rgba(180, 210, 255, 0.45);
    color: #fff;
    box-shadow: 0 0 60px rgba(110, 168, 255, 0.5), inset 0 0 30px rgba(255,255,255,0.08);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(42px, 7vmin, 72px);
    font-family: inherit;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    animation: hubPulse 5s ease-in-out infinite alternate;
  }
  .play-pad:hover {
    transform: scale(1.06);
    box-shadow: 0 0 80px rgba(180, 210, 255, 0.7), inset 0 0 40px rgba(255,255,255,0.15);
  }

  .ex-answers {
    display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center; align-items: center;
    max-width: 800px;
  }
  .ans-chip {
    background: var(--glass-bg);
    border: 1.5px solid var(--glass-border);
    backdrop-filter: blur(8px);
    color: var(--text);
    padding: 10px 22px;
    border-radius: 999px;
    font-size: clamp(13px, 1.7vmin, 16px);
    font-weight: 600;
    cursor: pointer; font-family: inherit;
    transition: all 0.2s ease;
    min-width: 60px;
  }
  .ans-chip:hover {
    background: rgba(110, 168, 255, 0.2);
    border-color: rgba(180, 210, 255, 0.5);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(110, 168, 255, 0.3);
  }
  .ans-chip.active {
    background: rgba(110, 168, 255, 0.28);
    border-color: var(--accent);
    box-shadow: 0 0 18px rgba(110, 168, 255, 0.4);
  }

  .ex-footer {
    position: fixed; bottom: 18px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 14px;
    align-items: center;
    z-index: 70;
    flex-wrap: wrap;
    padding: 0 16px;
  }
  .hint-btn, .skip-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-dim);
    padding: 8px 16px; border-radius: 999px;
    font-size: 12px; font-family: inherit;
    cursor: pointer;
    backdrop-filter: blur(10px);
  }
  .hint-btn:hover, .skip-btn:hover { color: var(--text); background: rgba(255,255,255,0.12); }

  .toggles-row {
    display: flex; gap: 8px; margin-top: 4px;
    flex-wrap: wrap; justify-content: center;
  }
  .pill-toggle {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-dim);
    padding: 5px 12px; border-radius: 999px;
    font-size: 11px; font-family: inherit;
    cursor: pointer;
  }
  .pill-toggle.active { background: rgba(110, 168, 255, 0.25); border-color: var(--accent); color: var(--text); }

  .control-row {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    justify-content: center;
  }
  .select-pill {
    background: rgba(255,255,255,0.06);
    border: 1.5px solid var(--glass-border);
    color: var(--text);
    padding: 6px 14px; border-radius: 999px;
    font-size: 13px; font-family: inherit;
    cursor: pointer;
  }
  .select-pill .v { color: var(--accent); font-weight: 600; margin-inline-start: 6px; }

  /* Staff mock — used by melodic dictation */
  .staff-mock {
    background: rgba(255,255,255,0.06);
    border: 1.5px solid var(--glass-border);
    border-radius: 14px;
    height: 140px;
    position: relative;
    overflow: hidden;
    padding: 24px 28px;
  }
  .staff-line {
    height: 2px; background: rgba(180,210,255,0.4);
    margin-bottom: 18px;
  }
  .staff-line:last-child { margin-bottom: 0; }
  .staff-note {
    position: absolute;
    width: 22px; height: 16px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 14px var(--accent);
  }
</style>

<style id="global-drawer">
  .levels-trigger {
    position: fixed; top: 50px; left: 18px; z-index: 80;
    background: rgba(255,255,255,0.08);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 8px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 600; cursor: pointer;

  }
  .levels-trigger .current-level {
    color: var(--accent); font-weight: 700;
  }

  .levels-overlay {
    position: fixed; inset: 0; z-index: 200;

    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .levels-overlay.open { opacity: 1; pointer-events: auto; }

  .levels-drawer {
    position: fixed; top: 0; bottom: 0; left: 0;
    width: min(380px, 90vw);
    z-index: 210;
    background:
      linear-gradient(180deg, rgba(13, 42, 122, 0.85), rgba(10, 31, 92, 0.92));
    border-right: 1.5px solid var(--glass-border);
    backdrop-filter: blur(16px);
    box-shadow: 4px 0 40px rgba(0, 0, 0, 0.5),
                inset -1px 0 0 rgba(180, 210, 255, 0.08);
    transform: translateX(-105%);
    transition: transform 0.32s cubic-bezier(0.2, 0.7, 0.2, 1);
    display: flex; flex-direction: column;
    direction: rtl;
  }
  .levels-drawer.open { transform: translateX(0); }

  .levels-drawer-header {
    padding: 18px 20px 14px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(180, 210, 255, 0.12);
  }
  .levels-drawer-title {
    margin: 0;
    font-size: 17px; font-weight: 700;
    color: var(--text);
    display: flex; align-items: center; gap: 10px;
  }
  .levels-drawer-title .ex-tag {
    font-size: 11px; letter-spacing: 1.5px;
    color: var(--accent);
    padding: 3px 8px; border-radius: 6px;
    background: rgba(110, 168, 255, 0.15);
    border: 1px solid rgba(110, 168, 255, 0.3);
  }
  .levels-drawer-close {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-dim);
    width: 32px; height: 32px;
    border-radius: 50%;
    font-size: 16px; cursor: pointer;
    font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease;
  }
  .levels-drawer-close:hover {
    background: rgba(255,255,255,0.14);
    color: var(--text);
  }

  .levels-drawer-list {
    list-style: none;
    margin: 0; padding: 12px;
    overflow-y: auto;
    flex: 1;
    display: flex; flex-direction: column; gap: 6px;
  }
  .levels-drawer-list::-webkit-scrollbar { width: 6px; }
  .levels-drawer-list::-webkit-scrollbar-thumb {
    background: rgba(180, 210, 255, 0.2);
    border-radius: 3px;
  }

  .level-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.03);
    border: 1.5px solid transparent;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .level-item:hover {
    background: rgba(110, 168, 255, 0.1);
    border-color: rgba(180, 210, 255, 0.2);
  }
  .level-item.active {
    background: rgba(110, 168, 255, 0.18);
    border-color: var(--accent);
    box-shadow: 0 0 18px rgba(110, 168, 255, 0.35),
                inset 0 0 14px rgba(110, 168, 255, 0.08);
  }
  .level-item.locked {
    opacity: 0.45; cursor: not-allowed;
  }
  .level-item.locked:hover {
    background: rgba(255,255,255,0.03);
    border-color: transparent;
  }
  .level-item-num {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    border: 1.5px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .level-item.active .level-item-num {
    background: var(--accent);
    border-color: var(--accent-2);
    color: #051030;
    box-shadow: 0 0 12px rgba(110, 168, 255, 0.7);
  }
  .level-item.completed .level-item-num {
    background: rgba(120, 220, 180, 0.25);
    border-color: rgba(120, 220, 180, 0.6);
    color: #e0fff0;
  }
  .level-item-label {
    flex: 1;
    font-size: 13px; font-weight: 500;
    color: var(--text);
  }
  .level-item.active .level-item-label { color: var(--accent-2); font-weight: 600; }
  .level-item-icon {
    font-size: 13px;
    color: var(--text-dim);
  }
  .level-item.completed .level-item-icon { color: rgba(120, 220, 180, 0.9); }
  .level-item.locked .level-item-icon { color: var(--text-dim); }

  /* settings strip — shared between sections (same style as melodic-settings-strip) */
  .ex-settings-strip {
    width: 100%;
    max-width: 900px;
    border-top: 1px dashed rgba(180, 210, 255, 0.18);
    padding-top: 16px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .ex-settings-strip .strip-title {
    font-size: 10px; letter-spacing: 1.5px;
    color: var(--text-dim); text-transform: uppercase;
  }

  /* standalone preview helpers */
  .preview-section {
    position: relative;
    min-height: 100vh;
  }
  .preview-section + .preview-section {
    border-top: 1px dashed rgba(180, 210, 255, 0.12);
  }
  .preview-marker {
    position: absolute; top: 50px; left: 50%;
    transform: translateX(-50%);
    z-index: 75;
    background: rgba(0, 0, 0, 0.5);
    color: var(--accent-2);
    border: 1px solid rgba(180, 210, 255, 0.25);
    padding: 6px 16px; border-radius: 999px;
    font-size: 11px; letter-spacing: 1.2px;
    backdrop-filter: blur(10px);
  }
</style>

<!-- ============================================================
     SECTION STYLES — Dictation fragment additions
     All new classes prefixed `dictation-`. Justifications inline.
     ============================================================ -->
<style id="section-dictation">

  /* ============================================================
     RHYTHMIC DICTATION
     ============================================================
     The Rhythmic Dictation exercise is a complex tool that needs a
     visual representation of a rhythm grid (4 bars × 4 beats × 4
     subdivisions). No canon class exists for a 2-D rhythm grid, so
     we introduce `dictation-rhythm-grid` and friends. The duration
     palette uses canon `.ans-chip` with a `dictation-duration-chip`
     modifier so we keep the canonical pill look while enlarging the
     glyph.
     ============================================================ */

  /* ---- Phase banner ----
     Mirrors the .rt-phase indicator in RhythmDictation.jsx.
     Justification: communicates IDLE / PLAYING / WAITING / RECORDING /
     RESULT state — a critical part of this exercise's UX.            */
  .dictation-phase-banner {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 14px; font-weight: 600;
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid var(--glass-border);
    color: var(--text);
    transition: all 0.25s ease;
  }
  .dictation-phase-banner.phase-recording {
    background: rgba(255, 80, 80, 0.18);
    border-color: rgba(255, 120, 120, 0.55);
    color: #ffd6d6;
    box-shadow: 0 0 24px rgba(255, 80, 80, 0.35);
  }
  .dictation-phase-banner.phase-playing {
    background: rgba(110, 168, 255, 0.2);
    border-color: var(--accent);
    color: var(--accent-2);
    box-shadow: 0 0 18px rgba(110, 168, 255, 0.4);
  }
  .dictation-phase-banner.phase-waiting {
    background: rgba(255, 200, 100, 0.15);
    border-color: rgba(255, 220, 130, 0.5);
    color: #ffe9b8;
  }
  .dictation-phase-banner .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 8px currentColor;
    animation: dictationPulse 1.1s ease-in-out infinite alternate;
  }
  @keyframes dictationPulse {
    from { opacity: 0.4; }
    to   { opacity: 1; }
  }

  /* ---- Beat counter row ----
     Mirrors .rt-beat-row + .rt-beat-dot from RhythmDictation. A row
     of small "1 2 3 4 | 1 2 3 4 | ..." dots with the active beat
     highlighted. Sits ABOVE the rhythm input grid (the dots show the
     metronome position; the grid shows where the student's hits go). */
  .dictation-beat-counter {
    display: flex; align-items: center; gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .dictation-beat-counter .bar-sep {
    color: var(--text-dim);
    font-size: 22px; opacity: 0.5;
  }
  .dictation-beat-counter .bar-group {
    display: flex; gap: 6px;
  }
  .dictation-beat-dot {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    border: 1.5px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
    color: var(--text-dim);
    transition: all 0.18s ease;
  }
  .dictation-beat-dot.accent {
    border-color: rgba(180, 210, 255, 0.35);
  }
  .dictation-beat-dot.active-play {
    background: rgba(110, 168, 255, 0.4);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 16px rgba(110, 168, 255, 0.7);
    transform: scale(1.12);
  }
  .dictation-beat-dot.active-rec {
    background: rgba(255, 80, 80, 0.4);
    border-color: rgba(255, 120, 120, 0.8);
    color: #fff;
    box-shadow: 0 0 16px rgba(255, 80, 80, 0.7);
    transform: scale(1.12);
  }

  /* ---- Rhythm input grid ----
     ⭐ THE CENTERPIECE. A 2-D matrix where each ROW is a beat (across
     all bars), and each COLUMN is a 16th-note subdivision within that
     beat. Cells are clickable — clicking marks a "hit" at that
     subdivision. Cells on the downbeat (subdivision 0) are styled
     stronger. The accent column is the "&" eighth-note position.
     Justification: no canon component represents subdivided-beat input.
     `.chord-grid` from canon is for chord bars (4-column block grid);
     it isn't subdivision-aware. We invent a new class.            */
  .dictation-rhythm-grid {
    display: grid;
    gap: 6px;
    background: rgba(255, 255, 255, 0.03);
    border: 1.5px solid var(--glass-border);
    border-radius: 16px;
    padding: 16px;
    backdrop-filter: blur(10px);
    box-shadow: inset 0 0 30px rgba(110, 168, 255, 0.04);
    width: min(720px, 96vw);
  }
  .dictation-rhythm-grid-row {
    display: grid;
    grid-template-columns: 60px repeat(16, 1fr);
    gap: 4px;
    align-items: center;
  }
  .dictation-rhythm-grid-row.is-bar-divider {
    border-top: 1px dashed rgba(180, 210, 255, 0.18);
    padding-top: 8px;
    margin-top: 4px;
  }
  .dictation-rhythm-row-label {
    font-size: 11px; font-weight: 600;
    color: var(--text-dim);
    text-align: center;
    letter-spacing: 0.5px;
  }
  .dictation-rhythm-row-label .bar-num {
    color: var(--accent-2);
    font-weight: 700;
  }
  .dictation-rhythm-cell {
    aspect-ratio: 1 / 1;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(180, 210, 255, 0.1);
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    color: var(--text-dim);
    position: relative;
  }
  .dictation-rhythm-cell:hover {
    background: rgba(110, 168, 255, 0.15);
    border-color: rgba(180, 210, 255, 0.4);
  }
  /* Downbeat (subdivision 0) — slightly stronger */
  .dictation-rhythm-cell.is-downbeat {
    background: rgba(255, 255, 255, 0.07);
    border-color: rgba(180, 210, 255, 0.25);
  }
  /* The "&" eighth — visual separator */
  .dictation-rhythm-cell.is-eighth {
    background: rgba(255, 255, 255, 0.05);
  }
  /* Active hit — student has placed a note here */
  .dictation-rhythm-cell.is-hit {
    background: rgba(110, 168, 255, 0.55);
    border-color: var(--accent-2);
    color: #fff;
    box-shadow: 0 0 12px rgba(110, 168, 255, 0.65),
                inset 0 0 8px rgba(255, 255, 255, 0.2);
    font-weight: 700;
  }
  /* Expected onset position — shown during result phase */
  .dictation-rhythm-cell.is-expected {
    border-color: rgba(120, 220, 180, 0.65);
    box-shadow: 0 0 8px rgba(120, 220, 180, 0.4);
  }
  .dictation-rhythm-cell.is-expected.is-hit {
    background: rgba(120, 220, 180, 0.55);
    border-color: rgba(140, 240, 200, 0.95);
    box-shadow: 0 0 14px rgba(120, 220, 180, 0.7);
  }
  /* Missed expected — shows what was expected but not played */
  .dictation-rhythm-cell.is-missed {
    background: rgba(255, 100, 100, 0.18);
    border-color: rgba(255, 130, 130, 0.6);
  }
  /* Active column = where the metronome is currently sweeping */
  .dictation-rhythm-cell.is-now {
    border-color: var(--accent);
    box-shadow: 0 0 14px rgba(110, 168, 255, 0.85);
    animation: dictationCellPulse 0.4s ease-in-out;
  }
  @keyframes dictationCellPulse {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.18); }
    100% { transform: scale(1); }
  }

  /* ---- Duration palette ----
     Sits below the grid; chooses the duration glyph that gets
     "stamped" onto the next cell click. Reuses .ans-chip for the
     canon pill look, adds .dictation-duration-chip for the larger
     music-glyph typography.                                        */
  .ex-answers.dictation-duration-row {
    gap: 12px;
    max-width: 720px;
  }
  .ans-chip.dictation-duration-chip {
    padding: 10px 16px;
    min-width: 64px;
    display: inline-flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .ans-chip.dictation-duration-chip .glyph {
    font-size: 24px; line-height: 1;
    color: var(--accent-2);
    filter: drop-shadow(0 0 8px rgba(110, 168, 255, 0.55));
  }
  .ans-chip.dictation-duration-chip .glyph-label {
    font-size: 9px; letter-spacing: 0.8px; text-transform: uppercase;
    color: var(--text-dim);
  }
  .ans-chip.dictation-duration-chip.active .glyph { color: #fff; }
  .ans-chip.dictation-duration-chip.active .glyph-label { color: var(--accent-2); }

  /* ---- Submit / result bar ----
     Mirrors .rt-eval-bar from RhythmDictation. Justification: this
     exercise has explicit pass/fail per round with extra detail
     (matched / total / extra-hits). Canon .ans-chip alone doesn't
     express that.                                                  */
  .dictation-submit-row {
    display: flex; gap: 12px; align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }
  .dictation-submit-btn {
    background: linear-gradient(135deg, rgba(110, 168, 255, 0.55), rgba(42, 90, 255, 0.4));
    border: 1.5px solid var(--accent);
    color: #fff;
    padding: 12px 32px;
    border-radius: 999px;
    font-size: 15px; font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 0 30px rgba(110, 168, 255, 0.45);
    transition: all 0.2s ease;
  }
  .dictation-submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 30px rgba(180, 210, 255, 0.6);
  }
  .dictation-clear-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1.5px solid var(--glass-border);
    color: var(--text-dim);
    padding: 10px 20px; border-radius: 999px;
    font-size: 13px; font-family: inherit;
    cursor: pointer;
  }
  .dictation-clear-btn:hover {
    background: rgba(255, 100, 100, 0.18);
    border-color: rgba(255, 130, 130, 0.5);
    color: #ffd6d6;
  }

  /* ---- VU meter row ----
     Mirrors the .rt-vu-row + VUMeter component. The Rhythmic
     Dictation tool detects live mic onsets, so a VU meter is part
     of its identity. Built from 16 segments; lit segments green →
     yellow → red.                                                  */
  .dictation-vu-row {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px;
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid var(--glass-border);
    border-radius: 999px;
  }
  .dictation-vu-label { font-size: 14px; }
  .dictation-vu-meter {
    display: flex; gap: 3px;
    height: 18px;
  }
  .dictation-vu-seg {
    width: 6px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 1.5px;
    transition: background 0.05s linear;
  }
  .dictation-vu-seg.lit.green  { background: #4caf50; box-shadow: 0 0 5px #4caf50; }
  .dictation-vu-seg.lit.yellow { background: #ffc107; box-shadow: 0 0 5px #ffc107; }
  .dictation-vu-seg.lit.red    { background: #f44336; box-shadow: 0 0 5px #f44336; }
  .dictation-vu-rec {
    font-size: 11px; font-weight: 700;
    letter-spacing: 1.2px;
    color: #ff7878;
    text-shadow: 0 0 8px rgba(255, 120, 120, 0.7);
    animation: dictationPulse 1s ease-in-out infinite alternate;
  }

  /* ============================================================
     MELODIC DICTATION
     ============================================================
     The Melodic Dictation exercise asks the student to write the
     notes they heard onto a staff (or by clicking degree chips).
     We need:
       1. A staff with N empty SLOTS (one per beat).
       2. A bank of degree chips (Do/Re/Mi/…) that get placed into
          the active slot.
       3. A tonic key selector and a mode toggle (mic / button).
     Canon `.staff-mock` gives us the bare staff lines; canon
     `.ans-chip` gives us the chip look. We need the SLOT class
     specifically — that's the unique melodic-dictation widget.
     ============================================================ */

  /* ---- Staff with empty slots ----
     The wrapper around .staff-mock containing positioned slot
     buttons. Slots are clickable to receive the active degree.   */
  .dictation-melodic-staff-wrap {
    position: relative;
    width: min(640px, 96vw);
  }
  .dictation-melodic-staff-wrap .staff-mock {
    height: 150px;
    padding: 28px 40px;
  }
  /* Wraps the row of clickable slots overlaid on the staff. */
  .dictation-melodic-slots {
    position: absolute;
    top: 50%; left: 6%; right: 6%;
    transform: translateY(-50%);
    display: flex;
    justify-content: space-around;
    align-items: center;
    pointer-events: none; /* slots themselves re-enable */
  }
  /* A single empty slot — an ellipse outlined dashed waiting for a
     note. When filled, shows the degree name; on `current` shows a
     blinking ring. Replaces .staff-note for input mode.            */
  .dictation-melodic-slot {
    pointer-events: auto;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    border: 2px dashed rgba(180, 210, 255, 0.35);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
  }
  .dictation-melodic-slot:hover {
    background: rgba(110, 168, 255, 0.12);
    border-color: rgba(180, 210, 255, 0.7);
    color: var(--text);
    transform: scale(1.08);
  }
  .dictation-melodic-slot.is-filled {
    background: var(--accent);
    border: 2px solid var(--accent-2);
    color: #051030;
    box-shadow: 0 0 16px rgba(110, 168, 255, 0.65);
  }
  .dictation-melodic-slot.is-current {
    border-style: solid;
    border-color: var(--accent-2);
    box-shadow: 0 0 18px rgba(180, 210, 255, 0.7),
                inset 0 0 10px rgba(180, 210, 255, 0.2);
    animation: dictationSlotPulse 1.2s ease-in-out infinite alternate;
  }
  @keyframes dictationSlotPulse {
    from { box-shadow: 0 0 18px rgba(180, 210, 255, 0.45),
                       inset 0 0 8px rgba(180, 210, 255, 0.1); }
    to   { box-shadow: 0 0 28px rgba(180, 210, 255, 0.9),
                       inset 0 0 14px rgba(180, 210, 255, 0.3); }
  }
  .dictation-melodic-slot.is-correct {
    background: rgba(120, 220, 180, 0.65);
    border-color: rgba(140, 240, 200, 0.95);
    color: #053024;
    box-shadow: 0 0 14px rgba(120, 220, 180, 0.7);
  }
  .dictation-melodic-slot.is-wrong {
    background: rgba(255, 100, 100, 0.4);
    border-color: rgba(255, 130, 130, 0.85);
    color: #fff;
    box-shadow: 0 0 14px rgba(255, 100, 100, 0.55);
  }

  /* Beat-number label above each slot (1 2 3 4) */
  .dictation-melodic-slot-number {
    position: absolute;
    top: -22px; left: 50%;
    transform: translateX(-50%);
    font-size: 10px; color: var(--text-dim);
    letter-spacing: 0.8px;
  }

  /* ---- Degree chip bank ----
     A row of Do/Re/Mi/Fa/Sol/La/Ti chips. Reuses .ans-chip with
     `.dictation-degree-chip` for the larger-typography variant.
     The numeric-degree alternative (1 2 3 …) shares the same chip. */
  .ex-answers.dictation-degree-bank {
    gap: 8px;
    max-width: 720px;
  }
  .ans-chip.dictation-degree-chip {
    min-width: 56px;
    padding: 10px 16px;
    font-size: 15px;
    display: inline-flex; flex-direction: column; align-items: center; gap: 1px;
  }
  .ans-chip.dictation-degree-chip .deg-glyph {
    font-size: 16px; font-weight: 700;
    color: var(--text);
  }
  .ans-chip.dictation-degree-chip .deg-sub {
    font-size: 9px; letter-spacing: 0.5px;
    color: var(--text-dim);
  }
  .ans-chip.dictation-degree-chip.active {
    box-shadow: 0 0 22px rgba(110, 168, 255, 0.6);
  }

  /* ---- Mode toggle (mic / button entry) ----
     Mirrors the mic-vs-button input mode in Exercise3.jsx. Reuses
     canon `.pill-toggle`. No new class needed for the toggle itself.
     But we DO have a dedicated `dictation-mic-card` for the live
     pitch read-out + hold-bar (mirrors .ex3-pitch-row).            */
  .dictation-mic-card {
    width: min(420px, 92vw);
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid var(--glass-border);
    border-radius: 14px;
    padding: 12px 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .dictation-mic-card.pitch-correct {
    border-color: rgba(120, 220, 180, 0.55);
    background: rgba(120, 220, 180, 0.08);
  }
  .dictation-mic-card.pitch-active {
    border-color: rgba(180, 210, 255, 0.5);
    background: rgba(110, 168, 255, 0.08);
  }
  .dictation-mic-card-row {
    display: flex; align-items: baseline; gap: 12px;
    justify-content: center;
  }
  .dictation-pitch-note {
    font-size: 32px; font-weight: 800;
    color: var(--accent-2);
    line-height: 1;
  }
  .dictation-pitch-detail {
    font-size: 13px; color: var(--text-dim);
  }
  .dictation-pitch-cents {
    color: var(--accent); margin-inline-start: 6px;
  }
  .dictation-hold-bar-wrap {
    width: 100%; height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px; overflow: hidden;
  }
  .dictation-hold-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 8px rgba(110, 168, 255, 0.7);
    transition: width 0.06s linear;
  }

  /* ---- Tonic key selector ----
     Compact pill ribbon (C, C#, D, … ) — different visual from
     `.toggles-row` because it's chromatic and benefits from a
     single neat row.                                              */
  .dictation-tonic-ribbon {
    display: flex; gap: 4px; flex-wrap: wrap; justify-content: center;
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid var(--glass-border);
  }
  .dictation-tonic-key {
    min-width: 34px; height: 30px;
    border-radius: 999px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-dim);
    font-size: 12px; font-weight: 600;
    cursor: pointer;
    padding: 0 8px;
    font-family: inherit;
    transition: all 0.15s ease;
  }
  .dictation-tonic-key:hover {
    background: rgba(110, 168, 255, 0.12);
    color: var(--text);
  }
  .dictation-tonic-key.active {
    background: var(--accent);
    color: #051030;
    font-weight: 800;
    box-shadow: 0 0 12px rgba(110, 168, 255, 0.6);
  }

  /* ---- Sequence dots (legacy ex3 visual) ----
     Mirrors .ex3-beat-row in Exercise3.jsx — small per-note status
     dots showing right/wrong feedback during the result phase.
     Shown ABOVE the staff for compact at-a-glance feedback.       */
  .dictation-sequence-dots {
    display: flex; gap: 8px; align-items: center;
    justify-content: center;
  }
  .dictation-sequence-dot {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    border: 1.5px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    color: var(--text-dim);
  }
  .dictation-sequence-dot.correct {
    background: rgba(120, 220, 180, 0.45);
    border-color: rgba(140, 240, 200, 0.85);
    color: #e0fff0;
  }
  .dictation-sequence-dot.wrong {
    background: rgba(255, 100, 100, 0.32);
    border-color: rgba(255, 130, 130, 0.75);
    color: #ffe6e6;
  }
  .dictation-sequence-dot.cur-play {
    background: rgba(110, 168, 255, 0.4);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 12px rgba(110, 168, 255, 0.7);
  }
  .dictation-sequence-dot.cur-listen {
    background: rgba(255, 220, 130, 0.32);
    border-color: rgba(255, 220, 130, 0.7);
    color: #fff;
  }
</style>
</head>

<script>
  // ===== Level data (mirrors LEVEL_DESCRIPTIONS in RhythmTraining.jsx
  //                  and EX3_LEVELS in Exercise3.jsx) =====
  const RD_LEVELS = [
    { n:  1, label: 'רמה 1 — רבעיות',           done: true },
    { n:  2, label: 'רמה 2 — שמיניות',          done: true, current: true },
    { n:  3, label: 'רמה 3 — סינקופות',         done: false },
    { n:  4, label: 'רמה 4 — שש-עשרות',         done: false },
    { n:  5, label: 'רמה 5 ³ — שלישיות (♩)',    done: false },
    { n:  6, label: 'רמה 6 ³ — שלישיות (𝅗𝅥)',  done: false, locked: true },
    { n:  7, label: 'רמה 7 ³ — סווינג',         done: false, locked: true },
    { n:  8, label: 'רמה 8 — דיספלייסמנט',     done: false, locked: true },
    { n:  9, label: 'רמה 9 ⁵ — קווינטולות',    done: false, locked: true },
    { n: 10, label: 'רמה 10 — פוליריתם',        done: false, locked: true },
    { n: 11, label: 'רמה 11 ⁷ — ספטולות',      done: false, locked: true },
    { n: 12, label: 'התאמה אישית',              done: false }
  ];
  const MD_LEVELS = [
    { n: 1, label: 'רמה 1 — דיאטוני קצר (3 תווים)',         done: true, current: true },

  // ===== Generic drawer renderer (same as melodic.html) =====
  function renderLevelsDrawer(exId, exTitle, levels) {
    const items = levels.map(l => {
      const classes = ['level-item'];
      if (l.current) classes.push('active');
      if (l.done && !l.current) classes.push('completed');
      if (l.locked) classes.push('locked');
      const icon = l.locked   ? '🔒'
                 : l.current  ? '●'
                 : l.done     ? '✓'
                 :              '';
      return `
        <li class="${classes.join(' ')}" onclick="${l.locked ? '' : `selectLevel('${exId}', ${l.n})`}">
          <span class="level-item-num">${l.n}</span>
          <span class="level-item-label">${l.label}</span>

      <div class="levels-overlay" id="levels-overlay-${exId}" onclick="toggleDrawer('${exId}')"></div>

  // ============================================================
  // VIEW 2 — Rhythmic Dictation
  // ============================================================
  // Builds a 4-bar × 4-beat × 4-subdivision grid.
  // Rows = bars (4). Each row contains 16 cells = 4 beats × 4 sixteenths.
  function buildRhythmGrid({ numBars = 4, hits = [], expected = [], currentCol = -1 } = {}) {
    const SUB_PER_BEAT = 4;
    const BEATS_PER_BAR = 4;
    const CELLS = BEATS_PER_BAR * SUB_PER_BEAT;
    const rows = [];
    for (let b = 0; b < numBars; b++) {
      const cells = [];
      for (let s = 0; s < CELLS; s++) {
        const sub = s % SUB_PER_BEAT;
        const cls = ['dictation-rhythm-cell'];
        if (sub === 0) cls.push('is-downbeat');
        if (sub === 2) cls.push('is-eighth');
        const key = `${b}-${s}`;
        if (hits.includes(key))     cls.push('is-hit');
        if (expected.includes(key)) cls.push('is-expected');
        if (currentCol === s && b === 1) cls.push('is-now'); // pretend metronome is sweeping bar 2
        const glyph = sub === 0 ? (s/SUB_PER_BEAT + 1) : (sub === 2 ? '&' : '');
        cells.push(`<div class="${cls.join(' ')}">${glyph}</div>`);
      }
      const rowCls = ['dictation-rhythm-grid-row'];
      if (b > 0) rowCls.push('is-bar-divider');
      rows.push(`
        <div class="${rowCls.join(' ')}">
          <div class="dictation-rhythm-row-label">תיבה <span class="bar-num">${b+1}</span></div>
          ${cells.join('')}
        </div>`);
    }
    return `<div class="dictation-rhythm-grid">${rows.join('')}</div>`;
  }

  function buildBeatCounter(numBars, activeBar, activeBeat, phase) {
    const bars = [];
    for (let b = 0; b < numBars; b++) {
      const dots = [];
      for (let beat = 0; beat < 4; beat++) {
        const cls = ['dictation-beat-dot'];
        if (beat === 0) cls.push('accent');
        if (b === activeBar && beat === activeBeat) {
          cls.push(phase === 'rec' ? 'active-rec' : 'active-play');
        }
        dots.push(`<div class="${cls.join(' ')}">${beat + 1}</div>`);
      }
      if (b > 0) bars.push(`<span class="bar-sep">|</span>`);
      bars.push(`<div class="bar-group">${dots.join('')}</div>`);
    }
    return `<div class="dictation-beat-counter">${bars.join('')}</div>`;
  }

  function buildVUMeter(level = 0.55, recording = true) {
    const SEGS = 16;
    const filled = Math.min(1, level * 4);
    const litCount = Math.round(filled * SEGS);
    const segs = [];
    for (let i = 0; i < SEGS; i++) {
      const lit = i < litCount;
      let color = '';
      if (lit) {
        if (i < SEGS * 0.6)       color = 'green';
        else if (i < SEGS * 0.85) color = 'yellow';
        else                       color = 'red';
      }
      segs.push(`<div class="dictation-vu-seg${lit ? ' lit ' + color : ''}"></div>`);
    }
    return `
      <div class="dictation-vu-row">
        <span class="dictation-vu-label">🎙</span>
        <div class="dictation-vu-meter">${segs.join('')}</div>
        ${recording ? '<span class="dictation-vu-rec">REC</span>' : ''}
      </div>`;
  }

        <button class="play-pad" title="נגן פטרן">▶</button>

        <!-- Beat counter — shows current metronome position -->

        <!-- THE GRID — 4 bars × 16 subdivisions -->

        </div>

        <!-- Settings strip — mirrors SettingsPanel in RhythmTraining.jsx -->
        <div class="ex-settings-strip">
          <div class="strip-title">הגדרות תרגיל</div>
          <div class="control-row">
            <span class="select-pill" style="cursor:default"><strong>טמפו:</strong> <span class="v">80 BPM</span></span>

            <span class="select-pill" style="cursor:default"><strong>שאלות:</strong> <span class="v">10</span></span>

  // ============================================================
  // VIEW 3 — Melodic Dictation
  // ============================================================
  function renderMelodicDictation() {
    const level = MD_LEVELS.find(l => l.current) || MD_LEVELS[0];

    // Sequence: 5 slots, 3 already filled (first three notes the student wrote),
    // slot 4 is the active one, slot 5 still empty.
    const slots = [
      { num: 1, fill: 'Do',  state: 'correct' },
      { num: 2, fill: 'Mi',  state: 'correct' },
      { num: 3, fill: 'Sol', state: 'wrong'   },  // wrote Sol, expected Fa
      { num: 4, fill: null,  state: 'current' },
      { num: 5, fill: null,  state: 'empty'   }
    ];
    const slotHtml = slots.map(s => {
      const cls = ['dictation-melodic-slot'];
      if (s.state === 'correct') cls.push('is-filled', 'is-correct');
      else if (s.state === 'wrong')   cls.push('is-filled', 'is-wrong');
      else if (s.state === 'current') cls.push('is-current');
      else if (s.fill)                cls.push('is-filled');
      return `
        <div class="${cls.join(' ')}">
          <div class="dictation-melodic-slot-number">${s.num}</div>
          ${s.fill ? s.fill : ''}
        </div>`;
    }).join('');

    // Status dots above the staff (sequence dots from Exercise3.jsx)
    const seqDots = slots.map(s => {
      const cls = ['dictation-sequence-dot'];
      if (s.state === 'correct') cls.push('correct');
      if (s.state === 'wrong')   cls.push('wrong');
      if (s.state === 'current') cls.push('cur-listen');
      return `<div class="${cls.join(' ')}">${s.fill || '♩'}</div>`;
    }).join('');

    // Degree-chip bank: Do/Re/Mi/Fa/Sol/La/Ti  (also showing numeric sub)
    const degrees = [
      { glyph: 'Do',  sub: '1' },
      { glyph: 'Re',  sub: '2' },
      { glyph: 'Mi',  sub: '3' },
      { glyph: 'Fa',  sub: '4', active: true },  // currently armed
      { glyph: 'Sol', sub: '5' },
      { glyph: 'La',  sub: '6' },
      { glyph: 'Ti',  sub: '7' }
    ];
    const degreeChips = degrees.map(d => `
      <button class="ans-chip dictation-degree-chip${d.active ? ' active' : ''}">
        <span class="deg-glyph">${d.glyph}</span>
        <span class="deg-sub">${d.sub}</span>
      </button>`).join('');

    // Tonic key ribbon (chromatic — C, C#, D, …)
    const TONICS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    const tonicHtml = TONICS.map(t =>
      `<button class="dictation-tonic-key${t === 'C' ? ' active' : ''}">${t}</button>`
    ).join('');

    return `
      ${renderLevelsTrigger('md', `רמה ${level.n}`)}
      <div class="exercise-stage">

          <div class="ex-code">MD · הכתבה מלודית</div>
          <h1 class="ex-title">הכתבה מלודית</h1>
          <div class="ex-progress">סבב 4 / 10  ·  הצלחות: 3/3  ·  ${level.label}</div>
        </div>

        <p class="ex-prompt">הקשב לרצף — רשום על המחומש את התווים ששמעת.</p>

        <button class="play-pad" title="נגן רצף">▶</button>

        <!-- Sequence status dots (mirrors .ex3-beat-row in Exercise3.jsx) -->
        ${`<div class="dictation-sequence-dots">${seqDots}</div>`}

        <!-- Staff with empty slots -->
        <div class="dictation-melodic-staff-wrap">
          <div class="staff-mock">
            <div class="staff-line"></div>
            <div class="staff-line"></div>
            <div class="staff-line"></div>
            <div class="staff-line"></div>
            <div class="staff-line"></div>
          </div>
          <div class="dictation-melodic-slots">
            ${slotHtml}
          </div>
        </div>

        <!-- Degree-chip bank -->
        <div class="ex-answers dictation-degree-bank">${degreeChips}</div>

        <!-- Degree-name toggle (mirrors DegreeNameToggle shared component) -->
        <div class="toggles-row">
          <button class="pill-toggle active">Do Re Mi</button>
          <button class="pill-toggle">1 2 3</button>
          <button class="pill-toggle">C D E</button>
        </div>

        <!-- Input-mode toggle: mic vs button -->
        <div class="toggles-row">
          <span style="font-size:11px; color:var(--text-dim); letter-spacing:1px">קלט:</span>
          <button class="pill-toggle">🎙 שירה</button>
          <button class="pill-toggle active">👆 לחיצה</button>
        </div>

        <!-- Live mic card (shown when mic mode is on; here greyed out) -->
        <div class="dictation-mic-card pitch-active" style="opacity:0.7">
          <div class="dictation-mic-card-row">
            <span class="dictation-pitch-note">F</span>
            <span class="dictation-pitch-detail">F4 <span class="dictation-pitch-cents">+8¢</span></span>
          </div>
          <div class="dictation-hold-bar-wrap">
            <div class="dictation-hold-bar" style="width:62%"></div>
          </div>
        </div>

        <!-- Tonic ribbon -->
        <div class="control-row" style="margin-top:4px">
          <span style="font-size:11px; color:var(--text-dim); letter-spacing:1px">טוניקה:</span>
          <div class="dictation-tonic-ribbon">${tonicHtml}</div>
        </div>

        <!-- Settings strip — mirrors ex3-settings-area in Exercise3.jsx -->
        <div class="ex-settings-strip">
          <div class="strip-title">הגדרות תרגיל</div>
          <div class="control-row">
            <span class="select-pill" style="cursor:default"><strong>טמפו:</strong> <span class="v">80 BPM</span></span>
            <span class="select-pill" style="cursor:default"><strong>סולם:</strong> <span class="v">Major</span></span>
            <span class="select-pill" style="cursor:default"><strong>אורך:</strong> <span class="v">5 תווים</span></span>
            <span class="select-pill" style="cursor:default"><strong>שאלות:</strong> <span class="v">10</span></span>
            <span class="select-pill" style="cursor:default"><strong>ניסיונות:</strong> <span class="v">2</span></span>
          </div>
          <div class="control-row" style="opacity:0.85">
            <span style="font-size:11px; color:var(--text-dim); letter-spacing:1px">סולם:</span>
            <button class="pill-toggle active">Major</button>
            <button class="pill-toggle">Minor</button>
            <button class="pill-toggle">Pent.</button>
            <span style="opacity:0.4; padding:0 4px">·</span>
            <span style="font-size:11px; color:var(--text-dim); letter-spacing:1px">כלי:</span>
            <button class="pill-toggle active">פסנתר</button>
            <button class="pill-toggle">גיטרה</button>
          </div>
        </div>

        <div class="ex-footer">
          <button class="hint-btn">💡 רמז</button>
          <button class="hint-btn">🔊 נגן שוב</button>
          <button class="hint-btn">🗑 נקה</button>
          <button class="skip-btn">דלג ⏭</button>
        </div>
      </div>
      ${renderLevelsDrawer('md', 'MD — הכתבה מלודית', MD_LEVELS)}
    `;
  }

  // ===== Standalone preview: stack all 3 views =====
  function renderStandalonePreview() {
    document.getElementById('app').innerHTML = `
      <section class="preview-section">
        <div class="preview-marker">VIEW 1 / 3  ·  dictation hub</div>
        ${renderDictationHub()}
      </section>
      <section class="preview-section">
        <div class="preview-marker">VIEW 2 / 3  ·  ex-rhythmic-dictation</div>
        ${renderRhythmicDictation()}
      </section>
      <section class="preview-section">
        <div class="preview-marker">VIEW 3 / 3  ·  ex-melodic-dictation</div>
        ${renderMelodicDictation()}
      </section>
    `;
    requestAnimationFrame(drawConstellationLines);
  }

  function drawConstellationLines() {
    const container = document.getElementById('cur-const');
    const svg = document.getElementById('cur-lines');
    if (!container || !svg) return;
    const w = container.clientWidth, h = container.clientHeight;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.innerHTML = '';
    const cRect = container.getBoundingClientRect();
    const cx = w / 2, cy = h / 2;
    container.querySelectorAll('.satellite .orb').forEach(orb => {
      const r = orb.getBoundingClientRect();
      const x = r.left + r.width / 2 - cRect.left;
      const y = r.top + r.height / 2 - cRect.top;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', cx); line.setAttribute('y1', cy);
      line.setAttribute('x2', x);  line.setAttribute('y2', y);
      svg.appendChild(line);
    });
  }

  // ===== Stubs (master assembler will override) =====
  function navigate(id) {
    const map = { 'dictation': 0, 'ex-rhythmic-dictation': 1, 'ex-melodic-dictation': 2 };
    const idx = map[id];
    if (idx != null) {
      document.querySelectorAll('.preview-section')[idx]
        ?.scrollIntoView({ behavior: 'smooth' });
    }
  }
  function goBack() { history.back(); }

  function toggleDrawer(exId) {
    const drawer  = document.getElementById(`levels-drawer-${exId}`);
    const overlay = document.getElementById(`levels-overlay-${exId}`);
    if (!drawer || !overlay) return;
    const open = !drawer.classList.contains('open');
    drawer.classList.toggle('open',  open);
    overlay.classList.toggle('open', open);
  }
  function selectLevel(exId, n) {
    toggleDrawer(exId);
    console.log(`[mockup] selectLevel ${exId} → ${n}`);
  }

  window.addEventListener('resize', drawConstellationLines);
  document.addEventListener('DOMContentLoaded', renderStandalonePreview);
</script>
